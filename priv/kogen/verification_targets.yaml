# Controller-owned verification target catalog. Keep this file exhaustive with
# the Make targets below; there is intentionally no aggregate live target.
targets:
  - name: check
    cost_class: offline-complete
    rank: 0
    dependencies: []
    provider_backed: false
    owner: scripts/check/offline.py

  - name: cold-offline
    cost_class: offline-cold
    rank: 50
    dependencies: [check]
    provider_backed: false
    owner: test/kogen/cold_offline_test.exs

  - name: live-general
    cost_class: provider-focused
    rank: 100
    dependencies: [check]
    provider_backed: true
    owner: test/kogen/live_test.exs
    covers: [test/kogen/live_test.exs]
    requires_login: route
    launched_roles: [reviewer]
    rehearsal:
      id: rehearse-live-general
      command: mix test --exclude live test/kogen/scenario_semantic_test.exs
      shared_entrypoints:
        - Kogen.ScenarioSemantic.write_fixture!
        - Kogen.ScenarioSemantic.review_response!
      correct_fixture: test/support/scenario_semantic.ex:corrected
      wrong_fixture: test/support/scenario_semantic.ex:incomplete
      trace_assertions:
        - Kogen.ScenarioSemantic.write_fixture!
        - Kogen.ScenarioSemantic.review_response!

  - name: live-shaping-quality
    cost_class: provider-evaluation
    rank: 200
    dependencies: [check]
    provider_backed: true
    owner: test/kogen/live_shaping_evaluation_test.exs
    covers: [test/kogen/live_shaping_evaluation_test.exs]
    requires_login: route
    launched_roles: [shaping]
    # Rehearsed in check (scenario prepare-rehearsed-in-check): the driver's
    # own standalone setup, up to but not including the first provider
    # dispatch (evidence/probe-prepare/REPORT.md P6a).
    prepare: [python3, -B, test/support/shaping_evaluation/driver.py, --prepare, suite]
    rehearsal:
      id: rehearse-live-shaping-quality
      command: mix test --exclude live test/kogen/shaping_evaluation_test.exs
      shared_entrypoints:
        - Kogen.ShapingDraftAudit.audit!
        - Kogen.ShapingEvaluation.Integrity.validate_manifest
      correct_fixture: test/support/shaping_evaluation/compact-fixtures-v2
      wrong_fixture: test/support/shaping_evaluation/semantic-counterexamples.json
      trace_assertions:
        - Kogen.ShapingDraftAudit.audit!
        - Kogen.ShapingEvaluation.Integrity.validate_manifest
      # Traced by driver.py's own `--prepare` mode (KOGEN_REHEARSAL_TRACE),
      # rehearsed in scripts/check/rehearsals.exs against a controlled
      # passing and failing scope, independent of shared_entrypoints above.
      prepare_trace_assertions:
        - driver.prepare_login_scope_ok
        - driver.prepare_toolchain_ok
        - driver.setup_continuation_seed

  - name: live-shaping-smoke
    cost_class: provider-evaluation
    rank: 150
    dependencies: [check]
    provider_backed: true
    owner: test/kogen/live_shaping_smoke_test.exs
    covers: [test/kogen/live_shaping_smoke_test.exs]
    requires_login: route
    launched_roles: [shaping]
    # Same driver, `smoke` case (mechanics only, no grading; scenario
    # shaping-smoke-target).
    prepare: [python3, -B, test/support/shaping_evaluation/driver.py, --prepare, smoke]
    rehearsal:
      id: rehearse-live-shaping-smoke
      command: mix test --exclude live test/kogen/shaping_smoke_rehearsal_test.exs
      shared_entrypoints:
        - driver.run_smoke
        - driver.setup_fixture
        - Kogen.ShapingEvaluation.Integrity.validate_smoke_manifest
      correct_fixture: test/support/shaping_evaluation/driver_smoke_rehearsal_test.py:test_smoke_rehearsal_dispatches_real_functions_and_manifests_once
      wrong_fixture: test/support/shaping_evaluation/driver_smoke_rehearsal_test.py:test_smoke_wrong_control_missing_scripted_answer_fires_fail_fast
      trace_assertions:
        - driver.run_smoke
        - driver.setup_fixture
        - Kogen.ShapingEvaluation.Integrity.validate_smoke_manifest
      prepare_trace_assertions:
        - driver.prepare_login_scope_ok
        - driver.prepare_toolchain_ok
        - driver.setup_fixture

  - name: live-native
    cost_class: provider-native
    rank: 300
    dependencies: [check]
    provider_backed: true
    same_tree_retry: 1
    owner:
      - test/kogen/codex_native_live_test.exs
      - test/kogen/codex_compatibility_test.exs
      - test/kogen/native_helper_live_test.exs
    covers:
      - test/kogen/codex_native_live_test.exs
      - test/kogen/native_helper_live_test.exs
      - test/support/native_helper_fixture.ex
      - priv/kogen/codex/install.py
      - priv/kogen/codex/native_settings.py
      - priv/kogen/codex/compatibility/pty_driver.py
      - lib/kogen/managed_runtime_ready.ex
    requires_login: route
    launched_roles: [developer]
    prepare: [mix, run, -e, 'Kogen.ManagedRuntimeReady.prepare_for_target!()']
    rehearsal:
      id: rehearse-live-native
      command: mix test --exclude live test/kogen/codex_compatibility_preparation_test.exs test/kogen/live_native_receipt_audit_test.exs
      shared_entrypoints:
        - Kogen.Codex.Compatibility.prepare_fixture
        - Kogen.LiveNativeReceiptAudit.audit!
      correct_fixture: test/support/native_helper_fixture.ex
      wrong_fixture: test/support/live_native_receipt_audit.ex
      trace_assertions:
        - Kogen.Codex.Compatibility.prepare_fixture
        - Kogen.LiveNativeReceiptAudit.audit!
      prepare_trace_assertions:
        - Kogen.ManagedRuntimeReady.prepare!

  - name: live-reviewer-rework
    cost_class: provider-lifecycle
    rank: 400
    dependencies: [check]
    provider_backed: true
    same_tree_retry: 1
    owner: test/kogen/live_reviewer_rework_test.exs
    covers:
      - test/kogen/live_reviewer_rework_test.exs
      - test/support/live_reviewer_rework_fixture.ex
      - priv/kogen/claude_code/install.py
      - lib/kogen/claude_code.ex
    requires_login: route
    launched_roles: [developer, reviewer]
    # Rehearsed in check: the fixture's own setup, login-scope and
    # hook-toolchain resolution, up to but not including the first provider
    # dispatch (`mix kogen.build`).
    prepare:
      - env
      - MIX_ENV=test
      - mix
      - run
      - --no-start
      - -r
      - test/support/live_reviewer_rework_fixture.ex
      - -e
      - Kogen.ManagedRuntimeReady.prepare!(); Kogen.LiveReviewerReworkFixture.prepare_main()
    rehearsal:
      id: rehearse-live-reviewer-rework
      command: mix test --exclude live test/kogen/two_outer_resumptions_test.exs
      shared_entrypoints:
        - Kogen.Build.Report.build
        - Kogen.Build.Contract.verdict
      correct_fixture: test/support/live_rework_audit.ex
      wrong_fixture: test/support/live_rework_audit.ex:missing-companion
      trace_assertions:
        - Kogen.Build.Report.build
        - Kogen.Build.Contract.verdict
      prepare_trace_assertions:
        - Kogen.ManagedRuntimeReady.prepare!
        - Kogen.LiveReviewerReworkFixture.setup_fixture
        - Kogen.LiveReviewerReworkFixture.precompile!
        - Kogen.ReviewPacketAudit.claude_scope_ready?
        - Kogen.ReviewPacketAudit.codex_scope_ready?
        - Kogen.ReviewPacketAudit.hook_toolchain_ready?

  - name: live-shape-to-build
    cost_class: provider-end-to-end
    rank: 500
    dependencies: [check]
    provider_backed: true
    same_tree_retry: 1
    owner: test/kogen/live_shape_to_build_test.exs
    covers:
      - test/kogen/live_shape_to_build_test.exs
      - lib/kogen/build.ex
      - .kogen/config.yaml
    requires_login: route
    launched_roles: [shaping, developer, reviewer]
    prepare: [mix, run, -e, 'Kogen.ManagedRuntimeReady.prepare_for_target!()']
    rehearsal:
      id: rehearse-live-shape-to-build
      command: mix test --exclude live test/kogen/verification_ownership_lifecycle_test.exs
      shared_entrypoints:
        - Kogen.Build.Contract.load
        - Kogen.Build.Verification.initialize
        - Kogen.Build.Verification.settle
      correct_fixture: test/support/isolated_case.ex
      wrong_fixture: test/support/live_rework_audit.ex:single-capture
      trace_assertions:
        - Kogen.Build.Contract.load
        - Kogen.Build.Verification.initialize
        - Kogen.Build.Verification.settle
      prepare_trace_assertions:
        - Kogen.ManagedRuntimeReady.prepare!
