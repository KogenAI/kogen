# harnesses/pi/manifest.yaml — single-source-of-truth for the pi harness.
# Generate + install: make install (runs generate.sh pi then install.sh loop reads this file).
# Add a harness: see docs/adding-a-harness.md.

harness: pi

# ─── Agent installation ───────────────────────────────────────────────────────
agents_dir: ~/.pi/agent/agents
# Agents are rendered from shared/subagents/{shared,phoenix,static}/*.md.j2
# via generate.sh (calls generate-pi.sh internally).
generator: templates/generator/generate.sh

# ─── Prompts (pi-specific — slash commands / built-in prompts) ─────────────────
prompts_dir: ~/.pi/agent/prompts
prompts_source: templates/generated/pi/prompts
prompts_install: all # install.sh installs all *.md from prompts_source with prune

# ─── Launchers ────────────────────────────────────────────────────────────────
launchers:
  - name: codegen-build
    src: codegen-build
  - name: codegen-call
    src: codegen-call
  - name: codegen-scaffold
    src: codegen-scaffold
  - name: codegen-drain
    src: codegen-drain
  - name: codegen-document
    src: codegen-document
  - name: codegen-analyze
    src: codegen-analyze
  - name: pi-build
    src: harnesses/pi/pi-build.sh
  - name: pi-debug
    src: harnesses/pi/pi-debug.sh
  - name: pi-shape
    src: harnesses/pi/pi-shape.sh
  - name: pi-experiment
    src: harnesses/pi/pi-experiment.sh
  - name: pi-ops
    src: harnesses/pi/pi-ops.sh
  - name: pi-babysit
    src: harnesses/pi/pi-babysit.sh

# ─── Zsh completions ──────────────────────────────────────────────────────────
completions:
  - _pi-babysit
  - _pi-build
  - _pi-debug
  - _pi-experiment
  - _pi-ops
  - _pi-shape

# ─── Per-mode configuration ───────────────────────────────────────────────────
# model/effort read at runtime from templates/generator/config.yaml roles.<mode> via yq.
# tools: pi CLI --tools allowlist (positional string, not config.yaml).
# extensions: pi CLI --extension list (loaded at runtime from EXTENSIONS_DIR).
# system_prompt_file: path relative to CODEGEN_DIR.
# prompt_body: ordered list of paths (relative to CODEGEN_DIR) concatenated after tools_header.
#   Each entry must exist. Empty files are skipped (no separator added).
#   Fragments from shared/prompt-fragments/ may be appended for shape mode.
# tools_header: harnesses/pi/tools-header/<mode>.txt (per-harness ## Tools section + mode header).
# manifest_regenerate_prompts() cats tools_header + each prompt_body entry → system_prompt_file.
modes:
  debug:
    model: openai-codex/gpt-5.4 # from config.yaml harness.debug.pi
    effort: medium
    tools: read,grep,find,ls # debug: no edit/write/bash mutations
    extensions:
      - subagents
    system_prompt_file: harnesses/pi/pi-debug-system-prompt.txt
    tools_header: harnesses/pi/tools-header/debug.txt
    prompt_body:
      - shared/rules/_core/output-style.md
      - harnesses/shared/prompt-bodies/debug.txt
      - shared/prompt-fragments/_forbidden-bash-brief.txt

  shape:
    model: openai-codex/gpt-5.5 # from config.yaml roles.shape (pi variant)
    effort: high
    tools: read,grep,find,ls,edit,write,bash
    extensions:
      - askuserquestion
      - subagents
      - web-utils
    system_prompt_file: harnesses/pi/pi-shape-system-prompt.txt
    tools_header: harnesses/pi/tools-header/shape.txt
    prompt_body:
      - shared/rules/_core/output-style.md
      - harnesses/shared/prompt-bodies/shape.txt
      - shared/prompt-fragments/_probing.txt
      - shared/prompt-fragments/_authoring-spine.txt
      - shared/prompt-fragments/_forbidden-bash-brief.txt

  experiment:
    model: openai-codex/gpt-5.5 # from config.yaml harness.experiment.pi
    effort: high
    tools: read,grep,find,ls,edit,write,bash
    extensions:
      - askuserquestion
      - subagents
      - web-utils
    system_prompt_file: harnesses/pi/pi-experiment-system-prompt.txt
    tools_header: harnesses/pi/tools-header/experiment.txt
    prompt_body:
      - shared/rules/_core/output-style.md
      - harnesses/shared/prompt-bodies/experiment.txt
      - shared/prompt-fragments/_forbidden-bash-brief.txt

  ops:
    model: openai-codex/gpt-5.5 # from config.yaml harness.ops.pi
    effort: high
    tools: read,grep,find,ls,edit,write,bash
    extensions:
      - askuserquestion
      - subagents
      - web-utils
    system_prompt_file: harnesses/pi/pi-ops-system-prompt.txt
    tools_header: harnesses/pi/tools-header/ops.txt
    prompt_body:
      - shared/rules/_core/output-style.md
      - harnesses/shared/prompt-bodies/ops.txt
      - shared/prompt-fragments/_forbidden-bash-brief.txt

  babysit:
    model: openai-codex/gpt-5.5 # from config.yaml harness.babysit.pi
    effort: high
    tools: read,grep,find,ls,edit,write,bash
    extensions:
      - askuserquestion
      - subagents
      - web-utils
    system_prompt_file: harnesses/pi/pi-babysit-system-prompt.txt
    tools_header: harnesses/pi/tools-header/babysit.txt
    prompt_body:
      - shared/rules/_core/output-style.md
      - harnesses/shared/prompt-bodies/babysit.txt
      - shared/prompt-fragments/_forbidden-bash-brief.txt

# ─── Install / uninstall steps (declarative record) ──────────────────────────
# Actual execution is in install.sh manifest-driven loop.
install_steps:
  - generate_agents # generate.sh pi → templates/generated/pi/agent/
  - install_agents # content_stable_cp generated agents → agents_dir, prune stale
  - install_prompts # content_stable_cp prompts_source/document.md → prompts_dir
  - install_launchers # content_stable_cp + chmod+x each launcher entry
  - install_completions # content_stable_cp each completion to ZSH_COMPLETION_DST

uninstall_steps:
  - remove_agents # rm agents_dir/*.md from installed manifest
  - remove_prompts # rm prompts_dir/document.md
  - remove_launchers # rm INSTALL_DIR/{codegen-build,codegen-call,codegen-scaffold,codegen-document,codegen-analyze,pi-build,pi-debug,pi-experiment,pi-shape,pi-ops,pi-babysit}
  - remove_completions # rm ZSH_COMPLETION_DST/{_pi-build,_pi-debug,_pi-experiment,_pi-shape,_pi-babysit}
