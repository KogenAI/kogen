# harnesses/claude/manifest.yaml — single-source-of-truth for the claude harness.
# Generate + install: make install (runs generate.sh claude then install.sh loop reads this file).
# Add a harness: see docs/adding-a-harness.md.

harness: claude

# ─── Agent installation ───────────────────────────────────────────────────────
agents_dir: ~/.claude/agents
# Agents are rendered from shared/subagents/{shared,phoenix,static}/*.md.j2
# via generate.sh (_generate_claude() fn, inlined from former generate-claude.sh).
generator: templates/generator/generate.sh

# ─── Settings / hooks / commands ──────────────────────────────────────────────
settings_file: ~/.claude/settings.json
settings_source: harnesses/claude/claude-code-settings.json
# Hook registration is owned by hook_registrations.py (not this manifest).
# manifest only declares that claude registers hooks and points at the settings file.
hooks_dir: ~/.claude/hooks
hooks_source: harnesses/claude/hooks
commands_dir: ~/.claude/commands
commands_source: harnesses/claude/commands

# ─── Launchers ────────────────────────────────────────────────────────────────
launchers:
  - name: codegen-build
    src: codegen-build
  - name: codegen-call
    src: codegen-call
  - name: codegen-scaffold
    src: codegen-scaffold
  - name: claude-build
    src: harnesses/claude/claude-build.sh
  - name: claude-debug
    src: harnesses/claude/claude-debug.sh
  - name: claude-shape
    src: harnesses/claude/claude-shape.sh
  - name: claude-experiment
    src: harnesses/claude/claude-experiment.sh
  - name: claude-ops
    src: harnesses/claude/claude-ops.sh
  - name: codegen-document
    src: codegen-document
  - name: codegen-analyze
    src: codegen-analyze

# ─── Zsh completions ──────────────────────────────────────────────────────────
completions:
  - _claude-build
  - _claude-debug
  - _claude-experiment
  - _claude-ops
  - _claude-shape

# ─── Per-mode configuration ───────────────────────────────────────────────────
# model/effort/tools are canonical in templates/generator/config.yaml roles.<mode>
# (load-role.sh reads them). Listed here as documentation-of-record.
# system_prompt_file: path relative to CODEGEN_DIR.
# prompt_body: ordered list of paths (relative to CODEGEN_DIR) concatenated after tools_header.
#   Each entry must exist. Empty files are skipped (no separator added).
#   Fragments from shared/prompt-fragments/ may be appended for shape mode.
# tools_header: harnesses/claude/tools-header/<mode>.txt (per-harness ## Tools section + mode header).
# manifest_regenerate_prompts() cats tools_header + each prompt_body entry → system_prompt_file.
modes:
  build:
    model: haiku
    effort: medium
    output_format: stream-json
    tools: [Agent, Bash, Edit, Glob, Grep, Read, Skill, Write]
    system_prompt_file: harnesses/claude/claude-build-system-prompt.txt
    tools_header: harnesses/claude/tools-header/build.txt
    prompt_body:
      - harnesses/shared/prompt-bodies/build.txt
      - harnesses/shared/prompt-bodies/build-multi-pitch-queue.txt

  debug:
    model: opus
    effort: high
    output_format: text
    tools: [Agent, Bash, Edit, Glob, Grep, Read, Skill, Write]
    system_prompt_file: harnesses/claude/claude-debug-system-prompt.txt
    tools_header: harnesses/claude/tools-header/debug.txt
    prompt_body:
      - harnesses/shared/prompt-bodies/debug.txt

  shape:
    model: opus
    effort: high
    output_format: text
    tools:
      [
        Agent,
        AskUserQuestion,
        Bash,
        Edit,
        Glob,
        Grep,
        Read,
        Skill,
        WebFetch,
        WebSearch,
        Write,
      ]
    system_prompt_file: harnesses/claude/claude-shape-system-prompt.txt
    tools_header: harnesses/claude/tools-header/shape.txt
    prompt_body:
      - harnesses/shared/prompt-bodies/shape.txt
      - shared/prompt-fragments/_probing.txt
      - shared/prompt-fragments/_authoring-spine.txt

  experiment:
    model: opus
    effort: high
    output_format: text
    tools:
      [
        Agent,
        AskUserQuestion,
        Bash,
        Edit,
        Glob,
        Grep,
        Read,
        Skill,
        WebFetch,
        WebSearch,
        Write,
      ]
    system_prompt_file: harnesses/claude/claude-experiment-system-prompt.txt
    tools_header: harnesses/claude/tools-header/experiment.txt
    prompt_body:
      - harnesses/shared/prompt-bodies/experiment.txt

  ops:
    model: opus
    effort: high
    output_format: text
    tools:
      [
        Agent,
        AskUserQuestion,
        Bash,
        Edit,
        Glob,
        Grep,
        Read,
        Skill,
        WebFetch,
        WebSearch,
        Write,
      ]
    system_prompt_file: harnesses/claude/claude-ops-system-prompt.txt
    tools_header: harnesses/claude/tools-header/ops.txt
    prompt_body:
      - harnesses/shared/prompt-bodies/ops.txt

# ─── Install / uninstall steps (declarative record) ──────────────────────────
# Actual execution is in install.sh manifest-driven loop.
install_steps:
  - generate_agents # generate.sh claude → templates/generated/claude-code/
  - install_settings # content_stable_cp settings_source → settings_file
  - install_hooks # copy hooks_source/*.sh → hooks_dir, prune orphans, install lib/
  - install_commands # copy commands_source/*.md → commands_dir, prune stale
  - install_agents # copy generated agents → agents_dir, prune stale
  - install_launchers # content_stable_cp + chmod+x each launcher entry
  - install_completions # content_stable_cp each completion to ZSH_COMPLETION_DST
  - install_deps # jq, yq, rg, claude (claude-specific deps)

uninstall_steps:
  - remove_agents # rm agents_dir/*.md from installed-by-ocg manifest
  - remove_commands # rm commands_dir/*.md from installed-by-ocg manifest
  - remove_hooks # rm hooks_dir/*.sh
  - remove_launchers # rm INSTALL_DIR/{codegen-build,codegen-call,codegen-scaffold,codegen-document,codegen-analyze,claude-build,claude-debug,claude-experiment,claude-shape,claude-ops}
  - remove_completions # rm ZSH_COMPLETION_DST/{_claude-build,_claude-debug,_claude-experiment,_claude-shape}
