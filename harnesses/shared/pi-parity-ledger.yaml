# pi-parity-ledger.yaml — executable inventory of every codegen-managed surface
# and its Claude/Pi disposition. Validated hermetically by
# harnesses/shared/pi-parity-contract_test.sh (schema + source-path existence
# only in Sub-slice 1 — full surface discovery is a later slice).
#
# Every surface row:
#   id             — unique string identifier
#   class          — launcher | mode | tool | command | policy | event | completion
#   claude_source  — path to the Claude-side implementation (relative to repo root)
#   pi_source      — path to the Pi-side implementation (relative to repo root)
#   authority      — structural | runtime | deterministic
#   probe          — map with darwin/linux/failure string test IDs (opaque in S1)
#   status         — equivalent | vendor-divergence
version: 1
surfaces:
  - id: managed-transport
    class: mode
    claude_source: harnesses/claude/call-dispatch.sh
    pi_source: harnesses/pi/call-dispatch.sh
    authority: runtime
    probe:
      {
        darwin: T-transport-darwin,
        linux: T-transport-linux,
        failure: T-transport-fail,
      }
    status: equivalent

  - id: launcher-build
    class: launcher
    claude_source: harnesses/claude/claude-build.sh
    pi_source: harnesses/pi/pi-build.sh
    authority: runtime
    probe:
      { darwin: T-build-darwin, linux: T-build-linux, failure: T-build-fail }
    status: equivalent

  - id: launcher-debug
    class: launcher
    claude_source: harnesses/claude/claude-debug.sh
    pi_source: harnesses/pi/pi-debug.sh
