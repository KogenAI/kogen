# seam-registry.yaml — canonical inventory of declaration<->reflection seams.
#
# A "seam" is any place the repo declares one fact in a source-of-truth plane
# (code, a registry file, a rule, a template) and REFLECTS that same fact into
# a derived plane (a generated file, a mirrored twin, an index, a hand-written
# doc). When the two planes drift, a build ships with a fact that is true in
# one plane and stale/wrong in the other — usually invisible until runtime.
#
# This file does not implement any guard. It is the inventory a meta-guard
# (seam-registry-parity_test.sh) reconciles against reality: every named guard
# must exist and run; every guard-like file/target in the repo must be listed
# here; every GAP row must carry a rationale.
#
# FIELDS
#   id            — kebab-case slug, unique
#   declares      — the single source of truth for this fact
#   reflects      — the derived surface(s) that must stay in sync with declares
#   guard         — Makefile .PHONY target name, OR a _test.sh path relative to
#                   repo root, OR the literal string "GAP" when no guard exists
#   guard_time    — when the guard runs: make-test | install | runtime
#   pattern       — generated | checked-mirror | set-parity
#                     generated:       reflects is fully derived by a compiler/renderer
#                     checked-mirror:  reflects is hand-written but diffed/asserted against declares
#                     set-parity:      declares and reflects are two independent sets, both directions checked
#   gap_rationale — REQUIRED non-empty when guard is GAP; explains why unguarded
#                   and what would close it (usually names a follow-on pitch)
#
# Maintained by context-curator post-reviewer (see shared/rules/roles/context-curator.md
# § Seam Registry Maintenance) — the sole maintainer. The developer registers a
# seam it introduces as it builds it (shared/rules/roles/developer.md
# § Seam Registration); the curator's pass is the backstop for a missed row.

seams:
  - id: enforcement-registry-to-hooks
    declares: shared/enforcement/registry.yaml (kind:denial entries)
    reflects: harnesses/claude/hooks/no-*.sh
    guard: enforce-registry-parity
    guard_time: make-test
    pattern: generated

  - id: enforcement-registry-to-hook-headers
    declares: shared/enforcement/registry.yaml (kind:registration entries)
    reflects: harnesses/claude/hooks/*.sh (# HOOK-MANIFEST header block only; body hand-authored)
    guard: hook-header-parity
    guard_time: make-test
    pattern: generated

  - id: hooks-dir-to-settings-json
    declares: harnesses/claude/hooks/ (script files present)
    reflects: harnesses/claude/claude-code-settings.json (hook registrations)
    guard: hook-parity
    guard_time: make-test
    pattern: generated

  - id: rules-to-rendered-apps-md
    declares: shared/rules/**, shared/apps/*.j2
    reflects: shared/apps/*.md (committed rendered output)
    guard: rule-render-freshness
    guard_time: make-test
    pattern: generated

  - id: rules-fileset-to-index
    declares: shared/rules/** (.md file set on disk)
    reflects: shared/rules/INDEX.md (§ Folder Layout)
    guard: harnesses/claude/hooks/rules-index-parity_test.sh
    guard_time: make-test
    pattern: set-parity

  - id: cycle-log-event-schema-to-session-log-md
    declares: codegen-log (EVENT_SCHEMA_JQ table; reflected via `codegen-log --kinds`)
    reflects: shared/rules/_core/session-log.md (prose kind enumeration; baked into subagent prompts, cannot be generated away)
    guard: harnesses/claude/hooks/cycle-log-schema-parity_test.sh
    guard_time: make-test
    pattern: set-parity

  - id: role-boundary-prose-to-registry-allowlist
    declares: >-
      shared/enforcement/registry.yaml (reviewer-bash-allowlist match — the
      actual permit set, including the read-only text-filter verbs
      printf/head/tail/grep/rg/awk/sed/sort/uniq/nl/cut/tr/comm/diff/jq/find/basename/dirname)
    reflects: >-
      shared/rules/roles/reviewer.md § Your Boundaries (Bash line) — there
      is no committer role or committer.md; commits are made by the
      deterministic codegen-commit script, never by an agent (see pitch
      "committing is deterministic, not a model call")
    guard: harnesses/claude/hooks/role-boundary-parity_test.sh
    guard_time: make-test
    pattern: set-parity

  - id: baked-prompt-content-sentinels
    declares: shared/subagents/**/*.md.j2 (source includes)
    reflects: rendered agent prompts (sentinel strings present)
    guard: prompt-content-parity
    guard_time: make-test
    pattern: checked-mirror

  - id: context-docs-line-citations
    declares: context/*.md, PROJECT_CONTEXT.md (line/module citations)
    reflects: (citation must still resolve to real, current code/doc location)
    guard: harnesses/claude/hooks/context-doc-provenance_test.sh
    guard_time: make-test
    pattern: checked-mirror

  - id: reviewer-json-schema-flag-to-tools-grant
    declares: "test_harness/lib/codegen_test_harness/orchestration_loop.ex (reviewer_role?/1 — every reviewer-* role is invoked with --json-schema)"
    reflects: "shared/subagents/{phoenix,static}/reviewer-*.md.j2 tools: frontmatter (must grant StructuredOutput, the only tool that satisfies --json-schema; --allowed-tools does NOT gate it) — mirrored into ~/.claude/agents/reviewer-*.md by make install"
    guard: harnesses/claude/hooks/reviewer-schema-grant-parity_test.sh
    guard_time: make-test
    pattern: checked-mirror

  - id: codegen-build-to-dispatch-stubs
    declares: codegen-build (argv contract)
    reflects: harnesses/claude/dispatch.sh (stub consumption)
    guard: harness-parity
    guard_time: make-test
    pattern: checked-mirror

  - id: loop-build-result-to-wrapper-authority
    declares: Mix.Tasks.Codegen.Loop.write_build_result!/3 (invocation-scoped success record)
    reflects: codegen-build (current invocation ID, slug, HEAD, and clear gate validation)
    guard: harnesses/claude/hooks/codegen-build_test.sh
    guard_time: make-test
    pattern: checked-mirror

  - id: bilateral-handoff-record-parity
    declares: >-
      A concrete cross-pitch handoffs: record (source pitch's frontmatter);
      the CodegenTestHarness.LoopQueue.reconcile_handoffs/4 record grammar
      it must satisfy
    reflects: >-
      The owner pitch's identical handoffs: record + scope: entry;
      mix codegen.pitches.scope --check --slug's HANDOFF GAP check;
      Mix.Tasks.Codegen.Loop.claim_pitch!/2's pre-spend handoff_receipt:
      verification; the /ready teaching step in ready.md.j2
    guard: pitch-scope-parity
    guard_time: make-test
    pattern: set-parity

  - id: usage-rules-corpus-to-index
    declares: shared/usage_rules/*.md (per-lib-version files)
    reflects: shared/usage_rules/INDEX.md
    guard: usage-rules-index-parity
    guard_time: make-test
    pattern: set-parity

  - id: rule-file-size-ceilings
    declares: templates/generator/prompt-budgets.txt (committed ceilings)
    reflects: shared/rules/**/*.md line counts, shared/subagents/**/*.md.j2 rendered byte sizes
    guard: prompt-size-budget
    guard_time: make-test
    pattern: checked-mirror

  - id: hook-rationale-comment-required
    declares: harnesses/claude/hooks/no-*.sh (denial hooks)
    reflects: (each denial hook must carry a rationale comment explaining the deny)
    guard: enforce-hook-rationale
    guard_time: make-test
    pattern: checked-mirror

  - id: mix-build-root-to-mix-env
    declares: every `MIX_BUILD_PATH=_build/<root>` invocation site (Makefile, launchers, drain)
    reflects: context/development.md § Mix build-path assignment (the root -> process table)
    guard: mix-build-path-parity
    guard_time: make-test
    pattern: set-parity

  - id: context-docs-to-project-context-index
    declares: context/*.md (file set + § Trigger Keywords)
    reflects: PROJECT_CONTEXT.md (§ Domain Context Files table rows + keyword cells)
    guard: context-index-parity
    guard_time: make-test
    pattern: generated

  - id: scaffold-project-context-template-to-generated-docs
    declares: shared/apps/PROJECT_CONTEXT*.j2 (promises context/*.md files exist)
    reflects: shared/scaffold/**/scaffold.sh (actual context/*.md files created in scaffolded app)
    guard: GAP
    guard_time: runtime
    pattern: set-parity
    gap_rationale: >
      PROJECT_CONTEXT template references context/*.md files the scaffold
      never creates; curator's runtime context-index-parity-scan hard-rejects
      the first build of every scaffolded app. Tracked as its own pitch
      (scaffold-owns-context-docs) — not resolved by this build.

  - id: seam-registry-to-guard-machinery
    declares: shared/enforcement/seam-registry.yaml (this file)
    reflects: Makefile .PHONY targets, run-all-tests.sh wiring, harnesses/claude/hooks/*_test.sh files matching the parity/freshness/provenance naming convention
    guard: harnesses/claude/hooks/seam-registry-parity_test.sh
    guard_time: make-test
    pattern: set-parity

  - id: build-lock-format-to-codegen-drain-status
    declares: test_harness/lib/codegen_test_harness/build_lock.ex (lock line format + "queue"/"solo" label literals)
    reflects: codegen-drain (cmd_status watcher_probe_cmd/1 — resolves watcher= from the lock file, never from argv)
    guard: test-hermetic
    guard_time: make-test
    pattern: checked-mirror

  - id: makefile-bench-task-invocations
    declares: test_harness/lib/mix/tasks/codegen.bench.*.ex (Mix.Tasks module names -> derived CLI task names)
    reflects: Makefile (bench target `mix codegen.bench.*` invocations; bench-preflight target `mix help codegen.bench.*` name-resolution checks)
    guard: test-hermetic
    guard_time: make-test
    pattern: checked-mirror

  - id: ready-pitch-scope-declared
    declares: "codegen/pitches/ready/*.md scope: frontmatter (every promoted pitch declares its edit surface)"
    reflects: mix codegen.pitches.scope --check exit code
    guard: pitch-scope-parity
    guard_time: make-test
    pattern: set-parity

  - id: ready-pitch-split-subject-declared
    declares: "codegen/pitches/ready/*.md split_subject: frontmatter (a subsumed-scope sibling pair proves it is two bets, not one)"
    reflects: mix codegen.pitches.scope --check SUBSUMED exit code
    guard: pitch-scope-parity
    guard_time: make-test
    pattern: set-parity

  - id: codegen-mcp-role-list-to-tool-names
    declares: "harnesses/claude/mcp-server/src/roles.ts ROLES (9 concrete role names + per-role kind/reader grants)"
    reflects: "generated mcp__codegen__log_section_<role>/log_append_<role> tool names; shared/subagents/**/*.md.j2 tools: frontmatter grants"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      Checked by a node:test suite wired into make test's mcp-server stage
      (harnesses/claude/mcp-server/src/__tests__/server.test.ts
      role-baked writer assertions) — not a bash _test.sh or Makefile .PHONY
      target, so it falls outside this registry's forward/reverse-parity scan
      convention. A follow-on could extend seam-registry-parity_test.sh to
      also recognize node:test files as first-class guards.

  - id: hook-test-ownership-to-runner-exclusion
    declares: Makefile direct hook-test callers (harness-parity, prompt-content-parity)
    reflects: templates/generator/run-all-tests.sh HOOK_DEDUP_EXCLUDE -> HOOK_TEST_EXCLUDE consumed by harnesses/claude/hooks/run-tests.sh
    guard: templates/generator/run-all-tests_test.sh
    guard_time: make-test
    pattern: set-parity
  - id: registry-waivable-to-waiver-helpers
    declares: "shared/enforcement/registry.yaml (waivable: true entries — currently prompt-budget-writer-only only)"
    reflects: "harnesses/claude/hooks/_waiver.sh (scans registry.yaml at grant-check time, not compile time — no generated artifact to diff); harnesses/claude/hooks/pitch-format-validator.sh (validation (d): a promoted pitch's waives: frontmatter must name a waivable: true id)"
    guard: harnesses/claude/hooks/_waiver_test.sh
    guard_time: make-test
    pattern: checked-mirror

  - id: scope-task-fleet-safe-to-codegen-drain-assign
    declares: "test_harness/lib/mix/tasks/codegen.pitches.scope.ex (--fleet-safe JSON dependency_bound key, delegating to LoopQueue.fleet_partition/3)"
    reflects: "codegen-drain (cmd_assign_auto reads .dependency_bound[] from the --fleet-safe JSON leg; dependency_preflight reads a separately-built fleet_snapshot for targeted assign --slug --node)"
    guard: test-hermetic
    guard_time: make-test
    pattern: checked-mirror

  - id: whole-pitch-build-invariant
    declares: "shared/rules/roles/developer.md § Whole-Pitch Builds Only + shared/rules/roles/reviewer.md § Deliverable coverage (row 16) + § No Born-Dead / Deferred Work (Rule N) — the prose invariant that a build implements the WHOLE pitch"
    reflects: "test_harness/lib/codegen_test_harness/born_dead_detector.ex (BornDeadDetector.check/2), wired into OrchestrationLoop.assert_work_produced!/2 (solo floor, raises) and LoopQueueDrain's injectable :born_dead_fn seam (drain floor, routes to false-0 park-and-continue)"
    guard: test-hermetic
    guard_time: make-test
    pattern: checked-mirror

  - id: test-coverage-deletion-floor
    declares: "context/loop.md § Test-Coverage Deletion Floor — test assertion-block counts cannot decrease silently"
    reflects: "test_harness/lib/codegen_test_harness/test_coverage_floor.ex (TestCoverageFloor.check/2), wired into OrchestrationLoop.assert_test_coverage_floor!/2 (solo floor, raises) and LoopQueueDrain's injectable :coverage_floor_fn seam (drain floor, routes to false-0 park-and-continue)"
    guard: test-hermetic
    guard_time: make-test
    pattern: checked-mirror

  - id: denial-ledger-to-live-hooks
    declares: "harnesses/claude/hooks/fixtures/denial-ledger.jsonl (curated allow/deny cases drawn from the record of what roles actually ran, per context/hook-authoring-patterns.md § Coverage minimum)"
    reflects: "the live PreToolUse hook set (dynamically discovered from claude-code-settings.json), replayed as real subprocesses"
    guard: harnesses/claude/hooks/denial-ledger-replay_test.sh
    guard_time: make-test
    pattern: checked-mirror

  # ── Rule-anchor seams (rules-grants-and-guards-match-reality) ──────────────
  # A rule paragraph that ASSERTS a machine behaviour names the enforcer here.
  # rule_anchor_check.py --check verifies BOTH directions: the named enforcer
  # exists, AND the rule file still contains the registered anchor text,
  # byte-exactly. Deleting a load-bearing rule paragraph reddens make test
  # instead of silently removing the only check for the thing it described.

  - id: reviewer-verdict-sentinel-to-loop-parser
    declares: "shared/rules/roles/reviewer.md § Report — `REVIEW_VERDICT: APPROVED`/`CHANGES_REQUESTED` exactly once (last line)"
    reflects: "test_harness/lib/codegen_test_harness/orchestration_loop.ex parse_review_verdict/1 — fail-closed to :unknown on an unparseable verdict line"
    guard: rule-anchor-check
    guard_time: make-test
    pattern: checked-mirror

  - id: reviewer-silent-failure-scan-to-hook-disclaimer
    declares: "shared/rules/roles/reviewer.md § Rule S — Silent-Failure Scan (the reviewer-owned contextual check for `|| true` / `2>/dev/null || true` / masking defaults)"
    reflects: "harnesses/claude/hooks/no-silent-failure.sh (explicitly disclaims `|| true` and default-value calls as reviewer-owned, contextual — see Rule S)"
    guard: rule-anchor-check
    guard_time: make-test
    pattern: checked-mirror

  - id: reviewer-born-dead-rule-n-to-detector
    declares: "shared/rules/roles/reviewer.md § Rule N — No Born-Dead / Deferred Work (BLOCKING)"
    reflects: "test_harness/lib/codegen_test_harness/born_dead_detector.ex (BornDeadDetector.check/2) — already covered by the whole-pitch-build-invariant seam above; this row anchors the RULE TEXT itself so a paragraph deletion reddens independently of the detector's own test coverage"
    guard: rule-anchor-check
    guard_time: make-test
    pattern: checked-mirror

  - id: static-visual-styling-mandate-to-render-check
    declares: "shared/rules/stacks/static/developer.md § Visual Styling Mandate (every visible element carries Tailwind utility classes)"
    reflects: "harnesses/claude/hooks/lib/render-check.js FAIL:unstyled verdict, invoked by test_harness/lib/codegen_test_harness/loop_gate.ex (@render_check_js, run_static_render_check/3)"
    guard: rule-anchor-check
    guard_time: make-test
    pattern: checked-mirror

  - id: developer-loop-mode-gate-discipline-to-hooks
    declares: "shared/rules/roles/developer.md § Gate — Loop mode (CODEGEN_LOOP=1): re-run the gate until GREEN, progress-bounded, hard cap 15"
    reflects: "harnesses/claude/hooks/developer-no-self-gate.sh (progress-bounded re-run cap), harnesses/claude/hooks/dev-no-ci.sh (full-suite-target enforcement)"
    guard: rule-anchor-check
    guard_time: make-test
    pattern: checked-mirror

  - id: developer-files-modified-typed-event-to-read-discipline
    declares: "shared/rules/roles/developer.md § Gate — Files Modified is ALSO a typed event (codegen-log append <role> --files-modified @-)"
    reflects: "harnesses/claude/hooks/subagent-read-discipline.sh reviewer arm — reads the developer's typed files_modified event to grant a context/*.md Read; ADVISES (never denies) when the path is absent from that event"
    guard: rule-anchor-check
    guard_time: make-test
    pattern: checked-mirror

  - id: reviewer-deliverable-coverage-to-nothing
    declares: "shared/rules/roles/reviewer.md § Review Steps row 16 — Deliverable coverage (walk the pitch's Scope/Solution-sketch item by item)"
    reflects: "no mechanism — sole stated backstop for whole-pitch delivery coverage, paired with developer.md § Whole-Pitch Builds Only"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      Prose-only. BornDeadDetector catches a NEW unwired module/fn; it does
      not catch a declared Scope path silently left untouched. Closing this
      needs a mechanism that diffs the pitch's Declared Scope list against
      the developer's files_modified event — not built by this pitch (see
      pitch "rules-grants-and-guards-match-reality" § No-gos: not wiring
      wiring-check.js, not building new detectors).

  - id: phoenix-liveview-handler-wiring-to-wiring-check
    declares: "shared/rules/stacks/phoenix/testing-liveview.md § A LiveView Test Per Interactive Handler (MUST) + shared/rules/stacks/phoenix/reviewer.md row 11.5 Handler wiring (both BLOCKING)"
    reflects: "harnesses/claude/hooks/lib/wiring-check.js (WIRING_VERDICT=PASS/FAIL, 10 assertions in its own _test.sh) — the checker EXISTS but has NO caller in test_harness/lib/; grep -rn wiring --include=*.ex test_harness/lib returns zero hits"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      wiring-check.js is unwired — render-check.js is the sibling checker
      that IS wired (loop_gate.ex run_static_render_check/3) and proves the
      pattern works; wiring-check.js was never given the same call site.
      This makes the "blocking" claim on these two rule sections stronger
      than the mechanism backing it. Closing the gap means wiring
      wiring-check.js into loop_gate.ex's phoenix gate leg — a runtime-hook
      change explicitly out of scope for this pitch (see § No-gos: "Not
      wiring wiring-check.js into the gate").

  - id: reviewer-bash-surface-sed-awk-mutation-hole
    declares: "shared/rules/roles/reviewer.md § Read-Only (Hook-enforced — Read/Grep/Glob only ... Bash is limited to the commands in Your Boundaries)"
    reflects: "shared/enforcement/registry.yaml reviewer-bash-allowlist match: permits sed and awk unqualified — `sed -i s/a/b/ file.txt` and awk with output redirection are allowed, breaking the read-only invariant (probe-confirmed: EXIT=0)"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      sed/awk were widened in deliberately for read-only text processing
      (guards-deny-only-work-the-role-must-not-do); the widening review
      already named the fix (form-aware match rejecting -i/--in-place and
      output redirection) but it never shipped. reviewer-bash-allowlist is
      generated: true, so the fix is a registry match: pattern change with
      likely a second deny-mode hook (the dialect forbids lookahead) —
      routed to pitch "guards-refuse-the-work-they-name", not this one (see
      § No-gos: "Not editing any hook body, or registry.yaml's match: lines").

  - id: operator-subagent-allowlist-leaf-spawn-terminal-arm
    declares: "shared/rules/shared/no-role-spawn.md — a leaf agent never spawns or delegates to another role via the Agent tool"
    reflects: "harnesses/claude/hooks/operator-subagent-allowlist.sh terminal arm (# All other subagent types (project subagents) — allow. / exit 0) — a developer-* leaf reaches this allow arm and can spawn another developer-* role"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      The terminal allow arm is deliberately permissive for legitimate
      non-role project subagents; closing it requires enumerating the actual
      role-name vocabulary (developer-*, reviewer-*, context-curator) and
      denying spawns of THOSE specific names from a non-orchestrator caller,
      without breaking Explore/spike-builder/other project subagents.
      Routed to pitch "guards-refuse-the-work-they-name" (see § No-gos:
      "Not editing any hook body, or registry.yaml's match: lines").

  - id: ssh-chain-loophole-ignore-quoted
    declares: 'shared/rules/_core/bash-discipline.md § Forbidden Bash Tokens — SSH-chain loophole: `ssh host "cmd | head/grep/tail"` and `ssh host "cat file"` are still forbidden'
    reflects: "shared/enforcement/registry.yaml no-cat-pipe ignore_quoted: true — the hook skips quoted payloads by construction, so an ssh-wrapped chain inside a quoted string is unenforceable by the no-cat-pipe hook itself"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      ignore_quoted: true exists to avoid false-denying legitimate quoted
      literals (e.g. a string that merely CONTAINS "cat x | head" as text,
      not as an executed command); the same escape hatch permits the exact
      ssh-chain form the rule forbids. No mechanical enforcement exists;
      the rule's "still forbidden" is discipline enforced by review, not by
      a hook. Not resolved by this pitch — closing it would need a
      shell-aware parser distinguishing quoted-as-argument from
      quoted-as-literal-text, which no current hook does.

  - id: fail-loud-load-bearing-command-no-swallow
    declares: "shared/rules/_core/fail-loud.md — never `|| true` on a load-bearing command whose failure is the signal"
    reflects: "no mechanical hook — delegated to shared/rules/roles/reviewer.md § Rule S (reviewer-owned, contextual judgment); no-silent-failure.sh explicitly does NOT gate `|| true`"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      Distinguishing a load-bearing `|| true` (masks a real failure) from a
      legitimate cleanup/fail-open `|| true` (sourced helper, non-blocking
      observability) requires knowing WHICH command's exit code is the
      signal — that is call-site semantic judgment, not a pattern a hook
      can apply mechanically. Reviewer Rule S is the intended enforcer and
      already exists; this row records that no hook backs it in addition.

  - id: fail-loud-required-input-no-silent-default
    declares: "shared/rules/_core/fail-loud.md — never silent-default a required input (model, credential, mode/env switch, routing key, target id)"
    reflects: "no mechanical hook — shared/rules/_core/fail-fast-required-values.md's 3-part masking-default test is applied by the reviewer manually; no grep-based hook enumerates every required-value call site in a diff"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      The masking-default test is a 3-part judgment call (required? sentinel
      papers over absence? proceeds wrong silently?) that cannot be reduced
      to a single grep pattern without false-positiving on every legitimate
      `Keyword.get(opts, :timeout, 5000)`. No hook exists; the reviewer is
      the enforcer, per fail-fast-required-values.md's own text.

  - id: fail-loud-no-mislabelled-failure-or-required-to-optional-demotion
    declares: "shared/rules/_core/fail-loud.md — never mislabel a failure (ALL CLEAR ✅ for a FAILED result); never demote a required field to optional without a consumer"
    reflects: "no mechanical hook in any class"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
    gap_rationale: >
      Both are diff-semantic judgments (does this label match the actual
      outcome? does this schema relaxation have a real caller?) that no
      current grep-based or AST-based hook in this repo implements. Recorded
      as an inventoried gap rather than left implicit — no follow-on pitch
      is named because no concrete mechanism has been proposed yet.

  - id: bash-hardcoded-user-path-no-hook
    declares: "shared/rules/_core/bash-discipline.md § Git Paths — NEVER hardcode `/Users/<user>/...` in git operations"
    reflects: "no hook and no make test gate leg checks for this pattern"
    guard: GAP
    guard_time: make-test
    pattern: checked-mirror
