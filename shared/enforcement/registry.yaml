  event: PreToolUse
  tool_guard: "Edit|Write|MultiEdit"
  surface: user_global
  signal: none
  role: "*"
  harnesses: all
  rationale: "Denies ANY role's Edit/Write/MultiEdit to context/<file>.md, PROJECT_CONTEXT.md, or codegen/PROJECT_CONTEXT.md when the projected post-write byte size exceeds the 40,960-byte cap, so the over-cap file is fixed in the writer's own turn — where the doc is editable this turn — instead of failing later at commit on the committer, which cannot repair it. Composes with context-curator-guard (path surface, curator-only)."

- kind: registration
  id: context-factcheck-edit-gate
  event: PreToolUse
  tool_guard: "Edit|Write|MultiEdit"
  surface: user_global
  signal: none
  role: "*"
  harnesses: all
  rationale: "Denies ANY role's Edit/Write/MultiEdit to an orientation doc (CLAUDE.md, AGENTS.md, PROJECT_CONTEXT.md, codegen/PROJECT_CONTEXT.md, context/*.md) when the PROJECTED post-write content contains a factcheck violation (named-path claim, count-anchor mismatch, or `_`->`*` identifier corruption), so it is fixed in the writer's own turn — where the doc is editable this turn — instead of failing later at a downstream role (committer) that cannot repair it. Mirrors curator-context-size-gate. Supersedes the deleted context-factcheck-curator-stop (dead SubagentStop under the loop) and context-factcheck-guard (commit-time dead-end)."

