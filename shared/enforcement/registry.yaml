- kind: registration
  id: stop-gate-failure-breaker
  event: SubagentStop
  tool_guard: "developer-phoenix-backend|developer-phoenix-frontend|developer-static"
  surface: user_global
  signal: AGENT_TYPE
  role: "developer-*"
  harnesses: all
  rationale: Blocks and forces planner escalation when the dev-gate has logged ≥3 FAILED verdicts in the session — turns the advisory "route to planner" suffix into an enforced circuit-breaker.

- kind: registration
  id: stop-verify-planner-gate
  event: Stop
  tool_guard: "*"
  surface: user_global
  signal: AGENT_TYPE
  role: "planner-*"
  harnesses: all

- kind: registration
  id: subagent-read-discipline
  event: PreToolUse
  tool_guard: Read
  surface: user_global
  signal: AGENT_TYPE
  role: "developer-*|reviewer-*|committer|context-curator"
  harnesses: claude
  rationale: Claude Code per-call Read inspector; Pi uses load-gate tool restriction

- kind: registration
  id: subagent-retrospective-guard
  event: SubagentStop
  tool_guard: "developer-phoenix-backend|developer-phoenix-frontend|planner-phoenix|planner-static|reviewer-phoenix|reviewer-static"
  surface: user_global
  signal: AGENT_TYPE
  role: "developer-phoenix-backend|developer-phoenix-frontend|planner-*|reviewer-phoenix|reviewer-static"
  harnesses: all

- kind: registration
  id: track-subagent-edits
  event: PreToolUse
  tool_guard: "Edit|Write|MultiEdit|NotebookEdit"
  surface: user_global
  signal: AGENT_TYPE
  role: "*"
  harnesses: all

- kind: registration
  id: track-tool-failures
  event: PostToolUseFailure
  tool_guard: "*"
  surface: user_global
  signal: AGENT_TYPE
  role: "*"
  harnesses: all

- kind: registration
  id: usage-rules-grep-guard
  event: PreToolUse
  tool_guard: "Bash|Grep"
  surface: user_global
  signal: AGENT_TYPE
  role: "*"
  harnesses: all
