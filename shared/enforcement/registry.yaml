- kind: registration
  id: committer-no-revert-prior-commit
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all
  rationale: Blocks git commit when staged content would byte-identically match a file state that a prior session commit already superseded, preventing silent backward rolls within the same build session.

- kind: registration
  id: committer-single-commit-per-cycle
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all
  rationale: Denies a second non-amend git commit from the committer agent within the same build cycle, enforcing one commit per cycle and preventing accidental double-commits.

- kind: registration
  id: committer-no-head-move-reset
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all
  rationale: Denies a HEAD-moving git reset (e.g. git reset HEAD~1, --hard/--soft/--keep/--merge, or a targeted commit-ish) from the committer agent, preventing a prior cycle's already-committed commit from being silently orphaned and folded into a new one.

- kind: registration
  id: committer-no-trailer-guard
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all

- kind: registration
  id: committer-single-line-guard
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all

- kind: registration
  id: committer-gate-verdict-clear
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all
  rationale: Denies a git commit from the committer agent unless codegen/gate-pending/gate-result.json exists and its .verdict field is "clear" — enforces the mandatory verdict read (shared/rules/roles/committer.md) rather than leaving it as an unenforced instruction.

- kind: registration
