# enforcement/registry.yaml — declarative enforcement hook registry.
#
# Each entry is the single source of truth for one denial rule OR one hook registration.
#
# ENTRY KINDS — discriminator field: kind (default: denial when absent)
#
#   kind: denial       — compiler generates ENTIRE .sh/.ts file (header + body).
#                        Requires match or match_all + message. generated: true means
#                        the compiler owns the output file and make install OVERWRITES it.
#   kind: registration — hook_registrations.py --emit-headers generates ONLY the
#                        # HOOK-MANIFEST: header block and injects it into the existing
#                        hand-written .sh script, leaving the body byte-identical.
#                        No match/message required. body stays hand-authored.
#
# DENIAL ENTRY FIELDS (kind: denial or absent):
#   id           — kebab-case slug; becomes the filename (no-cat-pipe → no-cat-pipe.sh / .ts)
#   generated    — true means the compiler owns the output files; false means hand-authored
#   event        — Claude Code hook event (PreToolUse, SubagentStop, Stop)
#   source       — what the match pattern applies to: COMMAND (default) or FILE_PATH
#   mode         — matching mode: deny (default, match→deny) or allowlist (no-match→deny)
#                  allowlist is valid for both source: COMMAND and source: FILE_PATH
#   tool_guard   — tool name that triggers the check (Bash, Write, Edit, …)
#   match        — regex-neutral pattern string (single); dialect-translated per target
#   match_all    — list of regex-neutral patterns (all must match; AND logic)
#                  mutually exclusive with `match`
#   message      — denial reason shown to the agent (verbatim string)
#   surface      — hook surface (user_global, project, …)
#   signal       — hook signal (none, AGENT_TYPE, …)
#   role         — role scope (* = all roles; pipe-separated for multiple, e.g. "a|b")
#   harnesses    — which harnesses deploy this hook (all, claude, pi)
#   canonicalize — path canonicalization (repo_relative); only used with source: FILE_PATH
#   bypass_roles — optional list of launcher-mode values (from resolve_role / CLAUDE_ROLE /
#                  PI_ROLE) that exit 0 before the role/match gate.
#
# REGISTRATION ENTRY FIELDS (kind: registration):
#   id           — kebab-case slug matching the .sh filename (without extension)
#   event        — Claude Code hook event (PreToolUse, SubagentStop, Stop, PostToolUseFailure)
#   tool_guard   — tool name(s) in header matcher field (Bash, Write|Edit, etc.)
#                  NOTE: tool_guard maps to the header field "matcher:" (token alias)
#   surface      — hook surface (user_global)
#   signal       — hook signal (none, AGENT_TYPE, CLAUDE_ROLE, CLAUDE_ROLE_FAMILY)
#   role         — role scope (* = all; pipe-separated for multiple; glob e.g. developer-*)
#   harnesses    — which harnesses deploy this hook (all, claude, pi)
#                  NOTE: registry value "claude" maps to header token "claude_code"
#   rationale    — optional human-readable explanation (single-line string or YAML block
#                  scalar for multi-line; rendered as "# rationale: <first-line>" +
#                  "#   <continuation-lines>" in the header)
#
# TOKEN CANONICALIZATION (registration entries only):
#   Registry stores:  tool_guard  → header emits: matcher
#   Registry stores:  harnesses: claude → header emits: harnesses: claude_code
#   Registry stores:  harnesses: all    → header emits: harnesses: all
#   Registry stores:  harnesses: pi     → header emits: harnesses: pi
#
# NOT-YET-MIGRATED: hooks with awkward schema fit deferred to a follow-up wave.
#   Reason documented per hook. Use marker: not-yet-migrated: true
#   (No current outliers — context-factcheck-guard, context-file-size-gate,
#   and context-index-parity, the prior role:-unset outliers, were deleted;
#   enforcement moved to context-factcheck-edit-gate (writer's-turn) and the
#   in-loop run_curator_doc_check step.)
#
# Pattern dialect rules (denial entries only):
#   Registry patterns use regex-neutral syntax:
#     \s    — whitespace (NOT [[:space:]] — that is bash-ERE only)
#     \b    — word boundary (supported in both bash ERE and JS)
#     (a|b) — alternation (both dialects)
#   Compiler translates to target dialect:
#     bash:  \s → [[:space:]]
#     ts/js: \s → \s (pass through — JS already uses \s)
#
# FORBIDDEN in registry patterns:
#   backreferences (\1, \2, …)
#   lookahead/lookbehind ((?=…), (?!…), (?<=…), (?<!…))

- id: no-cat-pipe
  generated: true
  description: "deny `cat FILE | head|tail|grep|less|more`"
  event: PreToolUse
  tool_guard: Bash
  match: "cat\\s+[^|]*\\|\\s*(head|tail|grep|less|more)\\b"
  message: "Use Read tool with offset/limit instead of `cat | head/tail`. Use Grep tool instead of `cat | grep`. Truncation hides relevant lines."
  surface: user_global
  signal: none
  role: "*"
  harnesses: all
  bypass_roles: [ops]
  ignore_quoted: true

- id: no-git-stash
  generated: true
  description: "deny any `git stash` invocation"
  event: PreToolUse
  tool_guard: Bash
  match: "\\bgit\\s+stash\\b"
  message: "git stash forbidden. Commit WIP to a scratch branch or use worktrees. Stash hides work from orchestrator + reviewer."
  surface: user_global
  signal: none
  role: "*"
  harnesses: all
  ignore_quoted: true
  resolve_indirection: true

- id: no-python-json
  generated: true
  description: "deny inline python JSON parsing"
  event: PreToolUse
  tool_guard: Bash
  match_all:
    - "\\bpython3?\\b[^|;&]*-c\\b"
    - "import\\s+json|json\\.load"
  message: "Don't parse JSON with python3 -c. Use Read tool — JSON files render readably. Inline python parsing is a thrash anti-pattern (see token-budget rule)."
  surface: user_global
  signal: none
  role: "*"
  harnesses: all

# SCHEMA: committer.md — committer Bash allowlist (default-deny; git + safe shell utilities only)
- id: committer-bash-allowlist
  generated: true
  description: "committer may only run git commands and safe shell utilities (allowlist)"
  event: PreToolUse
  source: COMMAND
  mode: allowlist
  tool_guard: Bash
  match: "^\\s*(cd\\b|git\\s+(-C\\s+\\S+\\s+)?(diff|status|log|show|commit|add|rm|mv|tag|checkout|switch|branch|restore|reset)\\b|codegen-log\\b|printf\\b|echo\\b|wc\\b|cat\\b|ls\\b|true\\b|:)"
  message: "BLOCKED by committer-bash-allowlist: only git read/write commands and safe shell utilities allowed for committer"
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all

# SCHEMA: session-log.md — committer may only write to canonical session logs
- id: committer-write-allowlist
  generated: true
  description: "committer may only edit canonical session log files (allowlist)"
  event: PreToolUse
  source: FILE_PATH
  mode: allowlist
  canonicalize: repo_relative
  tool_guard: "Write|Edit"
  match: 'codegen/logging/[0-9]{8}_[0-9]{6}_[a-z0-9_-]+_cycle\.jsonl$'
  message: "BLOCKED by committer-write-allowlist: committer may only write to canonical session logs"
  surface: user_global
  signal: AGENT_TYPE
  role: committer
  harnesses: all

# SCHEMA: session-log.md — reviewer may only edit session logs (canonical schema)
- id: reviewer-guard-session-log-write
  generated: true
  description: "reviewer may only edit canonical session log files (allowlist)"
  event: PreToolUse
  source: FILE_PATH
  mode: allowlist
  canonicalize: repo_relative
  tool_guard: "Write|Edit"
  match: 'codegen/logging/[0-9]{8}_[0-9]{6}_[a-z0-9_-]+_cycle\.jsonl$'
  message: "BLOCKED by reviewer-guard-session-log-write: reviewer may only write to canonical session logs"
  surface: user_global
  signal: AGENT_TYPE
  role: "reviewer-phoenix|reviewer-static"
  harnesses: pi

# SCHEMA: session-log.md — reviewer Bash allowlist (default-deny; codegen-log plus safe read-only utilities only)
- id: reviewer-bash-allowlist
  generated: true
  description: "reviewer may only run codegen-log and safe read-only shell utilities (allowlist)"
  event: PreToolUse
  source: COMMAND
  mode: allowlist
  tool_guard: Bash
  match: "^\\s*(codegen-log\\b|git\\s+(-C\\s+\\S+\\s+)?(diff|status|log|show)\\b|printf\\b|echo\\b|wc\\b|cat\\b|ls\\b|true\\b|:)"
  message: "BLOCKED by reviewer-bash-allowlist: only codegen-log and safe read-only shell utilities (git diff/status/log/show, echo, wc, cat, ls, true, :) allowed for reviewer"
  surface: user_global
  signal: AGENT_TYPE
  role: "reviewer-phoenix|reviewer-static"
  harnesses: all

# SCHEMA: rules-stacks.md — developer-static may not run static build/verify commands manually
- id: developer-static-no-manual-build
  generated: true
  description: "developer-static may not run static build/verify commands manually (gate owns verification)"
  event: PreToolUse
  source: COMMAND
  tool_guard: Bash
  match: "(render|wiring)-check\\.js|npm\\s+(run\\s+)?(build|serve)|vite\\s+build|playwright"
  message: "BLOCKED by developer-static-no-manual-build: do not run build/render/wiring-check/serve/playwright manually. LoopGate runs static-site verification automatically in the build loop after the developer role. Manual runs cause thrash."
  surface: user_global
  signal: AGENT_TYPE
  role: developer-static
  harnesses: all

# SCHEMA: rules-stacks.md — developer-static may not read/grep/glob build-output dirs
- id: developer-static-no-build-output-probe
  generated: true
  description: "developer-static may not probe build-output dirs (public/, dist/) via Read/Grep/Glob"
  event: PreToolUse
  source: FILE_PATH
  mode: deny
  canonicalize: repo_relative
  tool_guard: "Read|Grep|Glob"
  match: "(^|/)public/|(^|/)dist/"
  message: "BLOCKED by developer-static-no-build-output-probe: do not read/grep/glob generated build output (public/, dist/). Inspect SOURCE files; the gate verifies build output automatically."
  surface: user_global
  signal: AGENT_TYPE
  role: developer-static
  harnesses: all

# ── REGISTRATION ENTRIES (kind: registration) ────────────────────────────────
# These entries drive ONLY the # HOOK-MANIFEST: header block in the named .sh file.
# Script bodies remain hand-authored. Run `make install` or
# `python3 templates/generator/hook_registrations.py --emit-headers --hooks-dir ... --registry ...`
# to regenerate headers. Parity verified by `make hook-header-parity`.
#
# (No current NOT-YET-MIGRATED outliers — see header note above.)

- kind: registration
  id: build-agent-app-confinement
  event: PreToolUse
  tool_guard: "Write|Edit|MultiEdit|Bash|NotebookEdit"
  surface: user_global
  signal: none
  role: "*"
  harnesses: all
  rationale: "Denies Write/Edit/MultiEdit/NotebookEdit, and Bash write-vocab invocations (redirects, tee, cp/mv/install/rsync, sed -i/perl -pi, dd of=, truncate, ln -s), when CODEGEN_BUILD_CWD is set and the target resolves outside that dir, confining managed build subagents to the app sandbox. Fills the orchestrator-no-source-edit.sh subagent pass-through gap (AGENT_ID set -> exit 0) and the file-tool-only gap that let a relative symlink be truncated via a plain Bash redirect. Env-keyed (CODEGEN_BUILD_CWD), role-agnostic; composes with orchestrator-no-source-edit and build-worker-cwd-guard."

- kind: registration
  id: clean-tree-before-ship
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: none
  role: "*"
  harnesses: all
  rationale: "Blocks the orchestrator ship-mv (mv codegen/pitches/ready/<slug>.md codegen/pitches/shipped/<slug>.md) when git status --porcelain is non-empty, preventing a pitch from being shipped while orphaned cycle output sits uncommitted. Fail-open outside a git repo."

- kind: registration
  id: build-queue-continuity
  event: Stop
  tool_guard: "*"
  surface: user_global
  signal: CLAUDE_ROLE_FAMILY
  role: "*"
  harnesses: all

- kind: registration
  id: build-worker-cwd-guard
  event: PreToolUse
  tool_guard: "Bash|Write|Edit|MultiEdit|Read|Monitor"
  surface: user_global
  signal: AGENT_TYPE
  role: "*"
  harnesses: all

- kind: registration
  id: claude-debug-bash-guard
  event: PreToolUse
  tool_guard: Bash
  surface: user_global
  signal: CLAUDE_ROLE_FAMILY
  role: "*"
  harnesses: claude
  rationale: CLAUDE_ROLE_FAMILY-keyed; Pi investigation sessions use load-gate not role flags

- kind: registration
  id: curator-before-committer
  event: PreToolUse
