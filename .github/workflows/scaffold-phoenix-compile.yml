name: Scaffold Phoenix Compile

on:
  push:
    paths:
      - "shared/scaffold/phoenix/**"
      - "codegen-scaffold"
      - ".github/workflows/scaffold-phoenix-compile.yml"
  pull_request:
    paths:
      - "shared/scaffold/phoenix/**"
      - "codegen-scaffold"
      - ".github/workflows/scaffold-phoenix-compile.yml"

jobs:
  compile:
    name: Scaffold and compile Phoenix app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codegen
        uses: actions/checkout@v4

      - name: Set up toolchain via mise
        uses: jdx/mise-action@v2

      - name: Scaffold Phoenix app (no-ecto)
        run: |
          ./codegen-scaffold create \
            --stack=phoenix \
            --cwd=/tmp \
            --slug=ci_scaffold_app \
            --no-ecto

      - name: Install deps and compile
        working-directory: /tmp/ci_scaffold_app
        run: |
          mix deps.get
          mix compile --warnings-as-errors
