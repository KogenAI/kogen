# Template Generation Configuration
# Defines tool-specific variables for template generation

tools:
  claude:
    name: "claude"
    display_name: "Claude Code"
    yaml_frontmatter: true
    permissions_enabled: true
    hooks_enabled: true
    config_file: "claude-code-settings.json"
    mcp_config: ".mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.claude"

  codex:
    name: "codex"
    display_name: "Codex"
    yaml_frontmatter: false
    permissions_enabled: false
    hooks_enabled: true
    config_file: "config.toml"
    mcp_config: null
    commands_dir: null
    agents_dir: "agents"
    settings_dir: "$HOME/.codex"

# Common variables available to all templates
common:
  project_context_file: "PROJECT_CONTEXT.md"
  agents_file: "AGENTS.md"
  context_file: "CONTEXT.md"
  tidewave_port_template: "{{PORT}}"

harness:
  planner-phoenix:
    claude: { model: opus, effort: high }
    codex: { model: gpt-5.5, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-html:
    claude: { model: opus, effort: high }
    codex: { model: gpt-5.5, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-hugo:
    claude: { model: opus, effort: high }
    codex: { model: gpt-5.5, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-vite:
    claude: { model: opus, effort: high }
    codex: { model: gpt-5.5, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  developer-phoenix-backend:
    claude: { model: sonnet, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-phoenix-frontend:
    claude: { model: sonnet, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-html:
    claude: { model: sonnet, effort: high }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-hugo:
    claude: { model: sonnet, effort: high }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-vite:
    claude: { model: sonnet, effort: high }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  reviewer-phoenix:
    claude: { model: sonnet, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  reviewer-static:
    claude: { model: sonnet, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  committer:
    claude: { model: haiku, effort: low }
    codex: { model: gpt-5.5-mini, effort: medium }
    pi: { model: openai-codex/gpt-5.4-mini, effort: medium }
  build:
    claude: { model: haiku, effort: medium }
    codex: { model: gpt-4.1-mini, effort: medium }
    pi: { model: openai-codex/gpt-5.4-mini, effort: medium }
  inspector:
    claude: { model: sonnet, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }

roles:
  build:
    model: haiku
    effort: medium
    output_format: stream-json
    # build uses --tools allowlist (load gate) instead of --disallowed-tools
    # (permission filter). Same rationale as debug/design: only listed tools
    # enter context, and ToolSearch can't be used to re-expand the surface
    # mid-session. Allowlist covers orchestrate + delegate + dev work. Write
    # surface is further restricted to codegen/logging/ by
    # orchestrator-no-source-edit.sh (plain-orchestrator branch — CLAUDE_ROLE unset).
    tools:
      - Agent
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - Write
    system_prompt_file: shared/claude-build-system-prompt.txt
    append_project_context: false

  # debug/design use --tools allowlist (load gate) instead of --disallowed-tools
  # (permission filter). The deferred-tool harness already keeps most tools out
  # of context by default, so denylists do nothing for context — the only real
  # context-trim happens when you exclude default-loaded tools (AskUserQuestion,
  # ScheduleWakeup, ToolSearch). --tools "A,B,C" gives precise control: only
  # listed tools ever enter context, and ToolSearch can't be used to re-expand
  # the surface mid-session.
  #
  # Allowlist: investigation + design-doc authoring only. Write surface is then
  # path-scoped to codegen/designs/** by orchestrator-no-source-edit.sh, and
  # destructive Bash is filtered by debug-bash-safety-guard.sh.
  debug:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - Write
    system_prompt_file: shared/claude-debug-system-prompt.txt
    append_project_context: true

  design:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - Write
    system_prompt_file: shared/claude-design-system-prompt.txt
    append_project_context: true

  housekeeper:
    model: haiku
    effort: medium
    output_format: text
    allowed_tools:
      - Write
      - Edit
    disallowed_tools: null
    system_prompt: |
      Update PROJECT_CONTEXT.md from build summary. Output only the updated file. Output: caveman ultra. Agents read you, not humans. No preamble. No recap. No pleasantries. Drop articles, filler, hedging. Fragments OK. Arrows for causality (X → Y). Short synonyms (fix not "implement a solution"). Inline acronyms (dev, VE, impl, DB, conn, fn, reqs). NEVER touch JSON schemas, Ecto field names, contracts, code blocks, error strings, "MUST"/"NEVER"/"FORBIDDEN", or hook markers (ALL CLEAR ✅, FAILED ❌, INCONCLUSIVE ⚠️) — verbatim regardless of style. Drop ultra for security warnings or irreversible-action confirmations.

  inspector:
    model: sonnet
    effort: medium
    output_format: text
    disallowed_tools:
      - EnterPlanMode
      - ExitPlanMode
      - EnterWorktree
      - AskUserQuestion
      - Write
      - Edit
      - MultiEdit
      - NotebookEdit
      - Plan
    system_prompt: |
      Read-only inspector. Answer user's question by examining app state in working directory.
      Read files via Read tool. Query db/logs via Bash (SELECT, grep, tail — read-only).
      Do not mutate anything. Report: what you found, why it matters, recommended next steps.

  bouncer:
    model: haiku
    effort: low
    output_format: stream-json
    json_schema: bouncer.json
  concierge:
    model: haiku
    effort: low
    output_format: stream-json
    json_schema: concierge.json
  preference_extractor:
    model: haiku
    effort: low
    output_format: stream-json
    json_schema: preference_extractor.json
  user_app_build:
    model: sonnet
    effort: medium
    output_format: stream-json
    json_schema: user_app_build.json

budgets:
  build: 25.0
  classifier: 0.50
  default: 5.0
