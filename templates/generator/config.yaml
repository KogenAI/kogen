# Template Generation Configuration
# Defines tool-specific variables for template generation

tools:
  claude:
    name: "claude"
    display_name: "Claude Code"
    yaml_frontmatter: true
    permissions_enabled: true
    hooks_enabled: true
    config_file: "claude-code-settings.json"
    mcp_config: ".mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.claude"

  codex:
    name: "codex"
    display_name: "Codex"
    yaml_frontmatter: false
    permissions_enabled: false
    hooks_enabled: true
    config_file: "config.toml"
    mcp_config: null
    commands_dir: null
    agents_dir: "agents"
    settings_dir: "$HOME/.codex"

  cursor:
    name: "cursor"
    display_name: "Cursor CLI"
    yaml_frontmatter: false
    permissions_enabled: false
    hooks_enabled: false
    config_file: null
    mcp_config: "mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.cursor"

# Common variables available to all templates
common:
  project_context_file: "PROJECT_CONTEXT.md"
  agents_file: "AGENTS.md"
  context_file: "CONTEXT.md"
  tidewave_port_template: "{{PORT}}"

harness:
  planner:
    claude: { model: claude-opus-4-7, effort: high }
    codex: { model: gpt-5.5, effort: high }
    cursor: { model: claude-opus-4-7-thinking-high, effort: high }
  phoenix-developer:
    claude: { model: claude-sonnet-4-6, effort: high }
    codex: { model: gpt-5.5, effort: medium }
    cursor: { model: claude-sonnet-4-6, effort: medium }
  data-layer-developer:
    claude: { model: claude-sonnet-4-6, effort: high }
    codex: { model: gpt-5.5, effort: medium }
    cursor: { model: claude-sonnet-4-6, effort: medium }
  static-site-developer:
    claude: { model: claude-sonnet-4-6, effort: high }
    codex: { model: gpt-5.5, effort: medium }
    cursor: { model: claude-sonnet-4-6, effort: medium }
  verification-engineer:
    claude: { model: claude-sonnet-4-6, effort: medium }
    codex: { model: gpt-5.5, effort: low }
    cursor: { model: claude-sonnet-4-6, effort: medium }
  code-reviewer:
    claude: { model: claude-sonnet-4-6, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    cursor: { model: claude-sonnet-4-6, effort: medium }
  committer:
    claude: { model: claude-haiku-4-5-20251001, effort: medium }
    codex: { model: gpt-5.5-mini, effort: medium }
    cursor: { model: claude-haiku-4-5-20251001, effort: medium }
  build:
    claude: { model: claude-sonnet-4-6, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    cursor: { model: claude-sonnet-4-6, effort: medium }
  inspector:
    claude: { model: claude-sonnet-4-6, effort: medium }
    codex: { model: gpt-5.5, effort: medium }
    cursor: { model: claude-sonnet-4-6, effort: medium }
