# Template Generation Configuration
# Defines tool-specific variables for template generation

tools:
  claude:
    name: "claude"
    display_name: "Claude Code"
    yaml_frontmatter: true
    permissions_enabled: true
    hooks_enabled: true
    config_file: "claude-code-settings.json"
    mcp_config: ".mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.claude"
  pi:
    name: "pi"
    display_name: "Pi"
    yaml_frontmatter: true
    agents_dir: "$HOME/.pi/agent/agents"
    # claude tool name -> pi tool name. Pi's built-in registry is
    # bash,edit,find,grep,ls,read,write (probed from the installed pi package);
    # subagent/ask_user_question/web_search/fetch_webpage come from
    # harnesses/pi/pi-extensions/*. An unmapped claude tool ABORTS generation —
    # never silently drop a tool from a role's allowlist (pi silently ignores
    # unknown --tools names at runtime, so generation-time is the only guard).
    tool_map:
      Agent: subagent
      AskUserQuestion: ask_user_question
      Bash: bash
      Edit: edit
      Glob: find
      Grep: grep
      MultiEdit: edit
      Read: read
      WebFetch: fetch_webpage
      WebSearch: web_search
      Write: write

# Common variables available to all templates
common:
  project_context_file: "PROJECT_CONTEXT.md"
  agents_file: "AGENTS.md"
  context_file: "CONTEXT.md"
  tidewave_port_template: "{{PORT}}"

harness:
  planner-phoenix:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-static:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  # `fallback:` is an ordered same-provider rung list walked on a
  # switch_model classification (LoopQueue.switch_model_reason?/1) — a
  # role's primary model reporting "unavailable"/"disabled"/"not found".
  # Distinct from `escalate_model`/`escalate_effort` (a single give-up-
  # boundary override tried once on the FINAL gate-retry attempt): a
  # fallback rung is tried on ANY attempt whose failure classifies
  # switch_model, immediately, not only at the end. Cross-provider rungs
  # (Anthropic model on a pi/openai-codex role or vice versa) are OUT OF
  # SCOPE here — see codegen/pitches/draft/cross-provider-model-fallback.md.
  developer-phoenix-backend:
    claude:
      {
        model: sonnet,
        effort: medium,
        escalate_model: opus,
        escalate_effort: high,
        fallback: [{ model: opus, effort: medium }],
      }
    pi:
      {
        model: openai-codex/gpt-5.4,
        effort: medium,
        escalate_model: openai-codex/gpt-5.5,
        escalate_effort: high,
        fallback: [{ model: openai-codex/gpt-5.5, effort: medium }],
      }
  developer-phoenix-frontend:
    claude:
      {
        model: sonnet,
        effort: medium,
        escalate_model: opus,
        escalate_effort: high,
        fallback: [{ model: opus, effort: medium }],
      }
    pi:
      {
        model: openai-codex/gpt-5.4,
        effort: medium,
        escalate_model: openai-codex/gpt-5.5,
        escalate_effort: high,
        fallback: [{ model: openai-codex/gpt-5.5, effort: medium }],
      }
  # Pi rungs pinned to the gpt-5.6 generation (see `pi --list-models`).
  # Tier map, from pi's own catalog cost table ($/Mtok in/out):
  #   luna  1/6    (haiku tier)
  #   terra 2.5/15 (sonnet tier)  ← identical price to the retired gpt-5.4,
  #                                 but 372K ctx vs 272K. Strict upgrade.
  #   sol   5/30   (opus tier)    ← identical price to gpt-5.5, newer gen.
  # effort raised medium→high to match the claude rung: developer-static owns
  # the whole static build, and its claude twin has always run effort: high.
  developer-static:
    # PER-ROLE HARNESS OVERRIDE — this role runs on pi (ChatGPT) even inside an
    # otherwise-claude build. RoleResolver.resolve_harness/2 reads
    # `.harness.<role>.harness` and OrchestrationLoop.invoke_role/4 applies it
    # per role, so `codegen-build --harness=claude` → `mix codegen.loop
    # --harness=claude_code` still dispatches THIS role through pi, while
    # planner-static / reviewer-static / committer stay on claude.
    # Absent this key the role would inherit the build-wide harness.
    # Model/effort below are then read from the `pi:` block, not `claude:`.
    #
    # NOTE for benchmarking: `make bench` runs its claude and pi arms off THIS
    # file, so while this key is set the "claude" arm runs developer-static on
    # pi too. Comment it out to isolate a pure claude-vs-pi comparison.
    #
    # Evidence for pi (bench 20260717_064438, static vite-react scaffold):
    #   developer-static  claude/sonnet $1.5142  vs  pi/gpt-5.6-terra $0.4462  → 3.4x cheaper
    #   whole build       claude $2.2094 FAILED  vs  pi $0.7564 PASSED
    harness: pi
    claude:
      {
        model: sonnet,
        effort: high,
        escalate_model: opus,
        escalate_effort: high,
        fallback: [{ model: opus, effort: high }],
      }
    pi:
      {
        model: openai-codex/gpt-5.6-terra,
        effort: high,
        escalate_model: openai-codex/gpt-5.6-sol,
        escalate_effort: high,
        fallback: [{ model: openai-codex/gpt-5.6-sol, effort: high }],
      }
  reviewer-phoenix:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.4, effort: medium }
  reviewer-static:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.4, effort: medium }
  # Pi uses the openai-codex model namespace; Pi requires openai-codex/ prefix per pi CLI syntax.
  committer:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: medium }
  context-curator:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: low }
  app_build:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.4, effort: medium }
  inspector:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.4, effort: medium }
  # debug = pi-debug launcher config; read by pi-debug.sh via yq .harness.debug.pi.model
  # Distinct from harness.inspector (read-only inspector role).
  debug:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.4, effort: medium }
  shape:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  experiment:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  ops:
    claude: { model: sonnet, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  babysit:
    claude: { model: sonnet, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }

roles:
  usage-rules:
    model: haiku
    effort: low
    output_format: text
    allowed_tools:
      - Write
      - WebFetch

  # debug/shape use --tools allowlist (load gate) instead of --disallowed-tools
  # (permission filter). The deferred-tool harness already keeps most tools out
  # of context by default, so denylists do nothing for context — the only real
  # context-trim happens when you exclude default-loaded tools (AskUserQuestion,
  # WebFetch, ToolSearch). --tools "A,B,C" gives precise control: only
  # listed tools ever enter context, and ToolSearch can't be used to re-expand
  # the surface mid-session.
  #
  # Allowlist: investigation + pitch authoring only. Write surface is then
  # path-scoped to codegen/pitches/** by orchestrator-no-source-edit.sh, and
  # destructive Bash is filtered by claude-debug-bash-guard.sh.
  #
  # Scheduler tools (CronCreate, CronDelete, CronList, Monitor, ScheduleWakeup)
  # are intentionally granted to ops/debug for interactive /loop sessions.
  # In headless --print --no-session-persistence mode these tools cannot
  # self-fire (no idle session); the prompt bodies detect and tell the operator.
  debug:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - Bash
      - CronCreate
      - CronDelete
      - CronList
      - Edit
      - Glob
      - Grep
      - Monitor
      - Read
      - ScheduleWakeup
      - Skill
      - Write
    system_prompt_file: harnesses/claude/claude-debug-system-prompt.txt
    append_project_context: false

  shape:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - AskUserQuestion
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - WebFetch
      - WebSearch
      - Workflow
      - Write
    system_prompt_file: harnesses/claude/claude-shape-system-prompt.txt
    append_project_context: true

  experiment:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - AskUserQuestion
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - WebFetch
      - WebSearch
      - Write
    system_prompt_file: harnesses/claude/claude-experiment-system-prompt.txt
    append_project_context: true

  ops:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - AskUserQuestion
      - Bash
      - CronCreate
      - CronDelete
      - CronList
      - Edit
      - Glob
      - Grep
      - Monitor
      - Read
      - ScheduleWakeup
      - Skill
      - WebFetch
      - WebSearch
      - Write
    system_prompt_file: harnesses/claude/claude-ops-system-prompt.txt
    append_project_context: false

  babysit:
    model: sonnet
    effort: high
    output_format: text
    tools:
      - Agent
      - AskUserQuestion
      - Bash
      - CronCreate
      - CronDelete
      - CronList
      - Edit
      - Glob
      - Grep
      - Monitor
      - Read
      - ScheduleWakeup
      - Skill
      - WebFetch
      - WebSearch
      - Write
    system_prompt_file: harnesses/claude/claude-babysit-system-prompt.txt
    append_project_context: false

  housekeeper:
    model: haiku
    effort: medium
    output_format: text
    allowed_tools:
      - Write
      - Edit
    disallowed_tools: null
    system_prompt: |
      Update PROJECT_CONTEXT.md from build summary. Output only the updated file. Output: caveman ultra. Agents read you, not humans. No preamble. No recap. No pleasantries. Drop articles, filler, hedging. Fragments OK. Arrows for causality (X → Y). Short synonyms (fix not "implement a solution"). Inline acronyms (dev, VE, impl, DB, conn, fn, reqs). NEVER touch JSON schemas, Ecto field names, contracts, code blocks, error strings, "MUST"/"NEVER"/"FORBIDDEN", or hook markers (ALL CLEAR ✅, FAILED ❌, INCONCLUSIVE ⚠️) — verbatim regardless of style. Drop ultra for security warnings or irreversible-action confirmations.

  inspector:
    model: sonnet
    effort: medium
    output_format: text
    disallowed_tools:
      - EnterPlanMode
      - ExitPlanMode
      - EnterWorktree
      - AskUserQuestion
      - Write
      - Edit
      - MultiEdit
      - NotebookEdit
      - Plan
    system_prompt: |
      Read-only inspector. Answer user's question by examining app state in working directory.
      Read files via Read tool. Query db/logs via Bash (SELECT, grep, tail — read-only).
      Do not mutate anything. Report: what you found, why it matters, recommended next steps.

  app_build:
    model: sonnet
    effort: medium
    output_format: stream-json
    json_schema: app_build.json
    system_prompt: ""

budgets:
  build: 25.0
  classifier: 0.50
  default: 5.0
