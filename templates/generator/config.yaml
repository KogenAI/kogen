# Template Generation Configuration
# Defines tool-specific variables for template generation

tools:
  claude:
    name: "claude"
    display_name: "Claude Code"
    yaml_frontmatter: true
    permissions_enabled: true
    hooks_enabled: true
    config_file: "claude-code-settings.json"
    mcp_config: ".mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.claude"

  codex:
    name: "codex"
    display_name: "Codex"
    yaml_frontmatter: false
    permissions_enabled: false
    hooks_enabled: true
    config_file: "config.toml"
    mcp_config: null
    commands_dir: null
    agents_dir: "agents"
    settings_dir: "$HOME/.codex"

  cursor:
    name: "cursor"
    display_name: "Cursor CLI"
    yaml_frontmatter: false
    permissions_enabled: false
    hooks_enabled: false
    config_file: null
    mcp_config: "mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.cursor"

# Common variables available to all templates
common:
  project_context_file: "PROJECT_CONTEXT.md"
  agents_file: "AGENTS.md"
  context_file: "CONTEXT.md"
  tidewave_port_template: "{{PORT}}"

harness_models:
  planner:
    claude: "claude-opus-4-7"
    codex: "gpt-5.5"
    cursor: "claude-opus-4-7-thinking-high"
  phoenix-developer:
