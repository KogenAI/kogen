# Template Generation Configuration
# Defines tool-specific variables for template generation

tools:
  claude:
    name: "claude"
    display_name: "Claude Code"
    yaml_frontmatter: true
    permissions_enabled: true
    hooks_enabled: true
    config_file: "claude-code-settings.json"
    mcp_config: ".mcp.json"
    commands_dir: "commands"
    agents_dir: "agents"
    settings_dir: "$HOME/.claude"

# Common variables available to all templates
common:
  project_context_file: "PROJECT_CONTEXT.md"
  agents_file: "AGENTS.md"
  context_file: "CONTEXT.md"
  tidewave_port_template: "{{PORT}}"

harness:
  planner-phoenix:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-html:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-hugo:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  planner-vite:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  developer-phoenix-backend:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-phoenix-frontend:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-html:
    claude: { model: sonnet, effort: high }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-hugo:
    claude: { model: sonnet, effort: high }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  developer-vite:
    claude: { model: sonnet, effort: high }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  reviewer-phoenix:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  reviewer-static:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  # Pi uses the openai-codex model namespace; Pi requires openai-codex/ prefix per pi CLI syntax.
  committer:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: medium }
  context-curator:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: low }
  build:
    claude: { model: haiku, effort: medium }
    pi: { model: openai-codex/gpt-5.4-mini, effort: medium }
  bouncer:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: low }
  concierge:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: low }
  preference_extractor:
    claude: { model: haiku, effort: low }
    pi: { model: openai-codex/gpt-5.4-mini, effort: low }
  user_app_build:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  inspector:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  # debug = pi-debug launcher config; read by pi-debug.sh via yq .harness.debug.pi.model
  # Distinct from harness.inspector (combobulate HarnessConfig.model_and_effort_for(:inspector,...))
  debug:
    claude: { model: sonnet, effort: medium }
    pi: { model: openai-codex/gpt-5.3-codex, effort: medium }
  shape:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }
  ops:
    claude: { model: opus, effort: high }
    pi: { model: openai-codex/gpt-5.5, effort: high }

roles:
  usage-rules:
    model: haiku
    effort: low
    output_format: text
    allowed_tools:
      - Write
      - WebFetch

  build:
    model: haiku
    effort: medium
    output_format: stream-json
    # build uses --tools allowlist (load gate) instead of --disallowed-tools
    # (permission filter). Same rationale as debug/design: only listed tools
    # enter context, and ToolSearch can't be used to re-expand the surface
    # mid-session. Allowlist covers orchestrate + delegate + dev work. Write
    # surface is further restricted to codegen/logging/ by
    # orchestrator-no-source-edit.sh (plain-orchestrator branch — CLAUDE_ROLE unset).
    tools:
      - Agent
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - Write
    system_prompt_file: harnesses/claude/claude-build-system-prompt.txt
    append_project_context: false

  # debug/shape use --tools allowlist (load gate) instead of --disallowed-tools
  # (permission filter). The deferred-tool harness already keeps most tools out
  # of context by default, so denylists do nothing for context — the only real
  # context-trim happens when you exclude default-loaded tools (AskUserQuestion,
  # WebFetch, ToolSearch). --tools "A,B,C" gives precise control: only
  # listed tools ever enter context, and ToolSearch can't be used to re-expand
  # the surface mid-session.
  #
  # Allowlist: investigation + pitch authoring only. Write surface is then
  # path-scoped to codegen/pitches/** by orchestrator-no-source-edit.sh, and
  # destructive Bash is filtered by claude-debug-bash-guard.sh.
  #
  # Scheduler tools (CronCreate, CronDelete, CronList, Monitor, ScheduleWakeup)
  # are intentionally granted to ops/debug for interactive /loop sessions.
  # In headless --print --no-session-persistence mode these tools cannot
  # self-fire (no idle session); the prompt bodies detect and tell the operator.
  debug:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - Bash
      - CronCreate
      - CronDelete
      - CronList
      - Edit
      - Glob
      - Grep
      - Monitor
      - Read
      - ScheduleWakeup
      - Skill
      - Write
    system_prompt_file: harnesses/claude/claude-debug-system-prompt.txt
    append_project_context: true

  shape:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - AskUserQuestion
      - Bash
      - Edit
      - Glob
      - Grep
      - Read
      - Skill
      - WebFetch
      - WebSearch
      - Workflow
      - Write
    system_prompt_file: harnesses/claude/claude-shape-system-prompt.txt
    append_project_context: true

  ops:
    model: opus
    effort: high
    output_format: text
    tools:
      - Agent
      - AskUserQuestion
      - Bash
      - CronCreate
      - CronDelete
      - CronList
      - Edit
      - Glob
      - Grep
      - Monitor
      - Read
      - ScheduleWakeup
      - Skill
      - WebFetch
      - WebSearch
      - Write
    system_prompt_file: harnesses/claude/claude-ops-system-prompt.txt
    append_project_context: true

  housekeeper:
    model: haiku
    effort: medium
    output_format: text
    allowed_tools:
      - Write
      - Edit
    disallowed_tools: null
    system_prompt: |
      Update PROJECT_CONTEXT.md from build summary. Output only the updated file. Output: caveman ultra. Agents read you, not humans. No preamble. No recap. No pleasantries. Drop articles, filler, hedging. Fragments OK. Arrows for causality (X → Y). Short synonyms (fix not "implement a solution"). Inline acronyms (dev, VE, impl, DB, conn, fn, reqs). NEVER touch JSON schemas, Ecto field names, contracts, code blocks, error strings, "MUST"/"NEVER"/"FORBIDDEN", or hook markers (ALL CLEAR ✅, FAILED ❌, INCONCLUSIVE ⚠️) — verbatim regardless of style. Drop ultra for security warnings or irreversible-action confirmations.

  inspector:
    model: sonnet
    effort: medium
    output_format: text
    disallowed_tools:
      - EnterPlanMode
      - ExitPlanMode
      - EnterWorktree
      - AskUserQuestion
      - Write
      - Edit
      - MultiEdit
      - NotebookEdit
      - Plan
    system_prompt: |
      Read-only inspector. Answer user's question by examining app state in working directory.
      Read files via Read tool. Query db/logs via Bash (SELECT, grep, tail — read-only).
      Do not mutate anything. Report: what you found, why it matters, recommended next steps.

  bouncer:
    model: haiku
    effort: low
    output_format: stream-json
    json_schema: bouncer.json
    system_prompt: ""
  concierge:
    model: haiku
    effort: low
    output_format: stream-json
    json_schema: concierge.json
    system_prompt: ""
  preference_extractor:
    model: haiku
    effort: low
    output_format: stream-json
    json_schema: preference_extractor.json
    system_prompt: ""
  user_app_build:
    model: sonnet
    effort: medium
    output_format: stream-json
    json_schema: user_app_build.json
    system_prompt: ""

budgets:
  build: 25.0
  classifier: 0.50
  default: 5.0
