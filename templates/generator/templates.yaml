# Template Mapping Configuration
# Maps shared templates to their output destinations

templates:

# Command templates (generated dynamically from shared/commands/)
commands:
  source_dir: "shared/commands"
  claude_output_dir: "generated/claude-code/commands"
  opencode_output_dir: "generated/opencode/commands"

# Subagent templates (generated dynamically from shared/subagents/)
subagents:
  source_dir: "shared/subagents"
  claude_output_dir: "generated/claude-code/subagents"
  opencode_output_dir: "generated/opencode/subagents"
