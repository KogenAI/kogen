# Shaped against develop fa48e817. Part 1 of 3 of the split of durable-builds-and-failure-reports. Offline only (rule 49).
# Scenarios state outcomes; INTENT.md "Tests the Developer writes" names each test and its key assertions.
# Fixtures: WorkspaceFixture (test/support/workspace_fixture.ex; fake_codex, fake_claude on its `:claude` route) and
# ScriptedBuildFixture (test/support/scripted_build_fixture.ex, codex protocol, Developer session `developer-session`;
# `fail_first: [1]` fails call 1's first cycle and resumes the same session; `provider_fail: ["developer-<n>"]` or
# `["reviewer-<n>"]` makes that invocation print `:provider_tail` and exit 1).

- id: every-stop-writes-a-report
  given: >-
    Fixture Builds that end as: (a) offline exhaustion (fake_codex, FAKE_CHECK_FAIL_ALWAYS=1), twice in one control;
    (b) a Jev cannot-comply stop; (c) a readiness failure (fake_claude, FAKE_CLAUDE_LOGGED_OUT=1); (d) a usage-limited
    Developer turn (ScriptedBuildFixture, provider_fail developer-1, be_n9crq_claude_session_limit.json); (e) a
    publication refusal (control's branch moved during the Build); (f) a missing control deps/ after the tracking
    record exists. Controls: pre-admission refusals (missing Jev key, unknown route, live lock).
  when: Each Build returns.
  then: >-
    Each writes exactly one `.kogen/runtime/scenario-tracking/<build-id>/failure-report.json` with schema_version 1
    and every field INTENT.md lists, written by temp file and rename (no temp file left), with `record_sha256` equal
    to the sha256 of record.json's final bytes, build_id the tracking directory's name, and record the
    control-relative record path. (a) offline-exhausted, class item, counts_toward item, signature = the
    attempt's last failure_signatures entry; the first has same_signature_count 1 and next_action rebuild, the second
    2 and reshape_details. (b) cannot-comply, shaping, reshape_scope. (c) environment, class environment, stop_class
    null, next_command `mix kogen.claude.login`, owner status `stopped: environment` (today `stopped: integrity`).
    (d) provider, provider_wait, developer_session_id `developer-session`, counts_toward null. (e)
    accepted-unpublished, environment, inspect, owner status still `accepted-unpublished: <reason>`. (f) admission,
    environment, candidate null. For (a), (c) and a Claude login rejection, the owner status is `stopped: <c>`, the
    report's category is <c> and the message contains `category: <c>;`, with one <c> for all three. Each error
    message contains `category: <category>; failure report: <path>; next action: <next_action>`. A second write for
    the same Build keeps the first report's bytes. The category table maps every category as INTENT.md lists and has
    no interrupted, publication-interrupted or session-lost row; the report has no continues, budget_state, published
    or continuable field. same_signature_count counts only reports with the same intent_id, approved package digest
    and signature digest. Pre-admission refusals write no record and no report.
  wrong_result: >-
    A stop without a report or with two; a report opened at its final path or replaced by a later write;
    record_sha256 of an earlier record state; a report category that differs from the owner status or the message;
    a readiness failure still labelled integrity; an existing category renamed; a report for a pre-admission refusal;
    a report in scenario-tracking/unknown/; a continuation field or row from build-continuation.
  verified_by: [check]
  evidence: One test per stop kind in failure_report_test.exs; report JSON decoded and compared field by field.
  proof:
    offline: [test/kogen/failure_report_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: fake harness roles and fixture controls; reports are files on disk"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/failure_report.ex, lib/kogen/build/failure_signature.ex, README.md, test/kogen/failure_report_test.exs]
    base: fail

- id: login-rejected-is-environment
  given: >-
    The committed excerpts xfjcrm76_claude_oauth_revoked.json (real Claude 401) and synthetic_codex_refresh_failed.json
    (labelled synthetic) in the provenance/output wrapper. (a) A Claude-route Developer turn printing the xfjcrm76
    output (fake_claude FAKE_CLAUDE_FAIL_TAIL); (b) a Codex Developer turn with the synthetic tail (ScriptedBuildFixture
    provider_fail developer-1); (c) a Review call with the xfjcrm76 tail (provider_fail reviewer-1); (d) a paid target
    printing it (controller_verification_test.exs provider_repo!). Controls: the 429, 529 and capacity excerpts and a
    result event with api_error_status 403.
  when: Each failure is settled.
  then: >-
    The login marker returns class environment, kind login_rejected, the harness and the classifying line for both
    excerpts; `ProviderMarker.classify/1` returns nil for them and today's values for every control; 403 is neither.
    (a), (b) and (c) stop after one invocation with no retry, category environment, stop_class environment, and a
    message starting "<developer|reviewer>: <harness> login rejected (401) (class environment); run `<command>`", the
    harness and command following the tail (`claude` and `mix kogen.claude.login` for (a) and (c), `codex` and `mix
    kogen.codex.login` for (b)); (c) is not review-failure. (d) runs the target once and spends no paid retry; its
    cycle class and terminal state are environment and the cycle failure's reason is exactly "make paid: claude login
    rejected (401) (class environment); run `mix kogen.claude.login`". The report's next_command equals the command
    in the message. `Kogen.Harness.login_command/1` adds ` --project` only for a project scope. No login
    state or Keychain item is touched.
  wrong_result: >-
    A 401 labelled provider, provider-failure, review-failure or paid; a retry; a message without the login command;
    a 403 or a timeout classified as a login failure; bare-event tail files without provenance.
  verified_by: [check]
  evidence: Committed real and labelled synthetic excerpts; invocation counters in the fake state.
  proof:
    offline: [test/kogen/provider_outcome_test.exs, test/kogen/controller_verification_test.exs, test/kogen/failure_report_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: recorded provider tails replayed through fake harness and target scripts"
    affected_paths: [lib/kogen/harness/provider_marker.ex, lib/kogen/harness.ex, lib/kogen/build.ex, lib/kogen/build/verification.ex, test/kogen/provider_outcome_test.exs, test/kogen/controller_verification_test.exs, test/kogen/failure_report_test.exs, test/support/fake_claude, test/support/provider_tails/xfjcrm76_claude_oauth_revoked.json, test/support/provider_tails/synthetic_codex_refresh_failed.json]
    base: fail

- id: rework-prompt-inlines-first-failure
  given: >-
    (a) A real ScriptedBuildFixture Build with fail_first [1] and provider_fail developer-2 (usage limit): cycle 1
    fails, the same session is resumed, and the resume stops as provider. (b) The mined handoff receipts of
    controller_handoff_test.exs with a frame carrying `reproduce`, the same without it, a cycle that failed before any
    receipt, and a render with a cycle and no signature. (c) offline.py on a failing test stage, and its
    `--signature-frame` replay; its reproduce command for the full test stage and the compile stage.
  when: The resume prompt is rendered and the frame is printed.
  then: >-
    (a) Before developer-2 launches, the record's attempt holds one `cycle_signatures` entry with cycle 1's target and
    first_failure, and no failure_signatures; developer-2's prompt carries `## First failure` with that first_failure;
    the report's signature is that entry. (b) The prompt still starts with "Controller verification failed after your
    turn"; the block follows the header with target, first_failure, error_head, a `Reproduce:` line (the frame's
    value, or the generic line naming the command `make check` runs, never `make check` as something to run) and the
    exact sentence "Passes in isolation is not
    acceptable: reproduce the failure under the gate's concurrency and make it deterministic; an unchanged Candidate
    stops the Build."; it renders with no receipt and with no signature passed; the prompt stays within 24,000 bytes.
    (c) A failing stage's frame carries `reproduce`: the stage's argv with the MIX_ENV run_stage gives it, so
    `MIX_ENV=test mix test --exclude live --warnings-as-errors` for the full test stage and `MIX_ENV=dev mix compile
    --warnings-as-errors --force` for the compile stage; the replay has no `reproduce`; the signature carries
    `reproduce` and every existing digest in failure_signature_test.exs is unchanged.
  wrong_result: >-
    A real Build's rework prompt without the block because the signature is only written at settlement; the
    reproduction is the single test or `make <target>`; a non-test stage reproduced with MIX_ENV=test or `make
    check`; `reproduce` changes a digest; the prompt's first line changes.
  verified_by: [check]
  evidence: The fake's saved developer-2 prompt, the record, rendered prompts and printed frames.
  proof:
    offline: [test/kogen/failure_report_test.exs, test/kogen/controller_handoff_test.exs, test/kogen/failure_signature_test.exs, test/kogen/offline_stage_results_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: one fixture Build plus prompt rendering and frame emission over committed excerpts"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/failure_handoff.ex, lib/kogen/build/failure_signature.ex, scripts/check/offline.py, scripts/check/README.md, README.md, test/kogen/failure_report_test.exs, test/kogen/controller_handoff_test.exs, test/kogen/failure_signature_test.exs, test/kogen/offline_stage_results_test.exs]
    base: fail

- id: candidates-show-the-report
  given: >-
    candidates_command_test.exs's hand-written owner records, one with a failure-report.json in its tracking directory
    and one without.
  when: "`mix kogen.candidates` runs."
  then: >-
    The first prints `class: <class>`, `next: <next_action>` (with ` (<next_command>)` when set) and `report: <path>`;
    the second prints `report: none` and no `published:` line. Every line printed today is still printed. The task stays read-only: it writes
    no file.
  wrong_result: The report is invisible; an existing line changes or disappears; listing writes a report.
  verified_by: [check]
  evidence: Captured task output.
  proof:
    offline: [test/kogen/candidates_command_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: hand-written records and report files"
    affected_paths: [lib/mix/tasks/kogen.candidates.ex, test/kogen/candidates_command_test.exs]
    base: fail

- id: existing-expectations-kept
  given: >-
    The existing tests INTENT.md lists under "These pass unedited": the failure-retention matrix and other category
    assertions in build_workspace_test.exs, scenario_lifecycle_test.exs, core_integrity_test.exs,
    commit_failure_rollback_test.exs, write_boundary_test.exs and guard_violation_rework_test.exs, the provider-marker
    tests, candidates_command_test.exs's listing tests, build_preconditions_test.exs and the prompt's first line.
  when: "`make check` runs on the Candidate."
  then: >-
    Every one passes unedited: categories other than readiness and login are unchanged, `stop_class` values are
    unchanged, `mix kogen.candidates` only gains lines, and pre-admission refusals still create no tracking record.
    No existing test is renamed or removed, and priv/kogen/test-reliability.yaml and
    test-reliability-remediation.yaml are unedited (rows bind by test name; added tests need none).
  wrong_result: An existing assertion is edited, loosened, skipped or deleted to make the change pass.
  verified_by: [check]
  evidence: "`git diff --stat` touches none of the listed files except added tests in guarded ones."
  proof:
    offline: [test/kogen/build_workspace_test.exs, test/kogen/scenario_lifecycle_test.exs, test/kogen/core_integrity_test.exs, test/kogen/commit_failure_rollback_test.exs, test/kogen/write_boundary_test.exs, test/kogen/guard_violation_rework_test.exs, test/kogen/build_preconditions_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: existing offline tests"
    affected_paths: [lib/kogen/build.ex, lib/mix/tasks/kogen.candidates.ex]
