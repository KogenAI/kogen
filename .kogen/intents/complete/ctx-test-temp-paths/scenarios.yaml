- id: ctx-temp-paths-collision-free
  given: The kogen-ctx tests at develop b775974b, which name shared temp paths by System.unique_integer alone and leave most behind.
  when: The kogen-ctx tests run in the full offline gate (many isolated test VMs, repeated gate runs on one machine).
  then: >-
    Every temp path in test/kogen/ctx_index_test.exs, test/kogen/ctx_mcp_test.exs and test/support/ctx_fixture.ex is
    built by CtxFixture.tmp_path/1 (prefix, OS pid, nanosecond time, unique integer) and every one a test creates is removed
    in on_exit (run/5's stderr file right after reading); the new test "temp paths are collision-free and cleaned up"
    asserts (a) two calls give different, non-existent paths under System.tmp_dir!() containing System.pid(), and (b) the
    source scan regex finds no temp path named by unique_integer alone; all existing ctx tests pass unchanged in name and
    assertions.
  wrong_result: >-
    A temp path is still named by unique_integer alone; created paths are left behind; an assertion is weakened or a test
    renamed; a smoke test replaces the exact assertions.
  verified_by: [check]
  evidence: Build TNKFPX6XyfcLVYkQfugKKMTa cycle-1 check log (ctx_index_test.exs:59, File.LinkError file already exists).
  proof:
    offline: [test/kogen/ctx_index_test.exs, test/kogen/ctx_mcp_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: test fixtures on real temp files"
    affected_paths: [test/support/ctx_fixture.ex, test/kogen/ctx_index_test.exs, test/kogen/ctx_mcp_test.exs]
