- id: extends-landed-slice-one
  scenario_ids: [symbols-and-refs-resolve-elixir, code-index-refreshes-and-rebuilds]
  description: >-
    Slice 1 landed at d9013413 and this Intent now edits its code in place (native/kogen-ctx/src/main.rs `USAGE`,
    `parse()`, `init()`, `refresh()`, `main()`; test/support/ctx_fixture.ex). A Build that reshapes slice 1's
    behaviour (index output, search, freshness, the index location, the check stages, Cargo.toml or Cargo.lock) to
    fit this slice would break the landed tests A1-A6, B1-B5, C1-C9 and D1-D6, which are outside the guards and must
    pass unedited. The guards allow only native/kogen-ctx/src/**, README.md, the fixture and the two new test files;
    E4 and G3 pin the extensions (usage line, schema 2) against the landed forms.
- id: alias-approximation
  scenario_ids: [symbols-and-refs-resolve-elixir, aliases-resolve-by-scope-not-by-name, repo-map-ranks-and-fits-budget]
  description: >-
    Alias scope is lexical-approximate: the whole module body counts, regardless of position, and nested modules
    inherit it. Imported local calls are not resolved. So in real code some refs are missed or mis-attributed (the
    alias fixture's line 11 shows one, on purpose), and the map's edges inherit that. Compiler truth belongs to row
    16b.
- id: fixture-name-table-regression
  scenario_ids: [aliases-resolve-by-scope-not-by-name]
  description: >-
    The Candidate passed its own shop-fixture checks with a table mapping the fixture's short names. The alias fixture
    uses names that appear nowhere else, and test F3 rejects Rust string literals naming fixture modules. A generic
    table (for example of common Elixir aliases) would still pass F3 and would be wrong in real code. The Reviewer
    checks that resolution reads only the parsed file's aliases and defmodules.
- id: float-ties-in-ranking
  scenario_ids: [repo-map-ranks-and-fits-budget]
  description: >-
    The specified orders include exact ties (inventory and pricing; lib/shop.ex and test; four files under
    `--focus lib/shop/`). They are exact in the probe because the tied files receive identical terms. A different
    summation order could make them differ in the last bits and break the path tie-break. The 1e-12 tie tolerance
    (Assumed 6) removes that risk without changing any expected order: the closest distinct ranks differ by more
    than 1e-3.
- id: schema-bump-rebuilds-once
  scenario_ids: [code-index-refreshes-and-rebuilds]
  description: >-
    Every index written by slice 1's binary is rebuilt once when this slice's binary first opens it. That is cheap
    (blob hashing plus parsing) and by design. It is not a migration.
  ownership:
    - paths: "KOGEN_CTX_HOME (default ~/Library/Caches/Kogen/ctx)/<project id>/index.sqlite (schema_version 2)"
      when_exists: reused when it opens as SQLite with schema_version 2 and the same root; a schema-1 or other file is deleted and rebuilt
      owner_after_creation: kogen-ctx (any invocation on that checkout)
      owner_during_operation: kogen-ctx processes, serialized by one BEGIN IMMEDIATE transaction per refresh
      permitted_mutation: kogen-ctx refresh and rebuild only; users may delete it at any time
      validation: meta.schema_version and meta.root checked on every open; files.blob compared with git hash-object on every refresh
      git_state: outside every checkout; never staged or committed
      upgrade_behavior: a later schema bumps schema_version again and the old file is rebuilt, never migrated
- id: developer-cargo-in-sandbox
  scenario_ids: [repo-map-ranks-and-fits-budget]
  description: >-
    As in slice 1: inside the write boundary `~/.cargo` is read-only. Run cargo only with `--locked --offline`, pass
    `--target-dir _build/cargo` from the repo root (test H5 does, like the landed D3; native/kogen-ctx/.cargo/config.toml
    points runs inside the crate at the same directory), never create `native/kogen-ctx/target/` (D1 refutes it),
    and never export CARGO_HOME before `mise exec` (P1). This slice may not change Cargo.toml or Cargo.lock (D4 pins
    the lock's SHA-256). The locked tree-sitter crates are already compiled by the landed cargo-build stage, so no
    fetch is needed (evidence/probe-preflight-d9013413.md P-1). If a crate outside the lock seems needed, stop and
    report; do not add it. `cargo fmt` needs no network; the cargo-fmt check stage rejects unformatted Rust.
- id: readme-guidance-references
  scenario_ids: [symbols-and-refs-resolve-elixir, repo-map-ranks-and-fits-budget]
  description: >-
    test/kogen/readme_guidance_test.exs checks every backticked `lib/`, `test/`, `scripts/`, `priv/` path in
    README.md exists in the repository and every `Module.fun/<digits>` pattern resolves to an exported Kogen.*
    function. Documenting `symbols`/`refs`/`map` with fixture examples (`lib/shop.ex`, `Shop.Cart.total/2`) would
    fail `make check`. The README extension uses placeholders (`<Module>.<fun>/<arity>`, `<path>`).
