- id: timeout-after-provider-started
  given: >-
    test/support/custody_controller_standin.exs in timeout mode at develop fa48e817. It prints READY and runs the fake
    provider once with timeout_ms 300. The supervisor starts that clock before spawning the provider and kills the group
    at the first 0.2 s watchdog tick past the deadline, which can come before provider.sh has written its pid files.
  when: >-
    The full offline suite loads the machine while "a real controller's timeout kills the whole group and releases the
    lock" in test/kogen/process_custody_test.exs runs the stand-in in timeout mode.
  then: >-
    The stand-in makes at most four attempts, with timeout_ms 300, 600, 1200 and 2400, deleting both <out>/provider.pid
    and <out>/grandchild.pid before each. After every attempt it exits non-zero unless facts["timed_out"] is true and the
    attempt's group is gone (kill -0 -<facts["pgid"]> fails). It stops at the first attempt that left both pid files with
    non-empty content, then releases the lock and prints TIMED_OUT=. The test therefore finds both pids, both dead, and no
    lock file. If the fourth attempt still leaves a pid file missing or empty, the stand-in calls release/1, prints one
    line naming the failure, and exits non-zero, so the test fails with {:ok, 1}. No fixed sleep is added; production
    code, test names, assertions and deadlines are unchanged; an unloaded run makes one 300 ms attempt.
  wrong_result: >-
    Timeout mode still makes a single fixed 300 ms attempt; it waits with a fixed sleep or a larger fixed timeout; it
    accepts a run without both pid files; it retries without limit or past 2400 ms; it retries or succeeds without
    checking that the attempt timed out and its group is gone; it keeps a pid file from an earlier attempt; production
    custody or supervisor code changes; or an assertion, test name or deadline changes.
  verified_by: [check]
  evidence: >-
    Build BSaavY4ASoCoOZC-8KbpubME cycle-1 check log (failure frame process_custody_test.exs:499). Shaping reproduction at
    fa48e817: with a 0.5 s-slow provider, timeout mode ends with TIMED_OUT=true and no pid files.
  proof:
    offline: [test/kogen/process_custody_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: stand-in script and fake provider on real files"
    affected_paths: [test/support/custody_controller_standin.exs]
- id: stop-after-provider-started
  given: >-
    test/support/custody_controller_standin.exs in stop mode at develop fa48e817. It prints READY and calls release/1 as
    soon as read_lock/1 shows the group recorded, which can be before provider.sh has written its pid files.
  when: >-
    The full offline suite loads the machine while "a real controller's normal Stop tears its own groups down and releases
    the lock" in test/kogen/process_custody_test.exs runs the stand-in in stop mode.
  then: >-
    Stop mode waits in the same condition loop as hang mode before READY and release/1; the loop is one closure defined
    before the case and used by both modes. The loop requires the group to be
    recorded and both <out>/provider.pid and <out>/grandchild.pid to be present with non-empty content, and uses short
    sleeps between checks. The Stop test therefore always finds both pids, both dead, and no lock file. The header comment
    states the READY contract for each mode.
  wrong_result: >-
    Stop mode still releases on the group alone, or waits with a fixed sleep; or an assertion, test name or deadline
    changes.
  verified_by: [check]
  evidence: >-
    Shaping reproduction at fa48e817: with a 1.0 s-slow provider, stop mode prints READY and STOPPED and leaves no pid
    files. With the shared hang-mode loop, the same run leaves both pids, both dead, and removes the lock.
  proof:
    offline: [test/kogen/process_custody_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: stand-in script and fake provider on real files"
    affected_paths: [test/support/custody_controller_standin.exs]
