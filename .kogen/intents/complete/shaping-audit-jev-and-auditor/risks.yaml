- id: build-session-environment
  scenario_ids: [auditor-setting-and-launch, auditor-runs-and-findings, jev-contract-questions]
  description: >-
    The Developer runs the tests inside its Build session, which exports KOGEN_ROLE=developer and the Build's
    KOGEN_HARNESS_HOME. Kogen.IsolatedCase children and System.cmd children inherit both (Port env only extends the
    parent's). Two earlier Reviews found tests that passed only outside a Build session. Rules: every main/2 call
    passes an explicit env with the audit-only Jev fakes (main/2 with env: %{} would let Kogen.Jev fall back to the
    real Keychain, lib/kogen/jev.ex:524); every Kogen.CompiledFixture.mix_task!/3 call and fixture Build passes
    {"KOGEN_ROLE", nil} and {"KOGEN_HARNESS_HOME", nil}; Fixture.audit_env!/1 deletes both in the isolated VM; the
    auditor launch drops KOGEN_HARNESS_HOME; S5 plants hostile values and asserts they never reach the auditor.
