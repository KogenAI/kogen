- id: auditor-detection-not-prevention
  scenario_ids: [auditor-runs-and-findings, auditor-setting-and-launch]
  description: >-
    Role sessions are not sandboxed. The audit detects writes to the materialization (including .git/ refs, HEAD, index
    and hooks), the checkout's watched set and the report directory, rejects the session and never reverts. The Codex
    auditor's context is opened for the materialization, so the checkout path appears in neither its project arguments
    nor its environment. It runs as the same OS user, so this is not a security boundary.
  ownership:
    - paths: <system temp>/kogen-audit-* (the HEAD plus package materialization)
      when_exists: Always new; a private 0700 directory per audit run.
      owner_after_creation: The running mix kogen.audit process.
      owner_during_operation: The deterministic checks and the auditor session read it; Kogen compares its manifest before and after the session.
      permitted_mutation: None. Any write anywhere, including inside .git/ (refs, HEAD, index, hooks), rejects the auditor session; the auditor runs with GIT_OPTIONAL_LOCKS=0.
      validation: Manifest of entry type, mode and SHA-256 without following links, including .git/ refs, HEAD, index and hooks.
      git_state: A git clone --local --no-checkout of the checkout with HEAD checked out and the package added; never pushed, never linked back.
      upgrade_behavior: Removed after every run, including failures and exceptions.
- id: auditor-records
  scenario_ids: [auditor-runs-and-findings]
  description: >-
    Auditor records join slice 1's report directory. They are the run bound's only memory, so a lost record re-runs
    the auditor (at most twice more), never skips it.
  ownership:
    - paths: .kogen/runtime/shaping-audits/<slug>/auditor/<revision>-<first 12 hex of SHA-256(route name)>.json
      when_exists: One per revision and route; a later run on the same revision and route replaces it atomically.
      owner_after_creation: The local checkout; written only by the audit's auditor layer.
      owner_during_operation: mix kogen.audit writes; the audit's run rule, --status, people and agents read.
      permitted_mutation: Written only by the auditor layer's record writer.
      validation: The run rule reads route, HEAD, seq, counted, status and findings; an undecodable record counts as absent.
      git_state: Ignored runtime data, never committed or published.
      upgrade_behavior: A record without the fields above is ignored, so the next audit re-runs within the bound.
- id: audit-time-budget
  scenario_ids: [auditor-runs-and-findings]
  description: >-
    No hard limit (direction 36): no auditor kill, no deadline passed to launch_auditor/4. The count bound stays (at
    most 2 per HEAD) and Jev keeps 60 s per request and per layer. Consequence: an auditor that ignores its own time
    can run long and nothing stops it; the recorded elapsed_ms makes that visible. Measured: Sol high 244-255 s, Opus
    high 169 s per audit of the original Draft (evidence/probe-auditor-profiles-2026-09-26.md); a later run without
    a limit took 908 s (original questions.md "Post-change run").
