- id: jev-key-setup
  scenario_ids: [jev-contract-questions]
  description: >-
    The Jev layer reads its key only from the Kogen-owned Keychain item dev.kogen.jev (no fallback). Without it the
    layer is unavailable, the report stays not_ready, and the reason names `security add-generic-password -s
    dev.kogen.jev`. The auditor still runs; Jev does not gate it. The Build handoff reads the same item since main
    98ebcfb2.
- id: privacy-boundary
  scenario_ids: [jev-contract-questions, question-gate-routes-questions]
  description: >-
    Each request's state holds exactly the fields its table names (question-set-v1.json, fix-check-v1.json,
    question-gate-v1.json), filled only from: the scenario id, split then clauses, wrong_result alternatives and
    evidence items; a scenario's given and when, only in clause-provider-only and fix-check requests (as both
