- id: auditor-runs-and-findings
  given: >-
    A fixture checkout (Fixture.repo!/1) with the `complete` Draft and a committed config whose hybrid route has
    `expert: {harness: codex, model: expert-model, effort: low}` and
    `auditor: {harness: codex, model: audit-model, effort: low}`. After the commit, the checkout holds the sentinel
    `SENTINEL-CHECKOUT` in an uncommitted edit, an untracked file, a second package and `.kogen/runtime/`.
    `Fixture.audit_env!/1` sets `KOGEN_HARNESS` to the fake auditor.
  when: >-
    `Kogen.ShapingAudit.main(["--auditor", "complete"], root: root, env: Fixture.audit_env!(root))` runs:
    - with a blocking deterministic finding;
    - on the clean Draft;
    - again after a Draft edit at the same HEAD;
    - after dispositions;
    - a fourth time.

    It also runs without `--auditor`, and with the setting missing. Each scripted message is tried (three findings,
    60 findings, oversized fields, `{"findings": []}`, no JSON), and each scripted write: in its own directory
    outside every watched location, a ref and the index inside `.git/`, in the checkout, and in the report
    directory. A fake that sleeps 5 s is tried, as is a launch failure (FAKE_AUDITOR_FAIL=1: exit 1 before any
    output). Slice 1's audit tests run on the new readiness contract.
  then: >-
    - Gating: dispositions are applied to the deterministic findings before the gate. With an open blocking
      deterministic finding, the auditor layer is `skipped` and there is no launch; with its only blocking finding
      disputable and dispositioned `not a defect`, the auditor runs. With Jev failing with HTTP 500 and a clean
      deterministic layer, the fake log shows exactly one launch.
    - Profile and place: the log shows `audit-model`, never `expert-model`. `pwd` is the materialization, a git
      work tree of HEAD plus the package, holding neither the untracked sentinel file nor the second package.
    - Prompt:
      - it holds auditor.md's read-only sentence, the `date` rule ("Run `date` first"), "answer within about 4
        minutes", the one-reply rule and every checklist item, as whitespace-normalised substrings;
      - it holds the package path, revision, HEAD and the prior-failures list, and no finding of the other layers
        or checkout path;
      - intent.yaml is inlined without `revisions`, `baseline_history`, `shaping_continuations` or `*approval*`,
        and questions.md is cut after `## Dispositions`;
      - with a package over 160,000 bytes, the cut is marked, and every file left out is listed in
        `not_audited_by_auditor`.
    - Runs:
      - three findings: one launch, then one confirming launch after the edit, then no launch on the fourth run
        (`bound_reached: true`);
      - `{"findings": []}`: a changed revision reuses it (`reused: true`, with the reason text), and there is no
        second launch;
      - no JSON: `unavailable` and `bound_reached: true`, with no second launch;
      - a launch failure is not counted, and the next run launches and counts.
    - No deadline: the 5-second fake is waited for and parsed, and the launch passes no deadline.
    - Without `--auditor`: nothing is launched. The stored run of the same revision, HEAD and route is reused, or
      the layer is `not-run`, and the report is `not_ready`.
    - Missing setting: `unavailable` with the reason "route codex has no auditor setting", and no launch.
    - Findings:
      - ids have the form `aud-<6 hex>-<n>`, blocking, with `auditor_label` kept;
      - 60 findings are cut to 50, the dropped count is stored, and blocking `auditor-findings-dropped` is raised;
      - oversized fields are cut to 200 and 1,000 characters and 10 paths;
      - dispositions are applied to the auditor findings before the gate routes them and the fix-check reads them;
      - a listed id without a disposition stays blocking;
      - "fixed" with the fix-check scripted `still_open` stays blocking;
      - "not a defect" clears it.
    - Writes: every write case, including `.git/` refs and the index, makes the layer `rejected`, naming the path,
      and the findings are discarded. A write outside every watched location does not reject.
    - Records: auditor records are named `<revision>-<12 hex of SHA-256(route)>.json`. A route named `../x` writes
      only inside `auditor/`.
    - Cleanup: the materialization is gone after every run, whether the layer ends `ok`, `unavailable`,
      `rejected` or with a launch failure.
    - Direct launches: no file under `lib/kogen/shaping_audit` starts a harness executable itself (source scan for
      `System.cmd`, `Port.open` and `:os.cmd`, excluding the landed `materialization.ex`'s git calls and the
      auditor's `git ls-files`).
    - Slice 1's audit tests (their names unchanged) hold on the new contract:
      - both files switch to `use Kogen.IsolatedCase, async: true`;
      - every `Kogen.ShapingAudit.main/2` call passes `env: Fixture.audit_env!(root)` (D3 merges its role into
        it), and every audit call that is not `--status` passes `--auditor`; `report!/3`
        (`test/kogen/shaping_audit_checks_test.exs:25-32`) and `call/3` (`test/kogen/shaping_audit_task_test.exs:36-48`)
        do this for their callers; every other expected code, finding id list and message stays as landed;
      - B7 "a disposition clears a disputable finding but never a mechanical one" (`:406-440`) still expects exit 0 and
        `ready` for paid-overbroad (`:417`, `:421`), and C2 "stale-disputed: the disposition clears the stale anchor"
        (`:444-453`) still expects `ready` (`:448`): the dispositions close their disputable findings before the
        auditor gate, so the auditor runs and is `ok`;
      - D6 "an approved-only package and the Shaper role run normally" (`test/kogen/shaping_audit_task_test.exs:234`)
        passes `Map.put(Fixture.audit_env!(root2), "KOGEN_ROLE", "shaper")` (was `env: %{"KOGEN_ROLE" => "shaper"}`
        at `:241`), so the Shaper-role check stays;
      - D1 "a ready audit exits 0, writes the report layout, and leaves .kogen/intents and tmp untouched" expects the
        twelve report keys of INTENT.md, `schema_version` 2, `layers.deterministic == %{"status" => "ok"}`,
        `layers.jev.status` and `layers.auditor.status` "ok", `state` "autonomous", `questions ==
        %{"sections" => %{"Assumed" => [], "Left undecided" => []}}` and `not_audited_by_auditor == []`
        (were `:70-79`);
      - D2's first audit, and D6's two audits, pass `--auditor`;
      - D7 "the mix task only delegates to the entry function and halts with its code" runs `["kogen.audit",
        "--auditor", "complete"]` and `["kogen.audit", "--nope", "complete"]` with `{"KOGEN_ROLE", nil}`,
        `{"KOGEN_HARNESS_HOME", nil}`, the audit-only Jev fakes, `KOGEN_HARNESS` and the fake auditor's controls
        (were `:250-251` and `:258-261`, `KOGEN_ROLE` only), expects exit 0 with the output line exactly `ready: <revision>` and no
        `not_ready`, then exit 2. Its `repo!(compiled: true)` fixture holds the four files `auditor.ex` and
        `jev_layer.ex` read from the working directory (INTENT.md "Fixture helpers");
      - D8 and slice 1's README paragraph are unchanged.
  wrong_result: >-
    Any of these:
    - the auditor runs in the checkout or on the Expert's setting;
    - its prompt carries earlier findings;
    - old findings carry over to a new revision;
    - an id listed with no disposition passes;
    - "fixed" is trusted without the fix-check;
    - writes are trusted or reverted;
    - it runs twice when the first run found nothing, or a launch failure uses up the bound;
    - the auditor is killed at a time limit, or its brief has no `date` rule;
    - a slice-1 test keeps passing `env: %{}` (the Jev layer would fall back to the Keychain), inherits the
      Build's `KOGEN_ROLE` or `KOGEN_HARNESS_HOME`, or is renamed or weakened to `not_ready` to pass;
    - a smoke test that checks only an exit code or a launch count;
    - fixture-specific shortcuts, such as a run counter kept in the test instead of the stored records, or a
      `:launcher` or `:manifest` option replacing the launch or the write detection.
  verified_by: [check]
  evidence: test/kogen/shaping_audit_auditor_test.exs and test/kogen/shaping_audit_task_test.exs from the fake auditor's log; test/kogen/shaping_audit_checks_test.exs and the task file's D1-D8 on the new readiness contract.
  tests:
    - >-
      R1 "skipped while an open blocking deterministic finding exists; Jev never gates it": on the not-ready copy,
      layers.auditor.status "skipped" and no argv file in the fake's log; on paid-overbroad with its disputable
      finding dispositioned "not a defect" (B7's line), exactly one launch and layers.auditor.status "ok"; on
      complete with Jev at HTTP 500, exactly one launch, layers.auditor.status "ok" and layers.jev.status
      "unavailable".
    - >-
      R2 "launches through the route's auditor setting, in the materialization, with the auditor.md prompt only":
      the logged argv contains "audit-model" and not "expert-model"; the logged pwd (`pwd -P`, so `/private/var/...`
      on macOS) is a `work` directory inside a `kogen-audit-*` directory of
      Kogen.ProjectScope.canonical(System.tmp_dir!()) (compare canonical paths, never the raw System.tmp_dir!()
      prefix), and never Kogen.ProjectScope.canonical(root); the logged HEAD equals Fixture.head(root); the
      logged file list holds the package's files under .kogen/intents/drafts/complete/ and neither the untracked
      sentinel file nor the second package; no logged stdin contains "SENTINEL-CHECKOUT"; the logged env has
      KOGEN_ROLE=auditor and no KOGEN_HARNESS_HOME; and the prompt contents and exclusions from `then`.
    - >-
      R3 "the prompt inlines the contract without history and names every file left out": the logged stdin has none
      of the keys revisions, baseline_history, shaping_continuations or approval from intent.yaml, no text after
      the heading that follows `## Dispositions`, and, for an oversized package, the CUT marker and
      not_audited_by_auditor equal to the exact list of left-out paths.
    - >-
      R4 "a first run with findings, one confirming run, then a third --auditor on the same HEAD launches nothing":
      the fake's launch count is 1, 2, 2 after the three audits, the three reports' auditor finding ids are the
      same three `aud-` ids with n 1-3, and the third report's layers.auditor.bound_reached is true.
    - >-
      R5 "a first run with no findings is reused on a changed revision": after the edit, layers.auditor.reused is
      true, its reason is exactly "ran once on HEAD <HEAD> with no findings; not re-run", and the launch count is 1.
    - >-
      R6 "an unparseable first run gives unavailable with bound_reached and no second run": with no-json,
      layers.auditor.status "unavailable" and bound_reached true on that first run (qb returns false there); after a Draft edit, the launch count is still 1
      and readiness "not_ready".
    - >-
      R7 "a launch failure does not count toward the bound and is followed by a counted run": with
      FAKE_AUDITOR_FAIL=1, layers.auditor.status "unavailable" and the record has counted false; then with empty,
      layers.auditor.status "ok", the record has counted true and seq 1.
    - >-
      R8 "nothing kills a slow auditor; the layer waits and parses its answer": FAKE_AUDITOR_SLEEP_SECONDS=5 with
      empty gives layers.auditor.status "ok" and elapsed_ms >= 5000.
    - >-
      R9 "without --auditor nothing launches and readiness is not_ready until a run exists": a first audit without
      --auditor gives layers.auditor.status "not-run", readiness "not_ready" and no launch; after one --auditor run
      with empty, an audit without --auditor at the same revision reuses it (status "ok", launch count 1) and
      readiness "ready".
    - >-
