# Slice 2 of 4 of shaping-quality (INTENT.md). Offline only. Shaped against develop b775974b. It extends slice 1's
# landed code (6b4376e9): Kogen.ShapingAudit.main/2 and audit/2, Report, Finding, Questions.parse/1, Fixture.repo!/1
# and Fixture.add_draft!/3, and mix kogen.audit.
# Fakes (all audit-only; the cataloged fake_jev, fake_security, fake_claude and fake_codex stay unedited):
#   - test/support/shaping_audit/fake_jev_audit (KOGEN_JEV_TRANSPORT) replays scripted answers (FAKE_JEV_ANSWERS)
#     and logs each request under FAKE_JEV_LOG_DIR. Its default is a per-question non-gate table, so it raises no
#     finding; `<question id>@<match>` keys script one item (INTENT.md "Tests and fixtures").
#     Its helper module test/support/shaping_audit/fake_jev_audit.ex builds scripted distributions.
#   - test/support/shaping_audit/fake_security_audit (KOGEN_JEV_SECURITY) is the Keychain. It logs each call to
#     FAKE_SECURITY_LOG and reports the item missing with FAKE_SECURITY_ITEM=missing.
#   - test/support/shaping_audit/fake_auditor (KOGEN_HARNESS) answers `auth status` with loggedIn true and exit 0
#     before reading stdin, and echoes the requested --session-id on the Claude protocol. Per launch it appends a line
#     to `launches` and logs argv, `pwd -P`, environment, stdin, `git rev-parse HEAD` of its working directory, the
#     sorted list of its files outside .git/ and (Codex) the --output-schema file under FAKE_AUDITOR_LOG_DIR. It
#     replays one of fake_auditor_messages/{three-findings,sixty-findings,oversized,empty,no-json}.txt
#     (FAKE_AUDITOR_MESSAGE), can sleep (FAKE_AUDITOR_SLEEP_SECONDS), can do one scripted write (FAKE_AUDITOR_WRITE)
#     and can exit 1 after logging and before any output (FAKE_AUDITOR_FAIL=1).
#   - test/support/managed_codex_fixture.py gains the trace keys `cwd` and `project_root` (KOGEN_PROJECT_ROOT), nothing
#     else (INTENT.md "Tests and fixtures").
# Environment (INTENT.md "Tests and fixtures"): every test file below uses Kogen.IsolatedCase; every main/2 call
# passes an explicit env holding the audit-only KOGEN_JEV_TRANSPORT and KOGEN_JEV_SECURITY; every mix_task!/3 call
# passes {"KOGEN_ROLE", nil} and {"KOGEN_HARNESS_HOME", nil}; Fixture.audit_env!/1 deletes both from the test VM.
# The calibration copies test/support/shaping_audit/calibration/{question-set-v1.json,fix-check-v1.json,
# question-gate-v1.question.json} are byte copies of this package's evidence files (SHA-256 in INTENT.md).
# This slice's fixture packages live under test/support/shaping_audit/packages/ (added with source: "packages"),
# never under drafts/, which slice 1's A3 walks. Tests never read .kogen/intents/** of the real checkout.
# Each scenario's `tests` key lists the ExUnit tests to write or change, named exactly as quoted (the label, such
# as J1, is not part of the name); the ledger binds rows by test name. A test that only checks an exit status, a
# count or a substring, where exact values are listed, does not prove the scenario.
- id: jev-contract-questions
  given: >-
    A fixture checkout (Fixture.repo!/1) with these fixture packages under test/support/shaping_audit/packages/:
    - `jev-clauses` plants one case for every question: an unobservable clause, a scoping clause, an uncaught wrong
      result, an offline-checkable paid observation, a provider-only clause in an offline scenario, a scenario that
      requires a non-goal, an Outcome item with no scenario, a Settled entry without provenance, and one supported
      and one contradicted `path:line` claim on `docs/note.txt`;
    - the clean counterpart of each planted case;
    - the scenarios `fix-target` and `unrelated-target`, which J6's `fixed` dispositions name (the fixed pair is
      three-findings' finding 1 with `fix-target`; the unrelated pair is its finding 2 with `unrelated-target`);
    - the sentinel `SENTINEL-NOT-ALLOWLISTED` in each non-allowlisted package file (`risks.yaml`, `approval.md`,
      `references.yaml`, `evidence/README.md`);
    - `jev-large`, with a clause over 16 KiB, and enough small items to make a request over 64 KiB.

    `jev-clauses` has no deterministic finding (J14 asserts `layers.deterministic == %{"status" => "ok"}`). The test
    commits `docs/note.txt` to the fixture repository and then writes `SENTINEL-WORKING-TREE` into its
    working-tree copy without committing.
  when: >-
    `Kogen.ShapingAudit.main(["--auditor", slug], root: root, env: Fixture.audit_env!(root))` runs on jev-clauses,
    with the fake auditor replaying `empty` (audit_env!'s default) unless a test names another message, and the fake
    transport scripted at, and just below, each entry's own gate (the `gate` field of question-set-v1.json). It runs
    again with the fake returning:
    - HTTP 500, 401 and 422;
    - 429 twice, then success;
    - invalid JSON;
    - a missing answer;
    - an unknown option id;
    - an echoed key;
    - a sleep past the layer deadline, with main/2's `jev_deadline_ms: 200`.

    It runs with the Keychain item missing. `Kogen.Jev.request_body/2` is called for a fixed Build-handoff input.
  then: >-
    - Shipped table: decoding `priv/kogen/shaping_audit/questions-v1.json` without its `fix-check` key equals the
      decoded calibration copy `question-set-v1.json`, and its `fix-check` equals the decoded `fix-check-v1.json`.
      The copies' SHA-256s equal the INTENT.md literals.
    - Gates: each of the 14 entries raises its finding at its gate and not just below it. Every Jev finding has
      `layer: jev` and `severity: advisory`. With only advisory Jev findings and the other layers `ok`, the report's
      readiness is `ready`.
    - Planted and clean cases: each planted case raises its finding, and each clean counterpart raises none.
    - Citations: a citation request carries the claim and at most 40 numbered lines read from the materialization,
      never from the working tree. `SENTINEL-WORKING-TREE` is never sent.
    - Fix-check: only auditor findings with a `fixed` disposition are fix-checked, each paired with the scenario its
      disposition names. A finding is marked `still_open` when `not_addressed >= 0.6` or `partly` is the most
      probable option, so `partly` never closes it.
    - Privacy: from the fake's request log, no request contains `SENTINEL-NOT-ALLOWLISTED`,
      `SENTINEL-WORKING-TREE` or a unified-diff header (`diff --git`), and only `clause-provider-only` and fix-check
      requests carry a scenario's `given` or `when`.
    - Size limits: jev-large raises advisory `jev-item-too-large` for the big clause, which is not sent, and advisory
      `jev-request-too-large`.
    - Load: at most 4 requests are in flight at once.
    - Failures: a 429 answered twice is retried and then answered, and the layer is `ok`. Every other failure mode
      gives `layers.jev.status` `unavailable`, a reason naming the failure, exactly one Jev finding
      (`jev-unavailable`, advisory, scope `environment`) and no other Jev finding, and readiness `not_ready`.
    - Keychain: with the item missing, the layer is `unavailable`, and its reason contains `security
      add-generic-password -s dev.kogen.jev`. The transport is never called, and the Keychain log names only the
      service `dev.kogen.jev`.
    - Stored data: `layers.jev.requests` holds the SHA-256 of every request body sent and `layers.jev.answers` the
      parsed answers per digest; the report never holds a response body.
    - Build handoff: `Kogen.Jev.request_body/2` for the fixed input is byte-identical to its value at b775974b
      (`lib/kogen/jev.ex` is unchanged since 3531023d), and `test/kogen/jev_test.exs` passes unchanged.
    - README: it gains "### Jev in the Shaping audit", stating the `dev.kogen.jev` setup command, the allowlist and
      that Jev's answers are advisory.
  wrong_result: >-
    Any of these:
    - questions are reworded or dropped;
    - the shipped table is compared against a `.kogen/intents/` path (the Candidate's latent defect);
    - whole files are sent;
    - citation lines come from the working tree;
    - `partly` closes a finding;
    - an advisory Jev answer blocks readiness;
    - an outage passes;
    - the key falls back to `ai.typesafe.api`;
    - the Jev executable is read from anywhere but main/2's env;
    - the Build handoff changes;
    - a smoke test that checks one planted case, or only an exit status;
    - fixture-specific shortcuts, such as matching the planted sentences instead of reading Jev's answers, or a
      `:jev_transport` option replacing the transport.
  verified_by: [check]
  evidence: test/kogen/shaping_audit_jev_test.exs with the fake transport and Keychain logs; test/kogen/jev_test.exs unchanged.
  tests:
    - >-
      J1 "the shipped question table equals the calibration copies": assert the lowercase-hex
      :crypto.hash(:sha256, File.read!("test/support/shaping_audit/calibration/question-set-v1.json")) equals
      "6057cdd1169cc62ec746efd07851771dcc9106c94f11fb89ec8380a5419353ef", and fix-check-v1.json's equals
      "d71c560cc152bacc81a459b7913f9d1d75af5e5e085b47bc88f041cd1d569690". Assert Map.delete(shipped, "fix-check")
      == Jason.decode!(question set copy) and shipped["fix-check"] == Jason.decode!(fix-check copy). Refute that the
      test file's own source contains the needle built at run time as Enum.join([".kogen", "intents"], "/"), so the
      assertion's own text never matches it.
    - >-
      J2 "#{id} raises #{rule} at its gate and not just below it": one generated test per entry of the shipped
      table, 14 in all; the companion test "the gate table covers exactly the 14 shipped entry ids" asserts the
      test's table ids == the shipped entry ids, in order. Scripted at the gate: the report holds exactly one
      finding with that rule on the planted item, with layer "jev" and severity "advisory". Scripted 0.01 below the
      gate (or the non-gate option): no finding with that rule.
    - >-
      J3 "planted cases raise their findings and clean counterparts raise none": run once with every planted item
      scripted at its gate. Assert the set of Jev rules equals exactly then-unobservable,
      wrong-result-not-caught, paid-observation-offline-checkable, provider-behaviour-in-offline-scenario,
      non-goal-leakage, outcome-without-scenario, question-without-provenance and citation-contradicted, each once
      and each on its planted scenario or entry; the scoping clause raises no then-without-described-proof; the clean
      counterparts and the supported claim raise nothing.
    - >-
      J4 "citation lines come from the HEAD materialization, never the working tree": the logged citation request for
      the supported claim holds the committed text of `docs/note.txt`, at most 40 lines each prefixed with its line
      number, and no request contains "SENTINEL-WORKING-TREE".
    - >-
      J5 "never sends risks.yaml, references.yaml, approval.md, evidence/ or the working tree": for every logged
      request body, refute "SENTINEL-NOT-ALLOWLISTED", "SENTINEL-WORKING-TREE" and "diff --git"; and every logged
      request whose state has a "given" or "when" key asks only clause-provider-only or fix-check.
    - >-
      J6 "the fix-check keeps a partly-addressed fix open and closes only at not_addressed below 0.6": one
      generated case per distribution, each on a fresh fixture. With FAKE_AUDITOR_MESSAGE=three-findings, a first
      `--auditor` run yields the three aud- ids. The test then appends to jev-clauses' questions.md `## Dispositions`
      "<id 1>: fixed — scenario fix-target now lists test/kogen/x_test.exs in proof.offline" and "<id 2>: fixed —
      scenario unrelated-target was reworded" (a Draft edit, so the confirming run launches), and runs again with
      FAKE_JEV_ANSWERS "fix-check@<id 1>" scripted as a full distribution and "fix-check@<id 2>" at not_addressed 0.95.
      Assert: exactly two fix-check requests, whose state.scenario.id is "fix-target" for id 1 and
      "unrelated-target" for id 2; finding 3 has no fix-check request and stays open; id 2 has still_open true. For
      id 1, not_addressed 0.60 / addressed 0.40 gives still_open true; not_addressed 0.59 / addressed 0.41 gives
      still_open false; partly 0.90 / not_addressed 0.10 gives still_open true.
    - >-
      J7 "size limits raise advisory findings": jev-large's report holds jev-item-too-large and
      jev-request-too-large, both severity "advisory", and no logged request contains the big clause's first 64
      bytes.
    - >-
      J8 "at most 4 requests run at once": the fake records each call's entry and exit time. Assert the maximum
      overlap is at most 4 and at least 2.
    - >-
      J9 "#{label} makes the layer unavailable with a precise reason": one generated test each, with the reason
      substring: HTTP 500 "HTTP 500"; 401 "HTTP 401"; 422 "HTTP 422"; invalid JSON "not a JSON object"; a missing
      answer "missing"; an unknown option id "was not sent"; an echoed key (the report's bytes never contain
      "kogen-offline-sentinel-jev-key"); the deadline "deadline". Assert layers.jev.status == "unavailable", the Jev
      findings are exactly [jev-unavailable] with severity "advisory" and scope "environment", and readiness
      "not_ready".
    - >-
      J10 "429 twice then success still answers": the fake log shows 3 attempts of the same request, and
      layers.jev.status == "ok".
    - >-
      J11 "a missing Keychain item names the setup command": with FAKE_SECURITY_ITEM=missing, layers.jev.reason
      contains "security add-generic-password -s dev.kogen.jev", the transport log is empty, and every Keychain log
      line names "dev.kogen.jev" and none names "ai.typesafe.api".
    - >-
      J12 "the Build handoff request body is byte-identical": Kogen.Jev.request_body/2 for the fixed input equals a
      literal captured at b775974b and pinned in the test.
    - >-
      J14 "with only advisory Jev findings and the other layers ok, an --auditor audit is ready": clause-kind
      scripted at its gate on jev-clauses gives exactly the advisory then-unobservable finding(s),
      layers.deterministic == %{"status" => "ok"}, layers.jev.status and layers.auditor.status "ok", readiness
      "ready" and main/2 returning 0.
    - >-
      J15 "the report stores request digests and parsed answers, never response bodies": layers.jev.requests ==
      the sorted lowercase-hex SHA-256 of the logged request bodies; Map.keys(layers.jev.answers) equals that list;
      each answers value holds only question ids with choice, confidence and probabilities (or noul); and the
      report.json bytes contain none of "input_tokens", "usage" or any logged response body.
    - >-
      J13 "the README states the setup step, the allowlist and that Jev's answers are advisory": whitespace-normalised
      substrings "### Jev in the Shaping audit", "security add-generic-password -s dev.kogen.jev", "never sends a
      diff" and "advisory".
  proof:
    offline: [test/kogen/shaping_audit_jev_test.exs, test/kogen/jev_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: the audit-only fake transport logs exact requests; Jev accuracy is the recorded calibration, and the real API is observed in slice 3's live-shaping-quality"
    affected_paths:
      - lib/kogen/jev.ex
      - lib/kogen/shaping_audit/jev_layer.ex
      - lib/kogen/shaping_audit.ex
      - lib/kogen/shaping_audit/report.ex
      - priv/kogen/shaping_audit/questions-v1.json
      - README.md
      - test/kogen/shaping_audit_jev_test.exs
      - test/support/shaping_audit/fake_jev_audit
      - test/support/shaping_audit/fake_jev_audit.ex
      - test/support/shaping_audit/fake_security_audit
      - test/support/shaping_audit/calibration
      - test/support/shaping_audit/packages/jev-clauses
      - test/support/shaping_audit/packages/jev-large

- id: question-gate-routes-questions
  given: >-
    A fixture package `questions` (test/support/shaping_audit/packages/questions) in the asking state. Its
    `## Ask the Shaper` holds:
    1. a product question;
    2. a technical question;
    3. a question already answered by DIRECTION 1.13 ("Does plain Kogen always require explicit human approval of
       each Intent?");
    4. a related-topic product question that a naive citation would answer wrongly;
    5. a question to split off requested scope.

    Its `## Settled` holds one entry, "1. Reports are JSON files.". A copy of the package in the autonomous state (no `## Ask the Shaper` entry; it keeps a valid scenarios.yaml and a clean deterministic layer, so the auditor is not skipped) is audited with `--auditor` and
    the fake auditor replaying three-findings. The fake transport returns scripted answers at and around each
    threshold.
  when: >-
    The audit routes each entry and each auditor finding through the gate.
  then: >-
    - Shipped files: `priv/kogen/shaping_audit/question-gate-v1.json` is a byte copy of the calibration file (SHA-256
      `18de817ba4ee6de027b28f289635d90bc313680ef8880e87afcf1d0039198446`), and its `product_ux` rule names
      "splitting or deferring any requested scope".
    - Settled list: `priv/kogen/shaping_audit/settled.json`'s `entries` ids are exactly `dir-1.7`, `dir-1.11-live`,
      `dir-1.12`, `dir-1.13`, `dir-1.15`, `dir-1.16`, `dir-1.17`, `shp-auditor-profile` and `shp-wait-only-product`,
      in that order. Each `text` is byte-equal to the calibration `SETTLED` text. No `source` names `.kogen/intents/`.
      The package's `## Settled` entries are appended at run time after the nine, as `package-<n>`, and
      `settled.json` is never written.
    - Routing:
      - cite at `already_settled 0.80`, `settled_by dir-1.13 0.80` and `confirm 0.60`;
      - with `confirm 0.59`, never cite;
      - controller at `technical 0.50`;
      - the Shaper at `technical 0.49`;
      - the related-topic control (`already_settled 0.85`, `confirm 0.45`) routes to the Shaper;
      - the split question is never cited or handed to the controller.
    - Asking-state findings:
      - a controller-routed entry raises blocking `technical-question-to-shaper <n>`, whose message is "question <n>
        is technical: decide it and record it under ## Settled";
      - a cited entry raises blocking `question-already-settled <n>`, whose message is "question <n> is already
        settled by `dir-1.13` — move it under ## Settled with the citation";
      - both findings are disputable.
    - Autonomous state: an auditor finding routed to the Shaper keeps route `shaper`, and its message ends "(routed
      to the Shaper: in the autonomous state this becomes a listed assumption, never a question.)". A technical
      finding gets route `controller`.
    - Stored route: each `layers.jev.routes` entry keeps its item, route, distributions, the model `jev-1.13.0`
      and the wording version `question-gate-v1`.
    - Request shape: a gate request holds exactly the questions `gate` and `settled_by` (as calibrated), a confirm
      request holds exactly `confirm`, and neither holds a Kogen.Jev status or objection question. The gate
      question's instructions name technical, product_ux and already_settled as the only valid answers. One
      out-of-vocabulary answer is re-asked once. A second makes the layer `unavailable`.
    - No `finding-routing` file ships under `priv/kogen/shaping_audit/`.
  wrong_result: >-
    Any of these:
    - splits count as technical;
    - a citation is accepted on topic similarity;
    - a cited entry disappears without a record;
    - a routed-to-Shaper finding becomes a question after the answers;
    - the gate question shares a request with Kogen.Jev's objection questions;
    - an invalid answer silently passes;
    - `shp-one-build` or a `.kogen/intents/` source ships;
    - a smoke test that checks one route or only an exit status;
    - fixture-specific shortcuts, such as routing by keywords in the question text instead of by Jev's answers.
  verified_by: [check]
  evidence: test/kogen/shaping_audit_question_gate_test.exs with the fake transport's request log.
  tests:
    - >-
      G1 "the shipped question-gate-v1 table is a byte copy of the calibration file": assert the lowercase-hex
      SHA-256 of priv/kogen/shaping_audit/question-gate-v1.json and of the calibration copy both equal
      "18de817ba4ee6de027b28f289635d90bc313680ef8880e87afcf1d0039198446", and the decoded product_ux rule contains
      "splitting or deferring any requested scope".
    - >-
      G2 "settled.json holds exactly the nine calibrated decisions": assert the ids list above, each text equals a
      literal copied from calibrate_gate_v3.py SETTLED, and no source contains ".kogen/intents".
    - >-
      G3 "cite at the threshold, never just below confirm": entry 3 scripted at the thresholds gives exactly one
      finding "question-already-settled 3" with the message above; with confirm 0.59 the report has no
      question-already-settled finding and the layers.jev.routes entry for item "question 3" has route "shaper".
    - >-
      G4 "controller at 0.50 technical, the Shaper just below": entry 2 at technical 0.50 gives exactly one finding
      "technical-question-to-shaper 2" with the message above and disputable true; at 0.49 no finding, and its
      layers.jev.routes entry has route "shaper".
    - >-
      G5 "the related-topic control and the split question route to the Shaper": no finding for entries 4 and 5,
      and their layers.jev.routes entries have route "shaper".
    - >-
      G6 "auditor findings in the autonomous state never become questions": of the three auditor findings, the one
      scripted product_ux has route "shaper" and its message ends with the exact suffix above; the one scripted
      technical 0.90 has route "controller"; state is "autonomous" and no finding id starts with
      "technical-question-to-shaper" or "question-already-settled".
    - >-
      G7 "the gate goes in its own request naming its three answers; one invalid answer is re-asked": from the fake
      log, the question ids of every request holding "gate" are exactly ["gate", "settled_by"], of every request
      holding "confirm" exactly ["confirm"], and no such request holds a Kogen.Jev status or objection question id;
      the gate instructions contain "technical", "product_ux" and "already_settled". "gate@<entry 1 text>" scripted
      as {"sequence": [["no_objection", 1.0], ["product_ux", 1.0]]} gives 2 gate requests for entry 1 and
      layers.jev.status "ok"; "no_objection" twice gives layers.jev.status "unavailable".
    - >-
      G9 "stored routes keep distributions, model and wording version; the package's Settled entries are appended at
      run time": every layers.jev.routes entry has exactly the keys item, route, settled_by, distributions, model and
      wording_version, with model "jev-1.13.0" and wording_version "question-gate-v1", and distributions.gate holds
      probabilities for exactly technical, product_ux and already_settled; every logged gate request's
      state.settled ids are the nine shipped ids followed by "package-1", whose text is "Reports are JSON files.";
      and the SHA-256 of priv/kogen/shaping_audit/settled.json is the same before and
      after the run.
    - >-
      G8 "no finding-routing file ships": File.ls!("priv/kogen/shaping_audit") contains no name matching
      "finding-routing".
  proof:
    offline: [test/kogen/shaping_audit_question_gate_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: scripted Jev answers exercise every branch; accuracy is the recorded calibration"
    affected_paths:
      - lib/kogen/shaping_audit/jev_layer.ex
      - lib/kogen/shaping_audit/questions.ex
      - lib/kogen/shaping_audit/finding.ex
      - priv/kogen/shaping_audit/question-gate-v1.json
      - priv/kogen/shaping_audit/settled.json
      - test/kogen/shaping_audit_question_gate_test.exs
      - test/support/shaping_audit/calibration
      - test/support/shaping_audit/packages/questions

- id: questions-md-states
  given: >-
    A fixture checkout and fixture packages under `test/support/shaping_audit/packages/flow/`, each with an
    `intent.yaml` holding its slug. The deterministic layer is real, and only Jev (the gate) is faked.
    - `asking-no-answers`: only `intent.yaml`, `questions.md` and `evidence/probe-color/RESULT.md`, with one
      product `## Ask the Shaper` entry carrying `Question:`, `Recommendation:` and
      `Evidence: evidence/probe-color/RESULT.md`, and no `scenarios.yaml`.
    - `asking-technical`: the same, plus entry 2, technical.
    - `asking-no-evidence`: one entry with no `Evidence:` line.
    - `asking-second-round`: `## Shaper answers` recorded, and a new `## Ask the Shaper` entry 1.
    - `left-undecided`: a complete Draft with one `## Left undecided` entry with a recommendation.
    - `assumed-without-reason`: a complete Draft whose `## Assumed` entry 1 has `Reason:` but no `Undo:`.
    - `not-ready`: a complete Draft with an unguarded affected path.
    - `ready`: a complete Draft with two `## Assumed` entries (with Reason and Undo), one `## Left undecided`
      entry and a `## History` section.
  when: >-
    `Kogen.ShapingAudit.main(["--auditor", slug], root: root, env: Fixture.audit_env!(root))` audits each package,
    with the fake auditor replaying empty.
  then: >-
    - asking-no-answers: `state: asking`, `readiness: asking`, exit 1, and findings `[]`. There is no
      `package-invalid` for the missing `scenarios.yaml`, `layers.deterministic` is `skipped`, the fake Jev log holds
      only gate requests, and the auditor layer is `skipped` with no launch.
    - asking-technical: readiness `asking` and exactly one finding, blocking `technical-question-to-shaper 2`.
    - asking-no-evidence: readiness `asking` and exactly one finding, blocking, not disputable
      `recommendation-without-evidence 1`.
    - asking-second-round: findings `[]` and readiness `asking`, the same as a first round (no
      `question-after-answers` rule).
    - left-undecided: exit 0 and readiness `ready`. The entry never blocks and stays under `## Left undecided`.
      `questions.sections["Left undecided"]` holds it with its recommendation, and the package's bytes are unchanged.
    - assumed-without-reason: exit 1, readiness `not_ready`, and blocking `assumption-without-reason 1`, not
      disputable.
    - not-ready: exit 1 and readiness `not_ready`, with `unguarded-affected-path` among the findings.
    - ready: exit 0 and readiness `ready`. `questions.sections["Assumed"]` holds both entries, and
      `["Left undecided"]` holds one, with its recommendation. `## History` is ignored.
  wrong_result: >-
    Any of these:
    - a first question stop is blocked for a missing scenarios.yaml;
    - Jev contract questions or the auditor run while asking;
    - a second round of questions is blocked;
    - an item left undecided gets decided or moved;
    - an assumption without Undo passes;
    - the Candidate's FakeDeterministic or a `:layers` option replaces the real layer;
    - a smoke test that checks only exit codes;
    - fixture-specific shortcuts, such as keying behaviour on the fixture directory names.
