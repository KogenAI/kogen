    paid_target: live-shape-to-build
    paid_reason: "provider-required: live-shape-to-build; observation: authenticated managed 2.1.281 completes Shape and Build with the Stop hook continuing the same -p turn; offline-limit: fixtures and the fake harness cannot execute the native binary or its hook semantics"
    affected_paths: [priv/kogen/claude_code/install.py, lib/kogen/claude_code.ex, README.md, test/kogen/claude_code_install_test.exs, test/support/claude_code_installer_test.py, test/kogen/claude_code_management_test.exs, test/kogen/build_preconditions_test.exs, test/kogen/shape_task_test.exs, priv/kogen/test-reliability.yaml, priv/kogen/test-reliability-remediation.yaml]

- id: roles-and-helpers-on-2-1-281
  given: The claude route configures Opus 5.5 root roles and Sonnet 5 / Opus 5.5 helpers with per-role efforts, and the managed runtime is 2.1.281.
  when: Kogen launches roles with --agents, --disallowedTools Agent(<name>), --setting-sources and --dangerously-skip-permissions.
  then: Each role and helper runs with its exact configured model and effort (per-agent effort visible in helper transcripts), built-in agents stay denied, stream-json message.model and parent_tool_use_id linkage still identify executed helpers, and route/model configuration is unchanged.
