- id: crates-missing-on-build-host
  scenario_ids: [check-builds-and-tests-the-crate]
  description: >-
    The Build fetches nothing. If the launch precondition (`cargo fetch --locked` of evidence/cargo) was not run on the
    Build host, `check`'s cargo-build stage fails in the first cycle with cargo's "attempting to make an HTTP request,
    but --offline was specified". It fails the same way for every later Build on a machine that never ran
    `mix kogen.ctx.build`. README and scripts/check/README.md name the fix. The same holds if the Developer changes the
    dependency set: the pinned Cargo.lock is the contract, and test D4 pins its hash. Nothing in `check` or the tests
    can download on a cold cache. The only in-check fetch is `mix kogen.ctx.build --offline`
    (`cargo fetch --locked --offline`), which fails instead. A warm read-only fetch was probed clean (P8); a cold cache
    was not probed, because that needs a separate CARGO_HOME. The lock is byte-identical to kogen-ctx-tool's, so
    machines that fetched for it are already warm.
- id: developer-cargo-in-sandbox
  scenario_ids: [check-builds-and-tests-the-crate, index-is-derived-and-outside-the-repo]
  description: >-
    Inside the write boundary, `~/.cargo` and `~/.rustup` are read-only (P2). Offline builds work from the warm cache,
    but `cargo fetch`, `cargo install` or `cargo update` into `~/.cargo` fail with EPERM. The Developer must run cargo
    with `--locked --offline` and never export CARGO_HOME before `mise exec` (P1: that re-points mise's global rust
    install). A plain `cargo build` inside the crate lands in `_build/cargo` through `.cargo/config.toml`. But cargo run
    from the repo root with `--manifest-path` ignores that file (P6) and writes ~123 MB to `native/kogen-ctx/target/`,
    which the declared `native/kogen-ctx/**` guard does not flag. So every root-level cargo command passes
    `--target-dir _build/cargo`. The `.gitignore` line `/native/kogen-ctx/target/` keeps a slip out of the commit, and
    test D1 fails `check` while the directory exists.
- id: check-gets-slower
  scenario_ids: [check-builds-and-tests-the-crate]
  description: >-
    A fresh Candidate has no `_build/`, so each Build's first `check` compiles the crate cold (~20 s wall, ~50 s CPU,
    P3) in the preparation phase, beside `mix compile --force`. Warm cycles in the same Candidate are no-ops. This is
    accepted: seeding `_build/cargo` into Candidates would change `Workspace.create/2` (a non-goal). On the ExUnit
    side, the binary is built once per test run (cached, a no-op after the cargo-build stage). About 50 binary runs
    that reach git, each through `/bin/sh` with `PATH=/usr/bin:/bin`, pay Apple's `/usr/bin/git` launcher 2-3 times
    each (~8 ms per call, P9): roughly 1-1.5 s spread over three async modules. The ~15 usage-error runs of A5 exit
    before any git call.
- id: lands-after-memory-and-telemetry
  scenario_ids: [search-finds-intents-and-memory]
  description: >-
    project-memory and session-telemetry-and-event-log (Drafts at fa48e817) land first, and both edit README.md.
    Re-preflight and re-anchor the README section after each. Memory records are indexed as text under
    `.kogen/memory/**`, so a change in project-memory's record format needs no change here.
- id: concurrent-index-writers
  scenario_ids: [index-refreshes-only-changed-files]
  description: >-
    Two CLI calls (and, from slice 3, a running MCP server) may refresh the same index at once. Writes are one
    `BEGIN IMMEDIATE` transaction with a 10-second busy timeout. A rebuild of a corrupt file by one process while
    another holds it open is not proven here (residual).
- id: candidate-carries-out-of-scope-code
  scenario_ids: [index-is-derived-and-outside-the-repo, search-finds-intents-and-memory]
  description: >-
    The saved Candidate also contains unproven `symbols`, `refs`, `map` and `mcp` code (with a fixture-name alias
    table), a dead `src/tmp.rs`, two test files outside `may_change_guarded_paths` (`test/kogen/ctx_mcp_test.exs`,
    `test/kogen/ctx_tool_test.exs`; stray paths for `GuardedPaths`, and both would fail), and two misplaced doc hunks
    that advertise the out-of-scope subcommands. If the Developer applies the diff and keeps them, this slice ships
    untested behaviour that slice 2 must then find and replace, or the guard reworks the Build. INTENT.md "Start from
    the Candidate" says to delete, remove or rewrite each. The Reviewer checks that `main.rs` dispatches only `index`
    and `search`, that `src/` has no `tmp.rs`, that neither test file exists, and that neither README names
    `symbols`, `refs`, `map`, `mcp` or `claude mcp add`.
- id: derived-index-lifecycle
  scenario_ids: [index-is-derived-and-outside-the-repo, index-refreshes-only-changed-files]
  description: >-
    The index is generated, machine-local data outside the checkout. It is never a source of truth: any unreadable,
    old-schema or foreign-root file is deleted and rebuilt, and deleting it by hand is always safe. Inside a Build
    role's write boundary the default home under `$HOME` is read-only, so the tool fails loudly there
    (`cannot write index … set KOGEN_CTX_HOME`, for every write step, test A6). With neither HOME nor KOGEN_CTX_HOME
    set it fails too, instead of falling back to a relative path inside the checkout. No role calls it in this Intent; row 15 must hand roles a writable
    KOGEN_CTX_HOME (for example the Build temp dir) when it wires the tool in.
  ownership:
    - paths: "KOGEN_CTX_HOME (default ~/Library/Caches/Kogen/ctx)/<project id>/index.sqlite and its SQLite journal"
      when_exists: reused when it opens as SQLite with the current schema_version and the same root; otherwise deleted and rebuilt
      owner_after_creation: kogen-ctx (any invocation on that checkout)
      owner_during_operation: kogen-ctx processes, serialized by one BEGIN IMMEDIATE transaction per refresh
      permitted_mutation: kogen-ctx refresh and rebuild only; users may delete it at any time
      validation: meta.schema_version and meta.root checked on every open; files.blob compared with git hash-object on every refresh
      git_state: outside every checkout; never staged or committed
      upgrade_behavior: a later schema bumps schema_version (slice 2 sets 2) and the old file is rebuilt, never migrated
- id: cargo-build-output-and-cache
  scenario_ids: [check-builds-and-tests-the-crate]
  description: >-
    Cargo writes build output under the checkout's `_build/cargo` and reads crates from the machine's shared cargo
    cache. Neither is committed; both are rebuildable.
  ownership:
    - paths: _build/cargo (release binary _build/cargo/release/kogen-ctx and all intermediate artifacts)
      when_exists: reused incrementally by cargo; a missing or stale tree is rebuilt by the next check or mix kogen.ctx.build
      owner_after_creation: cargo, invoked by offline.py's cargo stages and Kogen.Ctx.build/1
      owner_during_operation: cargo's own build-directory lock
      permitted_mutation: cargo only; removing it (mix clean does not) forces a cold rebuild
      validation: cargo fingerprints; check's cargo-build and cargo-test stages
      git_state: ignored by /_build/, volatile for GuardedPaths, excluded from offline.py's source manifest, not copied into Candidates
      upgrade_behavior: a toolchain or Cargo.lock change triggers cargo's normal rebuild
    - paths: "~/.cargo/registry (crates.io index, .crate files and extracted sources for the locked set)"
      when_exists: reused; cargo fetch --locked adds only missing crates and needs no network when all are present
      owner_after_creation: the machine user, through cargo fetch (launch precondition, mix kogen.ctx.build)
      owner_during_operation: read-only for Build roles (write boundary) and read by the controller's offline check
      permitted_mutation: cargo fetch outside Builds only
      validation: cargo --locked checksums from Cargo.lock
      git_state: outside every checkout
      upgrade_behavior: a Cargo.lock change requires one cargo fetch per machine before the next check
- id: mise-rust-pin-and-test-path
  scenario_ids: [check-builds-and-tests-the-crate]
  description: >-
    `test/test_helper.exs` builds the suite's PATH from `mise which python3` with stderr folded into stdout, so any
    mise warning caused by the new `rust = "1.97.1"` line would corrupt PATH for every test. P7 probed it at fa48e817
    unsandboxed, under the write-boundary profile, with a cold unwritable mise cache, and with a pinned rust version
    missing from the host: the output was the single Python path every time. Residual: a future mise release that
    warns on stderr about a missing or untrusted tool would break the whole suite loudly at startup (the helper raises
    or the PATH is wrong), not silently. The undo is removing the line (Assumed 3).
- id: fixture-read-from-intent-package
  scenario_ids: [index-is-derived-and-outside-the-repo, search-finds-intents-and-memory]
  description: >-
    Reading fixture bytes from `.kogen/intents/approved/kogen-ctx-index-and-search/evidence/fixture/` would pass in
    this Candidate and break every later `check`: the package moves to `complete/`, and the cold-offline copy excludes
    `.kogen/intents`. So the bytes live in `test/support/ctx_fixture.ex` with pinned SHA-256s, and no test reads the
    checkout's `.kogen/`.
