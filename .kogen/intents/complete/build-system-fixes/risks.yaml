- id: bootstrap-parent
  scenario_ids:
  - selected-route-catalog
  - bounded-luna-development-delegation
  - shape-to-build
  description: A hand-driven or self-reported run cannot stand in for the Build. Only
    `mix kogen.build` on the frozen Candidate establishes controller-owned final acceptance.
- id: publication-and-recovery
  scenario_ids:
  - failed-build-returns-to-draft
  - exact-tests-and-readiness
  - shape-to-build
  description: Recovery refs or receipts can drift and Complete evidence can
    grow large. Bind refs, records and summaries to exact bytes, fail closed on
    missing/changed required evidence, keep bulk history outside publication
    and report sizes without arbitrary byte-cap rejection.
- id: false-completion
  scenario_ids:
  - convergent-rework
  - bounded-luna-development-delegation
  description: Progress-only turns, partial helper returns or a provisional
    Review may resemble completion. Require assigned deliverables, all settled
    target receipts and the final evidence-addendum join on one tree.
- id: wrong-route-provider-proof
  scenario_ids:
  - selected-route-catalog
  - claude-reviewer-rework
  - shape-to-build
  description: Config-only or old-route evidence cannot establish execution.
    Freeze and retain actual harness/model/effort/session receipts and wrong-
    route controls for the current route.
- id: performance-coverage
  scenario_ids:
  - offline-gate-time
  - offline-runner-stability
  description: Consolidation can accidentally omit a test, prepare, fixture,
    required behavior, rehearsal or focused cold setup regression. Disclose
    test evolution to Review; the complete current suite must pass. Timings remain diagnostic and reuse
    requires exact-tree/context integrity.
- id: false-provider-classification
  scenario_ids:
  - process-and-capacity
  - convergent-rework
  description: Exit status alone may misstate dispatch or cause. Persist the
    controller dispatch ledger and typed marker evidence; distinguish offline,
    evidence, paid, provider and environment failures, and preserve unknowns.
- id: runtime-compatibility
  scenario_ids:
  - native-codex-upgrade
  - claude-reviewer-rework
  description: Personal CLI upgrades do not change managed pins. Verify pinned
    artifact integrity, actual managed launch/resume, bundled-skill inventory
    provenance and separate exclusion of account/remote plugins.
- id: repair-overreach
  scenario_ids:
  - repair-authority-and-review-disclosure
  description: Ordinary related changes outside predicted paths need review,
    while frozen packages, credentials, verification authority and protected
    controls remain enforced. Changed owners must retain all required targets.
- id: integration
  scenario_ids:
  - shape-to-build
  - process-and-capacity
  - convergent-rework
  description: Parallel jobs, provisional Review, restart and Build phases
    can race or cross identities. Freeze each phase to one Candidate tree,
    isolate outputs and settle all owned children before repair or publication.
