    - test/kogen/parallel_settlement_test.exs
- id: bounded-luna-development-delegation
  given: The selected route's Developer has independent implementation slices and helpers native to its harness
  when: The Developer delegates, integrates outputs and submits a Candidate revision
  then: >-
    Each selected-route-native helper receives non-overlapping ownership, a concrete deliverable, focused completion
    checks, a finite work budget and blocker reporting. The parent waits for all assigned work, integrates and checks combined
    behavior, and owns the single aggregate handoff; partial progress, unstarted commands and syntax-only checks
    do not count as completion. Prove two explicit native dispatches in the fixed live fixture. No recursive fan-out,
    duplicate full gate, unrelated helper or secondary Review fan-out. `optimum`'s Codex worker is Luna Max; existing
    named routes retain their settings.
  wrong_result: >-
    Configuration alone proves delegation, helpers collide or omit checks, failed work is ignored, or extra fan-out
    consumes unbounded provider resources.
  verified_by:
  - check
  - live-reviewer-rework
  evidence: >-
    Deterministic ownership/completion/failure controls plus actual native helper dispatch receipts matching the
    selected route in the team fixture. The `optimum` profile's Sonnet 5.5 and Luna Max claims remain model-specific;
    a Codex-only execution proves only its native Luna helpers. Full check also retains coverage in:
    test/kogen/developer_delegation_test.exs, test/kogen/native_helper_fixture_test.exs. Focused proof selectors are
    witnesses, not a reduced full-suite obligation.
