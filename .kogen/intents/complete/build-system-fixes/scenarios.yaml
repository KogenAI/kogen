- id: targeted-development-readiness
  given: The Developer has one coherent Candidate tree and controller receipts from a prior phase or exact restart
  when: Readiness is rendered, the Candidate changes, or Build continues after interruption
  then: >-
    Give the Developer relevant failed/changed selectors and actionable evidence without replaying the whole selector
    list after every small edit. The complete offline gate and every selected target still pass on the final tree
    before the evidence Review join. Reuse only passed receipts for identical Candidate ID, catalog, frozen context
    and verified input digests; a changed tree invalidates verification and Review decisions. Targeted checks are
    development feedback, never acceptance; every actual retry/dispatch consumes its frozen budget.
  wrong_result: >-
    A one-line fix reruns every selector as routine feedback, targeted evidence is accepted as the full gate, changed-tree
    receipts authorize Review, or restart resets budgets.
  verified_by:
  - check
  evidence: >-
    Retained controller-path positive and disconfirming controls; exact Candidate revision and native model/session
    receipts where selected. Full check also retains coverage in: test/kogen/targeted_readiness_test.exs, test/kogen/controller_verification_test.exs.
    Focused proof selectors are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/targeted_readiness_test.exs
    - test/kogen/parallel_settlement_test.exs
