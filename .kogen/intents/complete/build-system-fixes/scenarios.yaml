- id: shape-to-build
  given: A real Shape session has produced a Draft that is current and human-approved
  when: '`mix kogen.build` runs the approved Intent automatically from admission through publication'
  then: >-
    The connected consumer uses Astra Low Shaping, Opus High audit, Opus Medium Development and Sol High Review
    on `optimum`, retaining actual role/session evidence. Build applies the established clean-control admission,
    frozen route/package, Candidate ownership, lock, custody supervisor, write boundary, phase receipts and final
    publication guards in order, with no operator phase API and no raw role launches. Developer code cannot commit or
    push. When a check fails, the repair handoff carries that check's own failing output. Only settled final receipts,
    independent verdict and evidence addendum on the same final tree can enter guarded publication.
    The live shape-to-build test runs a real Shape session, approval, then `mix kogen.build` to publication.
    Live targets always run on the Build's selected route.
  wrong_result: >-
    A stale audit or config-only team passes, Build skips admission/custody or write receipts, the repair handoff
    omits the failing check's output, or the Developer publishes directly.
  verified_by:
  - check
  - live-shape-to-build
  evidence: >-
    Actual-path provider-denied lifecycle controls and one connected selected-route native receipt; no older role
    sequence counts as current evidence. Full check also retains coverage in: test/kogen/lifecycle_test.exs, test/kogen/build_workspace_test.exs,
    test/kogen/selective_verification_targets_test.exs, test/kogen/managed_runtime_ready_test.exs. Focused proof
    selectors are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/lifecycle_test.exs
    - test/kogen/manual_controller_test.exs
    paid_target: live-shape-to-build
    paid_reason: >-
      provider-required: live-shape-to-build; observation: real combined selected-route producer-to-consumer sequence;
      offline-limit: fake orchestration cannot prove provider roles
    affected_paths:
    - ".kogen/config.yaml"
    - lib/kogen/build.ex
    - test/kogen/live_shape_to_build_test.exs
    - test/kogen/selective_verification_targets_test.exs
