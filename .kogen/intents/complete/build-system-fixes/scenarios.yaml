- id: native-codex-upgrade
  given: >-
    Kogen stages managed Codex 0.159.2 and Claude Code 2.1.285 with artifact integrity verification and runs the selected native compatibility
    target
  when: The native harness captures root, helper, resume and interactive context observations
  then: >-
    Prove actual managed-runtime execution and bound session/model/effort evidence, not a config-only pin. The deterministic
    isolation oracle requires planted forbidden sentinels absent, the project sentinel present, and bundled `.system`
    names to match an allowlisted inventory whose digest and provenance bind to the pinned runtime. Separately demonstrate
    that account/remote plugins are excluded, including a real plugin-enabled-account observation run in a
    disposable `CODEX_HOME`. Retain actual
    helper outputs and negative controls; an unclassified name fails as unsupported/unproven until provenance is
    established; it is neither silently allowlisted nor called leakage without evidence.
    The managed runtime pins are Codex 0.159.2 and Claude Code 2.1.285, and tests read the pins from one source. The
    skill-isolation oracle binds bundled and project-sentinel classification to the observed origin (the pinned
    `.system` tree or the project skill root); duplicate names keep every origin and a foreign same-name entry
    fails. A fresh operation's Codex state db is seeded so the 0.159.x TUI backfill cannot time out.
  wrong_result: >-
    A textual version bump passes without native execution, bundled skills are mistaken for remote plugins, or remote
    account content is silently accepted without a disconfirming control.
  verified_by:
  - check
  - live-native
  evidence: >-
    Installer integrity controls, compatibility probe, then one native provider receipt; common provider-denied
    runtime prepare installs/checks both Candidate pins before launch and rejects missing/wrong pins without a provider
    call; for this self-hosted Build the orchestrator stages exact runtime artifacts before admission, because existing-target
    prepare metadata stays frozen; Candidate prepare improvements govern later Builds Full check also retains coverage
    in: test/kogen/codex_management_test.exs, test/kogen/codex_compatibility_preparation_test.exs, test/kogen/managed_runtime_ready_test.exs.
    Focused proof selectors are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/codex_management_test.exs
    paid_target: live-native
    paid_reason: >-
      provider-required: live-native; observation: real Codex 0.159.2 native session; offline-limit: installer and
      fake transport cannot prove provider interaction
    affected_paths:
