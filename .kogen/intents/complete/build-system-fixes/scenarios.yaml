    a real finding, the same route-selected Developer resolves it within budget, and the T-bound verdict is invalidated
    on any changed tree. Review resumes on the delta with open findings or restarts against the full base diff if the
    Reviewer session is unavailable. Final evidence-addendum confirmation is a distinct post-settlement turn. A
    Codex-only execution proves no Claude/Opus/Sonnet behavior; route-specific claims require their own receipts.
  wrong_result: >-
    A fixture substitutes a hidden route default, config is mistaken for execution, a provisional verdict survives
    changed code, or the evidence addendum is skipped.
