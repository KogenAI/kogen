- id: offline-runner-stability
  given: The complete provider-denied check runs in a clean Candidate copy under mise with inherited KOGEN variables
  when: >-
    Offline targets, selected-target prepares, fixture generation and focused cold setup/dependency regression settle
  then: >-
    Scrub only the existing controller-owned variables at their defined boundaries; preserve KOGEN_ROUTE, KOGEN_PROVIDERS_DENIED
    and KOGEN_LIVE_LOG_DIR where live-tagged fixtures need them. Use condition-based terminal and boundary assertions.
    Generated fixtures must be the exact inputs later consumed by targets, all selected prepares finish with provider
    dispatch denied, and the focused cold setup/dependency regression remains inside `make check`. Keep standalone
    `cold-offline` for explicit diagnosis only.
    The isolated test pool is capacity-based (1.5 x schedulers, `KOGEN_ISOLATED_POOL` override), and a shared-VM
    guard fails any test that mutates the process cwd or environment without restoring it.
  wrong_result: >-
    The gate passes while an inherited role variable leaks, preparation dispatches a provider, generated YAML differs
    from consumed inputs, or a full cold suite becomes routine acceptance.
  verified_by:
  - check
  evidence: >-
    Focused cold setup/dependency regression and deterministic process synchronization tests are part of check.
    The standalone cold-offline command remains available for explicit diagnosis, not routine acceptance. Check
    also retains coverage in test/kogen/cold_offline_test.exs, test/kogen/terminal_probe_test.exs, test/kogen/write_boundary_test.exs,
    and test/kogen/route_env_preservation_test.exs. Focused proof selectors are witnesses, not a reduced full-suite
    obligation.
  proof:
    offline:
    - test/kogen/cold_offline_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: cold copy and process controls'
    affected_paths:
    - test/test_helper.exs
    - test/kogen/cold_offline_test.exs
    - test/kogen/terminal_probe_test.exs
    - test/kogen/write_boundary_test.exs
    - test/kogen/route_env_preservation_test.exs
- id: offline-gate-time
  given: The admission-base commit supplies a diagnostic test inventory and Candidate tree T is frozen
  when: Build runs T's offline gate
  then: >-
    One complete `make check` execution per relevant exact tree/context runs formatting, compile, analysis, every
    current non-live test, Candidate-added tests, catalog-derived rehearsals, all selected-target prepares,
    fixture validation and focused cold setup/dependency regression. The controller binds the whole-gate and per-stage
    receipts to T, base, catalog and frozen context, reports baseline-to-Candidate test changes for Review and records timings/cache state/bottlenecks.
    Remove the unused standalone kogen-ctx implementation, dedicated tests, Cargo gate stages and exclusive Rust setup; the remaining complete gate must not depend on it. Preserve ordinary source discovery and historical acceptance evidence.
    Timings are diagnostic only; do not add 100/300-second acceptance cutoffs, duplicate warm suites or routine
    standalone `cold-offline`. Reuse only digest-validated exact-tree receipts.
    Independent stages run concurrently. Rehearsal receipts are bound to their own test identities, or the rehearsal
    command is executed. Active elapsed time is measured per stage and reported; no stage fails solely for elapsed
    time. The hang guard fails only on no output for a period and classifies it as a stall; elapsed time alone never fails.
  wrong_result: >-
    A correct gate fails solely for elapsed time or a legitimate test rename, coverage is silently removed to shorten it, a second full
    suite runs routinely, or stale evidence covers changed code.
  verified_by:
  - check
  evidence: >-
    Provider-denied controller controls assert one complete warm offline execution, acceptance of a correct run
    above 300 seconds, acceptance and disclosure of legitimate test evolution, rejection of failed current tests or missing required rehearsal/prepare outcomes, and rejection of stale/tampered
    receipts. Focused cold setup/dependency regression is included in check; full cold-offline execution is explicit
    diagnostic only. Keep focused tests in the existing warm_check_test and verification owners; legacy scenario
    ID retained.
  proof:
    offline:
    - test/kogen/warm_check_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: make check stage timing and test-change disclosure controls'
