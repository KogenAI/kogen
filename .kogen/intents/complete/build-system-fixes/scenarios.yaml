- id: process-and-capacity
  given: >-
    Multiple selected live jobs and a provisional Reviewer are active under the admitted controller with an explicit
    finite concurrency ceiling
  when: A job fails, an accepted stop or shutdown arrives, the controller restarts, or owned descendants outlive their role
  then: >-
    Give each target/cycle separate fixture, log and evidence roots. Record actual dispatches and owned process
    identities, settle every started job, cancel only on explicit stop/shutdown or classified provider/environment
    failure, and reap the owned groups without signaling ancestors or unrelated groups. On restart, verify custody
    and re-use only passed receipts bound to identical tree/context/catalog; rerun unsettled jobs and retain cancelled
    receipts as neither result. Concurrency is a resource cap, never a paid-spend counter. Unknown exit or transport
    evidence stays honestly classified.
    Live fan-out uses a finite configured concurrency ceiling (default 4), so the provisional Review and all
    selected live targets run at once, longest first. Capacity for the initial fan-out is reserved before any start
    and each start is logged at launch. The provisional Reviewer dispatch is ledgered for every outcome, and jobs
    still active at an accepted stop are recorded as cancelled.
  wrong_result: >-
    A child survives cleanup, unrelated process is signaled, target outputs collide, cancelled work counts as a
    pass/failure, or an unknown exit is guessed to be provider failure.
  verified_by:
  - check
  evidence: >-
    Disposable process-tree and provider-marker controls; missing/tampered sidecar controls through tracking, evidence
    resolution, and retained live fixture copy Full check also retains coverage in: test/kogen/process_custody_test.exs,
    test/kogen/controller_verification_test.exs, test/kogen/scenario_tracking_test.exs, test/kogen/build_evidence_test.exs,
    test/kogen/review_packet_audit_test.exs. Focused proof selectors are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/process_custody_test.exs
    - test/kogen/parallel_settlement_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: process tree and explicit marker controls'
    affected_paths:
    - lib/kogen/process_custody.ex
    - lib/kogen/build.ex
    - lib/kogen/build/failure_signature.ex
    - test/kogen/process_custody_test.exs
    - test/kogen/controller_verification_test.exs
    - lib/kogen/build/tracking.ex
    - lib/kogen/build/evidence.ex
    - test/support/live_reviewer_rework_fixture.ex
    - test/kogen/scenario_tracking_test.exs
    - test/kogen/build_evidence_test.exs
    - test/kogen/review_packet_audit_test.exs
    - test/kogen/parallel_settlement_test.exs
- id: exact-tests-and-readiness
  given: A scenario declares exact selectors and a Candidate changes a module, package artifact or verification
    owner
  when: The controller settles the offline phase and prepares the final evidence review
  then: >-
    Resolve required proof.offline selectors to runnable evidence. Treat optional predicted test names and path-owner
    mappings as advisory disclosures for independent Review; allow legitimate test evolution and related repairs.
    Normalize verified_by ordering and duplicates and run every explicitly selected target. Report missing required proof before live dispatch. Preserve frozen Approved bytes and complete package custody; check
    publication sizes diagnostically and recheck exact staged contents at commit; no arbitrary byte cap rejects valid code.
    Review may cite only digest-bound references from the settled receipt/evidence set. No broad smoke test substitutes
    for an exact selector, and finalization fails closed on mutated or missing required evidence.
    The acceptance join enforces exactly one receipt per selected live target.
  wrong_result: >-
    A nonexistent test passes, Review begins before offline readiness, publication silently drops required evidence, or changed evidence is treated as its frozen snapshot.
  verified_by:
  - check
  evidence: >-
    Required-selector missing/present controls and advisory-name/coverage disclosure controls in focused verification plan tests Full check also retains coverage
    in: test/kogen/pre_verification_settlement_test.exs, test/kogen/proof_selector_verification_test.exs, test/kogen/review_packet_test.exs.
    Focused proof selectors are witnesses, not a reduced full-suite obligation. Publication-size diagnostics and
    forbidden-runtime publication controls live in test/kogen/git_test.exs and actual controller publication preflight
    tests.
  proof:
    offline:
    - test/kogen/proof_selector_verification_test.exs
    - test/kogen/git_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: exact test resolution and pre-Review control'
    affected_paths:
    - lib/kogen/build.ex
    - lib/kogen/build/verification_plan.ex
    - priv/kogen/prompts/developer.md
    - priv/kogen/prompts/reviewer.md
    - test/kogen/pre_verification_settlement_test.exs
    - test/kogen/proof_selector_verification_test.exs
    - test/kogen/review_packet_test.exs
    - lib/kogen/git.ex
    - lib/kogen/build/evidence.ex
    - priv/kogen/prompts/shaping.md
    - priv/kogen/prompts/shaping-fresh.md
    - priv/kogen/prompts/shaping-continuation.md
    - test/kogen/manual_controller_test.exs
- id: selected-route-catalog
  given: Admission reads the selected route, target catalog and all actual changed owners
  when: The controller freezes a run and plans its offline preparations and live fan-out
  then: >-
    Every required selected live target is gating even if it has not passed before. Disclose predicted changed-owner
    coverage gaps from the frozen catalog to Review as advisory; path mappings alone never add or block a target.
    Independent Review assesses actual coverage and requests repair of a concrete gap. Resolve every applicable
    selected-target prepare before any provider dispatch, and run
    each preparation with provider access denied. `optimum` remains the default for Shape and Build, explicit legacy
    routes remain valid, and the exact harness/model/effort/catalog are frozen and recorded for every phase and
    restart. A later config edit cannot silently substitute a route or suppress a required target.
  wrong_result: >-
    A cached pass hides a required target, a prepare launches a provider, changed live ownership is omitted, or
    a resume silently loads a different route/catalog.
  verified_by:
  - check
  evidence: >-
    Catalog coverage and fake authentication rejection controls; frozen route reaches a fake make child and survives
    live-tagged test_helper. Mutate config after admission then resume, asserting unchanged bound role profiles.
    Wrong default and explicit override cases reject silent substitution; native team proof is supplied by the selected
    live scenarios. Full check also retains coverage in: test/kogen/selective_verification_targets_test.exs, test/kogen/proof_selector_verification_test.exs,
    test/kogen/configuration_support_contract_test.exs, test/kogen/harness_args_test.exs, test/kogen/controller_verification_test.exs,
    test/kogen/route_env_preservation_test.exs. Focused proof selectors are witnesses, not a reduced full-suite
    obligation.
  proof:
