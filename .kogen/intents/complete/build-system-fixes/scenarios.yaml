---
- id: convergent-rework
  given: A Candidate revision T passes the complete offline gate and the frozen route selects provider-backed targets
  when: The automatic Build controller (`mix kogen.build`) schedules verification and independent Review for T
  then: >-
    Run every selected live target and a provisional read-only Review concurrently on the same immutable T; wait
    for all started jobs, then hand the Developer one aggregate of every target failure, Review finding, signature
    and evidence reference. Keep the Developer idle during settlement. A finding never cancels live work. Cancelled
    work is recorded as neither pass nor fail. Live targets always run on the Build's selected route. Repair within explicit frozen progress and work budgets
    (`max_developer_resumptions` is 3; `max_no_progress` is derived from the round allowances); same-tree
    Review no-change rounds count against progress allowance. Completion requires all selected checks, no blocking
    findings, a final T-bound verdict, and the evidence-addendum join; progress-only turns or unfinished helpers
    never complete a phase.
    Elapsed time is diagnostic. Measure and report active elapsed time per phase, cycle and Build, and warn once
    past `build_time_nudge_minutes`. Every `developer_turn_minutes` the Developer is nudged by interrupting and
    resuming the same session with a progress and narrow-scope prompt; it is never stopped for duration, and a nudge
    is not charged as a repair resumption. No Build, turn or stage ever fails solely for elapsed time. A plain paid
    live-target failure (catalog flag `same_tree_retry`) is retried once on the same tree; both attempts are
    recorded and shown to the Reviewer and in the handoffs, and a pass on retry is flaky and counts as no progress.
    Timeouts, cancellations and provider or environment classes are never retried. The Developer-resumption ceiling
    is charged per repair handoff.
  wrong_result: >-
    Verification stops after the first live failure, Review waits until every target passes, aggregate evidence
    is split across handoffs, or a provisional verdict authorizes a changed tree.
  verified_by:
  - check
  evidence: >-
    Focused controller fake-harness run with changed and unchanged Candidate controls Full check also retains coverage
    in: test/kogen/controller_verification_test.exs, test/kogen/two_outer_resumptions_test.exs. Focused proof selectors
    are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/controller_verification_test.exs
    - test/kogen/parallel_settlement_test.exs
    - test/kogen/review_packet_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: fake-harness convergence and failure-class controls'
    affected_paths:
    - lib/kogen/build.ex
    - lib/kogen/build/failure_handoff.ex
    - lib/kogen/build/failure_signature.ex
    - test/kogen/controller_verification_test.exs
    - test/kogen/two_outer_resumptions_test.exs
    - README.md
    - lib/kogen/harness.ex
    - priv/kogen/prompts/expert.md
    - priv/kogen/prompts/developer.md
    - lib/kogen/harness/claude.ex
    - lib/kogen/claude_code.ex
    - test/kogen/parallel_settlement_test.exs
    - test/kogen/review_packet_test.exs
- id: failed-build-returns-to-draft
  given: >-
    An admitted automatic Build (`mix kogen.build`) owns a frozen Approved package, Candidate, phase state and controller tracking
    record
  when: A terminal failure, resumable interruption or successful publication is settled
  then: >-
    Persist typed failure evidence, completed and cancelled phase receipts, actual dispatch/spend ledger, remaining
    budgets, exact Candidate/base/context identity and next action before disposition. Terminal admitted failure
    returns the selected package atomically to Draft without changing its identity, provenance or history; continuable
    provider/interruption state retains custody. Recovery reuses only digest-verified exact-tree receipts, rejects
    stale/missing refs and exhausted budgets, and carries no copied attempt diary or historical patch. Successful
    publication retains concise final acceptance provenance; interruption or a pre-admission refusal cannot masquerade
    as terminal failure.
  wrong_result: >-
    A failure or restart loses the Candidate, replays stale receipts, appends transcripts as requirements, erases
    breaker lineage, or changes package state before the controlling record settles.
  verified_by:
  - check
  evidence: >-
    Actual controller failure/continuation/reapproval controls, missing/tampered recovery references, Draft collision
    and unchanged-contract breaker controls; original Candidate and latest code retained without patch duplication.
    Full check also retains coverage in: test/kogen/build_workspace_test.exs, test/kogen/failure_report_test.exs,
    test/kogen/build_breakers_test.exs, test/kogen/build_continuation_test.exs, test/kogen/build_reconcile_test.exs,
    test/kogen/lifecycle_test.exs. Focused proof selectors are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/build_workspace_test.exs
    - test/kogen/manual_controller_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: package custody and failure-class lifecycle controls through the Build controller'
    affected_paths:
    - lib/kogen/build.ex
    - lib/kogen/build/failure_report.ex
    - lib/kogen/build/breakers.ex
    - lib/kogen/build/continuation.ex
    - lib/kogen/intent.ex
    - test/kogen/build_workspace_test.exs
    - test/kogen/failure_report_test.exs
    - test/kogen/build_breakers_test.exs
    - test/kogen/build_continuation_test.exs
