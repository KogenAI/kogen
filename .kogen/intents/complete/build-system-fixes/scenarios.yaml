- id: repair-authority-and-review-disclosure
  given: >-
    Implementation repairs touch ordinary files outside the predicted footprint, generated fixtures or verification
    owners
  when: The controller settles the repaired tree and assembles Review evidence
  then: >-
    Permit ordinary related changes in the owned Candidate without model approval per file. Derive actual changed
    paths/hunks and require a distinct Reviewer assessment of relevance, semantic test strength and available failure
    evidence. Disclose changed-owner coverage predictions from the frozen catalog to Review; predicted mappings alone
    are advisory. All selected targets remain required, and a concrete newly discovered proof gap is explicit
    Review rework through the responsible repair phase, not silent mutation of frozen selection. Keep Approved bytes, tracking/verification records, credentials, write boundaries and named protected
    controls immutable. A disputed unrelated edit is explicit Review rework, not an automatic path-list stop.
  wrong_result: >-
    An ordinary path alone forces restart, an extra change is hidden, tests are weakened, a newly required target
    is omitted, or a protected control mutates.
  verified_by:
  - check
  evidence: >-
    Retained controller-path positive and disconfirming controls; exact Candidate revision and native model/session
    receipts where selected. Full check also retains coverage in: test/kogen/build_repair_authority_test.exs, test/kogen/guarded_paths_test.exs,
    test/kogen/review_packet_test.exs, test/kogen/selective_verification_targets_test.exs, test/kogen/shaping_audit_checks_test.exs,
    test/kogen/scenario_contract_test.exs. Focused proof selectors are witnesses, not a reduced full-suite obligation.
  proof:
    offline:
    - test/kogen/build_repair_authority_test.exs
    paid_target: none
    paid_reason: 'offline-sufficient: controller fake-harness controls establish authority and verification semantics'
    affected_paths:
