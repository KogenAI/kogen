summary: >-
  After Stop verification settles, Build no longer asks the Developer model for
  a JSON handoff. Deterministic controller code builds the handoff report from
  the Approved contract, the Candidate's Git changes, the declared proof
  selectors and Kogen's own receipts, so the report's format and schema cannot
  fail. The Developer's final message is free prose and is never parsed by
  Kogen code. Build sends that prose, with the controller-listed item IDs, to
  TypeSafe Jev (`jev-1.13.0`) in one request. Jev reports, for each item,
  what the Developer says about its own work (unfinished, done, pending
  external verification, resolved or historical, unclear) and whether the
  Developer says the approved contract cannot be met. If an objection answer
  reaches 0.85 or higher, the Build stops and returns to Shaping, quoting the
  Developer's words and Jev's confidence. Every other answer, and any Jev
  failure, goes to the fresh Reviewer as labelled advisory notes. Jev never
  judges code and never accepts anything. A declared proof selector that is
  still missing is unfinished work, decided by code, and the Build reworks.
  Independent Review stays authoritative for acceptance.
appetite: >-
  One Build: one Developer conversation within the configured outer allowance
  (2). The old schema plumbing is left in place, unused by Build, and deleted in
  a follow-up Intent (see questions.md).
