- id: reconcile-scope
  scenario_ids: [killed-controller-reported, publication-crash-reported]
  description: >-
    Reconcile relies on "holding the lock means every running owner record is dead": at e5988718 acquire/1 refuses a
    live holder and reclaims a dead one, and the admitted Build claims its own build id only in admit_candidate/2,
    after reconcile. parallel-builds-with-integration (draft) replaces the one lock with per-slug claims; its
    re-preflight must move this onto per-claim liveness, or reconcile marks a live sibling interrupted.
- id: dead-record-read
  scenario_ids: [killed-controller-reported, publication-crash-reported]
  description: >-
    Reconcile reads a dead record, which the Kogen.Build.Tracking moduledoc says is never reloaded as Build state.
    It reads it as evidence only (status, last attempt, its token and number, session id, signatures), binds it by
    record_sha256, and never writes it. The record's `purpose` string stays "inspection evidence; not a recovery
    checkpoint" (scenario_tracking_test.exs asserts it).
- id: standin-build-path
  scenario_ids: [killed-controller-reported]
  description: >-
    Inside an IsolatedCase child MIX_BUILD_PATH names an empty private _build, so a `mix run` stand-in compiles the
    whole project first (slow; in a probe copy it failed on yamerl). The stand-in runs as `elixir -pa <every absolute
    :code.get_path() entry>` (probed at e5988718: the Build started within seconds). A Developer running the tests
    inside its own Build inherits KOGEN_ROLE and KOGEN_HARNESS_HOME, so the stand-in's Port env and
    ScriptedBuildFixture.run/2 unset both (found by two earlier Reviews).
- id: standin-readiness
  scenario_ids: [killed-controller-reported]
  description: >-
    The custody stand-in once printed READY before its fake had written its pid files (custody-standin-ready). These
    tests wait for the fake's own developer-hanging file (bounded), kill -9 the stand-in, and wait (bounded) until
    the fake's pid is gone before the next Build; the process supervisor's parent-death watchdog reaps the fake
    (probed: "reaped: no live groups").
- id: self-hosting
  scenario_ids: [killed-controller-reported]
  description: >-
    This Build runs under the develop controller it starts from, which has no reconcile: a killed installing Build
    leaves an unreported Candidate. Launch with `--route codex` (rule 51). Never override TMPDIR and run Python with
    -B (lessons 20, 21).
