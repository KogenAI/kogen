- id: "all-role-dispatch"
  given: "Fresh Shape, continued Shape, first Developer, resumed Developer and fresh Reviewer run through their production launch paths."
  when: "Task-file and retained historical snapshot bodies grow beyond 1,048,576 characters while paths and execution metadata stay fixed."
  then: "Each dispatched prompt retains role instructions, authority, configured profiles, output schema and required path/identity locators; task-file bodies, encoded snapshots and serialized verdict/history payloads are absent. Prompt size does not grow with those bodies. The Shaping role covers README and maintained relevant context, directly or through delegated readers; continued Shape preserves identity, original provenance, missing-optional-file behavior and same-conversation approval."
  wrong_result: "Only templates are checked, rework still serializes verdicts, or a copied context file/helper packet moves the same bulk payload elsewhere."
  verified_by:
    - "check"
  evidence: "Capture actual provider-boundary prompts for all five routes; fixed metadata small/large sentinel controls; report rendered byte sizes without a new product cap or model-savings claim."
- id: "discovered-contract"
  given: "An Approved package links a normative requirement and the existing tracking record contains attempts, owned receipts and open findings."
  when: "The fake external provider runs in the actual child cwd with path-based task delivery."
  then: "Developer and Reviewer cover the selected complete normative contract and required current record fields through direct or delegated disk reads, bind to the supplied attempt/Candidate, and emit existing schema-valid handoff/verdicts. A verdict depends on the actual linked requirement and current source/evidence bytes. Roots own reading coverage, integration, consequential contradiction resolution and final output without mandatory duplication of helper reads."
  wrong_result: "A provider logs file reads but selects acceptance by call count, uses parent-injected omitted context, or omits requirements absent from the launch prompt."
  verified_by:
    - "check"
  evidence: "Extend existing fake lifecycle harness; change linked requirement or current source in a controlled fixture and demonstrate needs_rework rather than an unconditional accept."
- id: "rework-and-history"
  given: "The first handoff is invalid; a later valid handoff reaches fresh Review with a source defect, and retained evidence includes an earlier version of the same file."
  when: "Build resumes the exact Developer within its two-resumption budget and obtains a fresh Review after repair."
  then: "Concise rework gives failure category and existing detail location. Developer selects prior failure and current attempt correctly; fresh Reviewer judges current source and closes every open finding with inspected evidence. Earlier exact snapshots remain available and Complete preserves historical bindings."
  wrong_result: "Rework embeds old verdicts, silently loses findings, judges stale source, changes Developer session or deletes history to shorten prompts."
  verified_by:
    - "check"
  evidence: "Real Build driver plus real Stop hook in isolated fixture; invalid handoff, source-derived rejection, repair, fresh Review and publication; inspect record and preserved role-specific snapshot bytes."
- id: "integrity-preserved"
  given: "Roles discover authoritative inputs and evidence on disk."
  when: "Required evidence is absent/unreadable, attempt/Candidate selection is wrong, Approved/Candidate/record bytes mutate, or a verdict supplies invalid references or omits findings."
  then: "Existing integrity, contract, gate and publication checks prevent unsupported acceptance. Roles report missing required paths rather than inventing evidence; unfinished optional Shaping files remain permitted. Existing gate ownership, failure classification and attempt limits are preserved."
  wrong_result: "Removing inline context weakens validation, treats claims as gate receipts, silently falls back to old evidence, or rejects an unfinished Draft because optional files are absent."
  verified_by:
    - "check"
  evidence: "Retain existing negative lifecycle controls and add discovery-specific missing-path/stale-selection controls; verify no accepted Complete for invalid cases."
