- id: exact-candidate-routing
  given: A Build is admitted on clean attached main while control, one unique linked Candidate, and an independent repository contain different root, instruction, and hook sentinels.
  when: The controller launches the fresh Developer, a native helper, exact-session Developer resume, Stop-owned verification, and every fresh Reviewer.
  then: Every role `project_root`, process cwd, and Git root equals the physical Candidate root; operation/generation and writable tool state are Candidate-private; unified verification state/history and tracking are controller-owned absolute paths; required Candidate hook, target, offline-stage, and role artifacts are copied and content-bound into control tracking before cleanup, and no Complete evidence locator points into a removed workspace. Controller origin paths and role citations are explicitly distinguished; generated context and retained-state records supply a usable exact current tracking-record citation with an artifact locator and digest, while ordinary source/artifact citations stay Candidate-relative. No role receives a control-relative path presented as Candidate-local evidence; no broad absolute-path permission or fallback root lookup is added.
  wrong_result: A Candidate id or trusted-project setting is passed while a role, helper, resume, verification subprocess, or Reviewer still runs in control, or role prose is accepted as root evidence.
  verified_by: [check, live-native]
  evidence: Focused root-routing tests use disconfirming sentinels and retain command cwd/Git root, context, state-path, instruction, hook-manifest, and normalized native-outcome evidence; live-native owns the pinned-runtime observation. The production context-to-handoff-to-verdict-to-snapshot route accepts its own advertised current-record citation, rejects stale/foreign/escaping/missing/tampered references, preserves controller-owned historical versions across legitimate updates, and remains inspectable after Candidate cleanup as required by repair-plan.md.
  proof:
    offline: [test/kogen/build_workspace_test.exs, test/kogen/harness_role_test.exs, test/kogen/codex_environment_test.exs, test/kogen/scenario_tracking_test.exs, test/kogen/scenario_lifecycle_test.exs, test/kogen/developer_handoff_test.exs, test/kogen/reviewer_mutation_test.exs]
    paid_target: live-native
    paid_reason: "provider-required: live-native; observation: pinned Codex fresh, resume, helper, compatibility, and Reviewer processes use the controller-supplied Candidate cwd/context and unchanged Candidate hook bytes; offline-limit: fake harnesses cannot establish native cwd, discovery, or provider outcome semantics"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/workspace.ex, lib/kogen/codex.ex, lib/kogen/codex/environment.ex, lib/kogen/codex/state.ex, lib/kogen/codex/compatibility.ex, lib/kogen/harness.ex, lib/kogen/provider_outcome.ex, lib/kogen/verification_policy.ex, test/kogen/build_workspace_test.exs, test/kogen/harness_role_test.exs, test/kogen/codex_environment_test.exs, test/kogen/configuration_support_contract_test.exs, test/kogen/codex_compatibility_preparation_test.exs, test/kogen/codex_native_live_test.exs, test/kogen/native_helper_live_test.exs, test/kogen/live_native_receipt_audit_test.exs, test/kogen/provider_outcome_test.exs, test/support/live_native_receipt_audit.ex, test/support/native_helper_fixture.ex, lib/kogen/build/contract.ex, lib/kogen/build/tracking.ex, lib/kogen/build/verification.ex, test/kogen/scenario_tracking_test.exs, test/kogen/scenario_lifecycle_test.exs, test/kogen/developer_handoff_test.exs, test/kogen/reviewer_mutation_test.exs, test/support/scenario_lifecycle_harness.py]

- id: private-candidate-state
  given: A Candidate needs admitted warm dependency/build artifacts, private Mix/Hex/rebar homes and caches, temporaries, generated files, isolated-test state, and a separately proven first-cold Gitless route.
  when: Normal workspace admission clones and validates warm seeds, Candidate source/config/dependency/toolchain inputs change or remain unchanged, and controls exercise clone-unavailable, missing-seed, stale artifact, concurrent source mutation, insufficient disk, collision, contained and unsafe symlinks, path escape, foreign owner, partial clone, and untracked input.
  then: >-
    Before any role launch, exactly control `deps/` and `_build/` are required, quiescent, recursively manifested, and APFS clone-on-write seeded into distinct Candidate paths; credentials, homes, broad caches, locks, sockets, receipts, logs, sessions and controller state are excluded. Relative Mix-shaped seed symlinks are retained as symlinks only when their lexical and resolved targets remain inside the corresponding admitted project tree and outside `.kogen/runtime`; absolute, dangling, escaping, runtime-targeting, special-file, or retargeted links are rejected. A Build-capable disposable fixture must use one shared owner to materialize both required seed trees, `mix.lock`, and byte-identical tracked tool-selection configuration; minimal fixture trees qualify only when they are present, stable, manifested, clone-capable, and valid for that fixture. Clone-or-fail runs on the actual Candidate filesystem with no eager-copy fallback or dereference, rechecks the source manifest and link targets, and cleans only owned partial destinations. Candidate-rooted Mix then performs normal dependency validation and incremental compilation for real Mix-project seeds: it reuses valid artifacts, rebuilds every invalidated artifact, rejects stale output, and does not force a clean full compile when inputs are unchanged. Candidate-private HOME and Mix/Hex/rebar/temp state must compose through verification targets and nested Builds; tracked project tool-selection configuration is read from the physical Candidate, while installed tool binaries/data may be shared only as immutable admitted inputs. Separately, the Gitless cold control validates outer-owned provenance without invoking Git inside its copy.
  wrong_result: Workspace creation recursively byte-copies or cold-compiles everything, blindly trusts cloned `_build`, clones credentials/session state, races a changing seed, silently falls back on unsupported storage, leaves a partial destination after ENOSPC, shares writable state, or lets a warm seed hide a broken cold control.
  verified_by: [check, cold-offline]
  evidence: Dependency/workspace and nested-lifecycle tests retain native clone results and link-aware manifests, distinguish source/Candidate identities, prove ordinary Mix `priv` links remain relative and resolve to Candidate-owned targets, mutate representative cloned files, preserve source/control/peer hashes, prove unchanged inputs avoid a clean compile, prove stale source/config/dependency/toolchain inputs trigger normal incremental rebuild, and reject absolute, dangling, escaping, runtime-targeting and retargeted links plus source races, unsupported filesystems, ENOSPC, collisions and partial cleanup; cold controls prove the disconfirming empty-state recipe. A fail-closed native clone primitive is exercised directly; successful cp -c cannot be accepted as clone proof because its fallback was demonstrated during Shaping. Both live owners use shared preparation preserving realistic links rather than cp -cRL dereferencing. Real seed/Candidate Mix build layouts must compose without silently forcing a fresh compile.
  proof:
    offline: [test/kogen/build_workspace_test.exs, test/kogen/workspace_dependency_test.exs, test/kogen/lifecycle_test.exs, test/kogen/cold_offline_contract_test.exs]
    paid_target: cold-offline
    paid_reason: "provider-required: cold-offline; observation: the cataloged provider-denied, offline-expensive target completes the disconfirming empty-state Gitless recipe with outer-owned provenance, private caches, and owned cleanup; offline-limit: normal clone-on-write workspace tests cannot establish that the independent cold recovery/readiness route still works; classification: no provider dispatch or provider semantics"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/workspace.ex, lib/kogen/codex/environment.ex, lib/kogen/check.ex, lib/kogen/verification_policy.ex, scripts/check/offline.py, test/kogen/build_workspace_test.exs, test/kogen/workspace_dependency_test.exs, test/kogen/lifecycle_test.exs, test/kogen/cold_offline_contract_test.exs, test/kogen/cold_offline_test.exs, test/kogen/stop_hook_test.exs, test/support/compiled_fixture.exs, test/support/dependency_fixture.ex, test/support/verification_fixture.ex, test/support/isolated_case.ex, test/support/isolated_process.py, priv/kogen/clone_tree.py, test/support/live_reviewer_rework_fixture.ex, test/kogen/live_shape_to_build_test.exs]

