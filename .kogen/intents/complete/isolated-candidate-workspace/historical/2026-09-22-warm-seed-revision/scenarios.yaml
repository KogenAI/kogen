  wrong_result: Only the outer make exit is retained, cleanup replaces the initiating cause, raw zero exit or forged stdout completes an isolated test, a duplicated Make parser admits a wrong target, every historical implementation is required in the current diff, or baseline rows can evade validation through a stale or invented generation.
