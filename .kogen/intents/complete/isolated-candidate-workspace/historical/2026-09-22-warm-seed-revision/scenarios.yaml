- id: failure-preservation-cleanup
  given: A Build fails, is rejected, cancelled, crashes, exhausts verification, collides with an existing resource, or leaves a locked, changed, symlinked, missing, or foreign workspace resource.
  when: The controller attributes failure, retains diagnostics, later encounters the resource, or cleans an exactly owned successful workspace.
  then: Main/control and admitted hooks remain unchanged; structured receipts identify whether the cause is workspace, provider, cleanup, or verification and retain the failed Candidate locator; cleanup removes only identity-matched owned resources and waits for owned descendants; ambiguity is retained and refused. A dangling Complete written by a role exists only in Candidate, triggers the guard violation, and remains absent from control. When guard rejection coexists with valid settled verification exhaustion, retain both causes and the settled cycles/receipts, report exhaustion as primary, and never admit handoff or Review; unreadable/tampered state still fails closed. Terminal child tests retain captured diagnostics and distinguish the intended failure from timeout or cleanup failure while checking owned descendant death.
  wrong_result: Retry exhaustion hides the failing stage, provider and cleanup causes collapse, diagnostics point to a deleted workspace, cleanup follows an alias or deletes foreign state, or production mirrors Candidate writes into control to satisfy an old assertion.
  verified_by: [check]
  evidence: Workspace/precondition/core-integrity, receipt, isolated-cleanup, and Git controls cover exact failure attribution, Candidate-side guard artifacts, collisions, cancellation, and destructive refusal. A provider-denied production lifecycle trips guard rejection and verification exhaustion together. The terminal-probe selector must expose its captured failure message; the cycle-2 cause remains unattributed until a source-bound reproduction diagnoses it.
  proof:
    offline: [test/kogen/build_workspace_test.exs, test/kogen/build_preconditions_test.exs, test/kogen/core_integrity_test.exs, test/kogen/offline_stage_results_test.exs, test/kogen/isolation_cleanup_test.exs, test/kogen/verification_ownership_lifecycle_test.exs, test/kogen/guarded_paths_test.exs, test/kogen/terminal_probe_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: deterministic failure attribution, Git/filesystem ownership, process cleanup, and destructive-refusal controls"
