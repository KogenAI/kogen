- id: same-candidate-rework
  given: One Developer attempt has created a Candidate and later needs a Stop retry, invalid-handoff correction, Reviewer rework, or allowed outer resumption.
  when: The controller settles each attempt, resumes the exact Developer session, validates standalone live fixtures before provider dispatch, launches fresh Reviewers, and invalidates evidence after any Candidate change.
  then: Every attempt uses the same owned worktree and branch; Stop retries and outer resumptions retain separate counters; each changed Candidate receives fresh settled verification; provider cause and cleanup remain normalized; and fresh Review reads the current Candidate snapshots rather than stale control or prior-attempt artifacts. Audits select the exact Build and attempts by identity and token, consume unified verification schemas, and preserve required content-bound Candidate artifacts through owner cleanup. Legitimate invalid-handoff correction consumes an outer resumption in the same Developer session; audits account for every attempt within the existing allowance, with distinct tokens/schemas and fresh Reviewer sessions, rather than requiring exactly two attempts in every run.
  wrong_result: Resume creates another workspace, a malformed standalone fixture spends a provider call, stale receipts survive mutation, cleanup masks provider failure, or Review sees a copied approximation.
  verified_by: [check, live-reviewer-rework]
  evidence: Extend live_rework_audit_test.exs to load only the actual live-reviewer-rework owner and its declared dependency chain in its own fresh OS/BEAM child; no lifecycle test, second live owner or externally preloaded helper may supply a missing dependency. Offline and paid execution share fixture preparation and real workspace admission up to the actual dispatch boundary, protected by a fail-closed sentinel. Missing helper/tool-selection/seed inputs and unsafe links fail locally; the corrected counterpart reaches that boundary with zero provider attempts. Existing offline lifecycle controls cover counters, invalidation and bindings; live-reviewer-rework separately proves authenticated same-session repair and fresh Review in one Candidate. Also exercise the real owner retention routine through fixture-only fake execution, production summary input, exact-byte archival, owned fixture deletion and retained audit; test both owned absolute and control-relative inputs plus foreign, symlinked, traversing, missing and digest/size-mismatched inputs. A preconstructed good archive does not prove that the retention producer works. Exercise the complete audit migration in repair-plan section 2, including two-attempt Reviewer rework and three-attempt Reviewer rework plus deliberately invalid handoff controls, current schemas and retained history/artifacts, all invocation/native/profile checks, and rejection of wrong session/token, reused Reviewer, stale Candidate, missing/tampered evidence and over-budget attempts. Provider stream controls offline are synthetic and cannot establish native semantics.
  proof:
    offline: [test/kogen/live_rework_audit_test.exs, test/kogen/two_outer_resumptions_test.exs, test/kogen/verification_ownership_lifecycle_test.exs, test/kogen/unified_state_admission_test.exs, test/kogen/reviewer_mutation_test.exs]
    paid_target: live-reviewer-rework
    paid_reason: "provider-required: live-reviewer-rework; observation: authenticated Reviewer-driven correction resumes the exact Developer in one Candidate and a fresh Reviewer inspects newly verified bytes; offline-limit: fake sessions cannot establish provider resume and Review routing"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/workspace.ex, lib/kogen/build/contract.ex, lib/kogen/build/verification.ex, lib/kogen/build/verification_plan.ex, lib/kogen/build/tracking.ex, lib/kogen/build/guarded_paths.ex, lib/kogen/build/target_evidence.ex, lib/kogen/check.ex, lib/kogen/git.ex, lib/kogen/provider_outcome.ex, test/kogen/two_outer_resumptions_test.exs, test/kogen/verification_ownership_lifecycle_test.exs, test/kogen/unified_state_admission_test.exs, test/kogen/reviewer_mutation_test.exs, test/kogen/live_reviewer_rework_test.exs, test/kogen/live_rework_audit_test.exs, test/kogen/stop_hook_test.exs, test/kogen/scenario_lifecycle_test.exs, test/kogen/settlement_regression_test.exs, test/support/compiled_fixture.exs, test/support/verification_fixture.ex, test/support/live_reviewer_rework_fixture.ex, test/support/live_rework_audit.ex, test/support/scenario_lifecycle_harness.py, test/support/fake_codex_always_rework, test/support/fake_codex_reviewer_mutates]

- id: atomic-main-publication
  given: A Candidate from admitted main has passed bound verification and fresh Review and contains accepted source plus frozen Complete provenance.
  when: The controller creates a hook-free commit, writes an identity-bound lock/journal, publishes while main equals admitted ref, synchronizes control, or encounters a stale ref, failure, or crash boundary.
  then: Compare-and-swap advances main to the exact Candidate commit and leaves clean control at that ref while preserving per-path and aggregate staged-size limits, `.kogen/runtime` rejection, assume-unchanged/skip-worktree refusal, required trailers, and publication provenance; only a matching journal/Build permits stale-lock takeover and idempotent post-ref completion; pre-ref, foreign, or ambiguous state is retained and refused; success never exists only on a kogen/build branch. Published compact full_record.path and evidence instructions remain control-checkout-relative and resolve after publication; host-absolute or retired-Candidate locators are not published. Both live-owner retention consumers preserve exact referenced bytes/digests and remain auditable after fixture cleanup.
  wrong_result: The accepted commit is stranded like 97109bf9, Complete is copied into different history, stale main advances, hooks run during commit, or a post-ref failure lacks recoverable settlement.
  verified_by: [check, live-shape-to-build]
  evidence: Extend lifecycle_test.exs to exercise only the connected live owner's declared dependency chain and shared fixture preparation in its own fresh provider-denied OS/BEAM child, with realistic Mix links and missing-helper/unsafe-seed controls; do not preload CompiledFixture from the parent. Before paid Shape, test-only Build inputs rehearse fixture and seed admission without claiming to validate a not-yet-generated package. After real Shape, admit the actual shaped contract/plan before Developer dispatch. Publication fault injection compares exact refs, trees, packages, journals, and control state. Hook-free success must unconditionally succeed despite a rejecting repository commit hook; a test accepting either success or commit failure does not prove this scenario. Connected lifecycle separately proves the accepted Candidate commit is main. The connected owner's real retention function must receive production summary output, not an already-normalized mock archive; cover absolute/relative fixture inputs and unsafe/missing/mismatched records. Identity-bearing lock and journal-reader recovery must be executed, not inferred from a journal write. The connected owner consumes the retained current-format state and Candidate Check history after cleanup, proves failed-then-passed verification before first handoff, and derives invocation/native counts from actual bounded attempts; it must not read obsolete fixture-root history. Its real preparation-to-retained-audit offline route is required by repair-plan section 2.
  proof:
    offline: [test/kogen/worktree_publication_recovery_test.exs, test/kogen/commit_failure_rollback_test.exs, test/kogen/lifecycle_test.exs, test/kogen/live_rework_audit_test.exs]
