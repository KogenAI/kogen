- id: workspace-resource-ownership
  scenario_ids: [exact-candidate-routing, private-candidate-state, same-candidate-rework, reliability-receipt-preservation, failure-preservation-cleanup, installing-authority-preservation]
  description: Workspace, branch, dependency, cache, runtime, and evidence ownership is the safety boundary; an alias or stale identity can corrupt control, another Candidate, or foreign data.
  ownership:
    - paths: Candidate under .kogen/runtime/build-workspaces/checkouts/<build-id>, kogen/build branch, worktree Git metadata, shared Git common directory snapshot and controller identity record.
      when_exists: Atomically create the fixed controller-owned parent and a unique identity-derived child/branch from admitted HEAD; refuse every preexisting directory, symlink including dangling symlinks, branch, registration, namespace mismatch, or partial identity rather than merging, adopting, pruning globally, or force-removing it.
      owner_after_creation: The controller owns only the exact path, branch, worktree registration, admitted base, and random identity it created and recorded; retained failed Candidate identities and receipts remain failed evidence. The Shaper-authorized implementation, now retained as 41 package source inputs, may be imported by the installing Developer as described in developer-recovery.md without adopting its old runtime identity or receipts.
      owner_during_operation: The controller owns topology and lifecycle; Developer, helpers, verification, and Reviewer receive the Candidate root but cannot transfer ownership or authorize cleanup.
      permitted_mutation: Candidate roles may mutate project content allowed by the Intent, except `.codex/hooks/**` and `.codex/hooks.json`, which are immutable for this Candidate; mutations to those bytes or shared Git config, hooks, excludes, refs outside the owned branch, stash, or other worktree registrations are detected and refused before verification/publication; only the controller may create, publish, lock, unlock, or remove workspace/ref resources after revalidating every identity component.
      validation: Compare canonical path including macOS /var resolution and socket-length bounds, lstat type, the tracked admitted `.codex/hooks/**` and `.codex/hooks.json` manifest excluding ignored runtime products, Git common/worktree dirs, config/hooks/excludes/stash/ref/worktree-registration snapshot, branch/ref, admitted base, current Candidate state, and identity record before every destructive or publication transition; use malicious role/hook-mutation controls and refuse changed or ambiguous state.
      git_state: Candidate changes and Complete publication live on its attached kogen/build branch until atomic accepted publication; main remains the admitted ref on failure and failed branches are diagnostic locators until identity-safe cleanup.
      upgrade_behavior: No automatic resumption, compatibility path, or adoption of historical worktree identities; each Build creates a new identity and old ambiguous resources require explicit external resolution. The explicitly authorized one-off source import is not a product migration or automatic recovery feature.
    - paths: The 41 inert source payloads and manifest evidence/latest-implementation.json, historical Git checkpoint 913ba174bffd864e0940c49d36d9e5d022333565 with its 38-path manifest, and any Shaper-owned backup stash.
      when_exists: Require all 41 payloads to decode to their declared sizes/hashes/modes and safe guarded destinations against the original baseline before importing; do not fall back to the older checkpoint. Recognize already restored matching files rather than overwriting them. Preserve divergent newer work and report a concrete conflict instead of resetting or silently starting over.
      owner_after_creation: The Shaper owns the package snapshot, saved checkpoint and backup; the installing Developer owns only the imported working-copy changes within existing guards. Old runtime resources and evidence do not transfer with source bytes.
      owner_during_operation: The Developer imports or reconciles the saved implementation in its controller-issued project root and repairs it; the controller retains verification and publication authority, and independent Review inspects the entire Candidate against c1f08532.
      permitted_mutation: Modify the imported source to satisfy this Intent, preserving useful work and existing guards. Do not reset or move HEAD to the WIP commit, cherry-pick it into accepted history, drop a stash, delete the recovery branch, copy private runtime state, or edit exhausted tracking records.
      validation: Compare all 41 baseline identities and decoded source sizes/hashes/modes, preserve payloads/checkpoint/backups, account for already-present changes, and inspect the complete baseline-to-Candidate diff. Fresh required verification and independent Review judge the imported code together with repairs; a checkpoint or previous pass is never a receipt.
      git_state: The checkpoint remains an unaccepted backup off main. Imported files are ordinary Candidate changes relative to c1f08532; only the normal successful Build may publish the accepted source plus Complete provenance.
      upgrade_behavior: This explicitly requested import applies only to this installing revision; future automatic existing-work detection, eligibility and stopped-Build continuation remain separately shaped follow-ups.
    - paths: Candidate deps, _build, .kogen/runtime/candidate-state Mix/Hex/rebar homes and caches, generated products, temporary state, offline/hook/target and role-owned runtime evidence; controller-owned unified verification state/history, tracking, publication state, and retained content-bound evidence snapshots.
      when_exists: Each destination must be absent. The exact seed allowlist is required control deps and _build only; never seed credentials, homes, broad caches, locks, sockets, receipts, logs, runtime/session, verification/tracking or mutable controller state. Build-capable disposable fixtures use one shared fixture owner to materialize present, stable, clone-capable seeds, mix.lock, and byte-identical tracked tool-selection configuration before invoking Build. While holding Build identity ownership, capture a recursive stable source manifest including symlink text and resolved ownership, preflight actual destination filesystem clone support and free space, clone-or-fail without dereference into owned staging destinations, recheck the source and link targets, then atomically expose complete Candidate trees. Admit only relative links whose lexical and resolved targets stay inside the corresponding project tree and outside .kogen/runtime; reject missing seeds, concurrent changes, unsupported cloning, eager-copy fallback, unsafe types, absolute/dangling/escaping/runtime-targeting/retargeted links, partial clones, collisions, and canonical escapes.
      owner_after_creation: The Candidate owns independently writable copies and outputs while active; Candidate-private HOME and Mix/Hex/rebar/temp paths remain private through nested Builds, while the tracked project tool-selection file is read from the physical Candidate and installed tool binaries/data are admitted immutable inputs rather than cloned state. Control owns unified verification state/history from creation; before successful Candidate cleanup the controller copies every required Candidate verification/role artifact into tracking with content hashes and both explicit roots and rewrites retained locators to the snapshots, so no Complete evidence points into a deleted workspace; admitted seed sources, sibling repositories, and peer Candidates remain separate owners and byte-preserved.
      owner_during_operation: Candidate-scoped tools and roles may mutate only these private paths; controller retains lifecycle/cleanup authority and evidence owners retain their phase-specific artifacts.
      permitted_mutation: Candidate writes to cloned files allocate private blocks; retained relative links resolve only to Candidate-owned paths and may not be retargeted across validation boundaries. Candidate-rooted Mix performs ordinary dependency validation and incremental compilation, reusing valid output and rebuilding invalidated source/config/dependency/toolchain/environment output. Resolve, compile, cache, generate, and clean only inside canonical Candidate paths; never follow escaping aliases or mutate seed sources.
      validation: Prove native clone success and distinct path/inode identity, preserve representative Mix-shaped priv links as links resolving to Candidate-owned targets, mutate cloned dependency/build files, and hash every seed before/after plus control/peer/sibling state. Prove unchanged inputs do not cause a compulsory clean compile and stale artifacts do rebuild under normal Mix validation. Reject broad-cache/credential cloning, eager recursive copy or dereference, source-manifest races, unsupported filesystem, insufficient space, absolute/dangling/escaping/runtime-targeting/retargeted links and partial-clone residue. Separately exercise Hex, Git and path consumers plus the cold Gitless recipe.
      git_state: Ordinary dependency, build, cache, temporary and runtime products remain ignored/untracked unless the Approved contract explicitly requires a generated tracked file; publication stages only accepted Candidate source and Complete provenance under existing size/runtime exclusions.
      upgrade_behavior: Safe warm seeding uses APFS clone-on-write with fail-closed admission when unavailable; cold operation remains a separately verified recovery/readiness control. There is no eager full-copy fallback, shared writable cache fallback, per-workspace compulsory full rebuild, or retained failed-Candidate cache reuse.

- id: publication-ownership
  scenario_ids: [atomic-main-publication, failure-preservation-cleanup]
  description: Publication crosses from an owned Candidate branch into main; a stale or partially applied transition could strand acceptance or advance the trusted branch incorrectly.
  ownership:
    - paths: .kogen/build.lock identity record, refs/heads/main, checked-out control index/worktree, control Approved package, Candidate frozen Approved copy, accepted Candidate commit, Complete Intent package and .kogen/runtime/build-workspaces/<build-id>/publication.json journal.
      when_exists: Materialize the frozen Approved bytes into Candidate for roles while preserving the control copy; require main to equal the admitted ref, control tracked state to match it, and Complete to be absent from authoritative history before publication; a later invocation may take over a stale lock only when its recorded Build identity exactly matches the journal, otherwise reject the lock, stale main, conflicting Complete, foreign journal, or mismatched Candidate commit.
      owner_after_creation: Main owns the exact accepted commit containing source and Complete provenance together; local full tracking remains controller evidence under the existing retention contract.
      owner_during_operation: The controller alone owns the identity-bearing build lock and performs compare-and-swap publication and recovery; Developer/Reviewer acceptance supplies evidence but cannot move main or authorize lock takeover.
      permitted_mutation: Create the accepted commit with commit-tree-style hook-free plumbing and explicit hardened Git configuration, compare-and-swap main exactly once, synchronize the checked-out control index/worktree to that same commit, then remove the matching ignored control Approved copy; never run repository hooks, synthesize a second content commit in control, or rewrite unrelated history.
      validation: Compare ref, index and worktree tree hashes, Complete/frozen Approved bytes, trailers, provenance, Candidate identity, shared-Git snapshot and journal before/after each boundary; inject precommit, pre-ref, post-ref/pre-sync, post-sync/pre-cleanup and crash failures.
      git_state: Success leaves main and clean control at the exact accepted commit and no authoritative result solely on kogen/build; pre-main failure leaves main/control at admitted ref and retains a nonreusable locator; journal-proven post-main recovery finishes control synchronization/Approved cleanup, while ambiguity is refused.
      upgrade_behavior: Publication is a hard cutover with no legacy dual path, fallback, feature flag, manual installation step, or compatibility mode.

- id: structural-not-security-containment
  scenario_ids: [exact-candidate-routing, installing-authority-preservation]
  description: Linked worktrees share a Git common directory and explicit roots constrain normal Kogen routes but do not contain a hostile process; overstating the boundary would create a false security guarantee.
  ownership:
    - paths: Shared Git common directory and processes launched for Candidate roles.
      when_exists: Treat the common directory as control-owned existing state; snapshot its security-relevant config, hooks, excludes, stash, refs and worktree registrations before roles run.
      owner_after_creation: Control remains owner of shared Git state; Candidate ownership never includes authority to change another ref/worktree or install a hook.
      owner_during_operation: Roles are contractually limited to Candidate work and may technically attempt escape because no kernel sandbox is claimed; the controller detects relevant shared-state mutation and refuses verification/publication.
      permitted_mutation: Only the controller's identity-bound Candidate branch/worktree transitions and hook-free publication are allowed; other common-state mutations are forbidden and preserved for diagnosis.
      validation: Use malicious-role controls, shared-state before/after snapshots, explicit roots and hook-free Git plumbing; document that arbitrary filesystem/process escape remains outside this Intent.
      git_state: Shared state is not published as Candidate content; unauthorized mutation stops the Build without moving main.
      upgrade_behavior: Kernel process-tree containment is a later Intent; there is no claim or fallback that structural detection provides security containment.

- id: admitted-hook-immutability
  scenario_ids: [exact-candidate-routing, same-candidate-rework, installing-authority-preservation]
  description: The installing Build remains subject to the admitted Stop authority; changing hook bytes would let the Candidate alter the judge that accepts it.
  ownership:
    - paths: Tracked .codex/hooks/** entries and .codex/hooks.json at admitted HEAD, excluding ignored runtime products such as __pycache__/*.pyc.
      when_exists: Capture every tracked path, type, mode, byte count and SHA-256 before Candidate work; missing, added, removed, renamed, mode-changed, symlinked or byte-changed tracked entries are contract violations, and ignored products cannot substitute for them.
      owner_after_creation: The admitted controller owns these immutable verification-authority bytes throughout the installing Build; this Candidate never acquires mutation authority.
      owner_during_operation: Developer, helpers, verification and Reviewer may execute or inspect the admitted bytes from their routed workspace but may not modify, replace, regenerate or reinterpret their authority.
      permitted_mutation: None in this Intent; controller-owned Elixir inputs and explicit roots/state paths must adapt around the existing Stop runner.
      validation: Hash the admitted tracked manifest before and after every role and before publication; exercise tracked mutation plus ignored-pycache controls and prove acceptance stops for the former without treating the latter as authority while original tracked bytes and main remain unchanged.
      git_state: Hook/config paths must have no Candidate diff and the accepted commit must contain bytes identical to shaped HEAD.
      upgrade_behavior: The next controller-verification cutover may remove Stop authority in a separately shaped Intent; no compatibility behavior, dual hook path or early authority change is introduced here.

- id: reliability-evidence-ownership
  scenario_ids: [private-candidate-state, reliability-receipt-preservation, same-candidate-rework, failure-preservation-cleanup, installing-authority-preservation]
  description: Workspace relocation crosses installed receipt, catalog, retry, and evidence boundaries; retaining only an outer exit or path can lose attribution or authorize stale bytes.
  ownership:
    - paths: Candidate offline-stage, isolated-completion, rehearsal, verification, target, handoff and role artifacts; controller tracking snapshots; verification and reliability catalogs.
      when_exists: Create each artifact in invocation-specific Candidate-private regular storage with the installed schema and exact Candidate, attempt, source/input, selector, target-plan, catalog, toolchain, provider-denial and cleanup bindings; reject preexisting, aliased, partial, stale or foreign artifacts.
      owner_after_creation: The producing stage owns its live Candidate artifact; before successful workspace removal the controller owns a content-bound snapshot of every required artifact and both Candidate/control roots; failed Candidate artifacts remain with the retained diagnostic locator.
      owner_during_operation: Stage owners may replace only their own atomic invocation artifact; the controller alone decides invalidation, snapshots, retry counters, Review admission and publication; roles cannot promote claims into receipts.
      permitted_mutation: Candidate mutation invalidates prior settled evidence; reruns create fresh invocation-bound artifacts while retaining earlier failure history. Cleanup disposition may be settled but never replace the initiating provider or stage cause.
      validation: Exercise Git-backed and Gitless provenance, untracked-input and catalog/plan drift, raw-zero and forged completion, stale attempt/session/Candidate, malformed rehearsal, provider/cleanup dual failure, snapshot digest mismatch, missing-artifact controls, and generation-aware catalog controls for clean checkout, changed rows, stale admitted generation and Gitless input through current production consumers.
      git_state: Runtime receipts remain ignored and are not published as source; reliability/catalog changes required by new maintained tests are tracked Candidate changes and must be consistent before verification.
      upgrade_behavior: Preserve schema-version fail-closed behavior and current retry/invalidation semantics; no legacy receipt fallback, duplicated Make inventory, or migration from failed Candidate evidence.
    - paths: Current controller record citations, embedded verification/context snapshots, and published compact full_record.path plus retained live-owner archives.
      when_exists: The controller supplies an exact current-record citation with a locator and digest for a specific retained artifact; physical origin paths are provenance, not implicitly Candidate-relative role references. Both real live owners retain production output before deleting their owned fixtures.
      owner_after_creation: Control owns live tracking and exact historical snapshot bytes; the outer live owner owns its copied archive. Published summary locators resolve from the control checkout root and retained test summaries resolve from their owned archive, not from deleted Candidates or host-home paths.
      owner_during_operation: The producing controller or outer fixture owner alone may rewrite its own locator representation without changing the bound bytes. Review inspects the specific decoded artifact; merely naming a record is not semantic evidence.
      permitted_mutation: Legitimate controller appends may advance live tracking while preserving cited historical bytes. Reject external edits, stale or foreign records, missing or mismatched artifacts, traversal, symlink substitution and broad absolute-path admission.
      validation: Follow generated context through actual handoff and verdict validators, snapshots, controller updates and post-cleanup inspection; exercise both real retention functions with owned absolute and control-relative inputs and negative controls. When a valid exhausted settlement coexists with guard failure retain both causes and receipts, with exhaustion primary; corrupted state never becomes invented settlement.
      git_state: Runtime artifacts and archives remain ignored; the compact summary and instructions are committed with source and Complete, using the documented control-relative locator and exact digest/byte count rather than embedding a machine path as its public record locator.
      upgrade_behavior: Preserve the installed publication format and narrow reference authority. No historical failed receipt becomes current proof; this does not add cross-Build resume or a new evidence trust/attestation system.
