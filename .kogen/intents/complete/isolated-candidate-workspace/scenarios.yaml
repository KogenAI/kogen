- id: candidate-creation
  given: >-
    A clean control checkout attached to branch B at commit A, with control `deps/` and
    `_build/` present, a frozen Approved package in control's ignored
    `.kogen/intents/approved/<slug>/`, and an unrelated linked worktree created by plain git
    (for example under `.kogen/runtime/build-worktrees/`).
  when: >-
    `mix kogen.build <slug>` is admitted with `KOGEN_WORKSPACES_ROOT` set to a directory whose
    path contains a space.
  then: >-
    Before any provider launch, exactly one new linked worktree exists at
    `<workspaces-root>/<project-id>/<slug>-<build-id>/` on new branch `kogen/<slug>/<build-id>`
    at A, where `<project-id>` equals `Kogen.ClaudeCode.project_id(control)` and `<build-id>` is
    the scenario-tracking record id. The harness home
    `<workspaces-root>/<project-id>/harness/<build-id>/` exists outside the Candidate and outside
    control. The owner record `<workspaces-root>/<project-id>/candidates/<build-id>.json` has
    status `running` and names the worktree, branch, admitted commit, control root, harness home
    and credential bindings. Those bindings (harness, scope name and path, runtime version for
    each harness the route's roles use) are nonempty in the owner record before
    `Kogen.Harness.open_roles/4`, readiness or any other harness process starts; readiness then
    checks the recorded bindings. The Candidate has a plain copy of control `deps/`, no `_build/`, and
    the Approved bytes at its ignored `.kogen/intents/approved/<slug>/`. It receives nothing else
    from control's ignored state: no `.kogen/build.lock`, `.kogen/runtime/`, `.kogen/codex/` or
    `.codex/sessions/` (GuardedPaths' volatile set other than `deps/`), so a hook or test in the
    Candidate never sees the running Build's lock or runtime. Control's HEAD, index,
    tracked bytes and `git status --porcelain` are unchanged, the foreign worktree is untouched,
    and a sentinel real Kogen root stays empty. A pre-existing path, branch or owner record with
    that name, a missing control `deps/` (message names `mix deps.get`), or a failed
    `git worktree add` stops before any launch, removes only what this admission created, and
    never falls back to control.
  wrong_result: >-
    Build keeps running in the invoking checkout, nests the worktree in the repository, writes
    under the real Kogen directory while `KOGEN_WORKSPACES_ROOT` is set, copies `_build/`, reuses
    an existing directory or branch, fetches dependencies from the network, deletes a foreign
    worktree during admission, or writes the owner record with an empty `credential_bindings`
    list and fills it only after readiness (Review finding of Build 8Bs51yZP).
  verified_by: [check]
  evidence: >-
    Focused workspace tests with a real Git fixture, a spaced `KOGEN_WORKSPACES_ROOT`, a
    real-root sentinel directory, a foreign worktree and a launch sentinel assert the paths,
    branch, owner record fields, base commit, deps copy, absence of `_build/`, Approved bytes,
    byte-identical control state, the absence of the volatile paths in the Candidate while
    control holds a `.kogen/build.lock`, and each refusal case with no launch. A fake harness
    whose readiness step reads the owner record at the moment it starts asserts that record
    already holds nonempty `credential_bindings`; asserting the bindings only after the Build
    finishes does not catch the 8Bs51yZP ordering defect.
  proof:
    offline: [test/kogen/build_workspace_test.exs, test/kogen/build_preconditions_test.exs]
    paid_target: none
    paid_reason: >-
      offline-sufficient: real git worktree fixture with foreign-worktree, collision,
      missing-deps, real-root-sentinel and launch-sentinel controls; no provider semantics
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/workspace.ex, lib/kogen/git.ex, lib/mix/tasks/kogen.build.ex, test/kogen/build_workspace_test.exs, test/kogen/build_preconditions_test.exs, test/test_helper.exs, priv/kogen/test-reliability.yaml, priv/kogen/test-reliability-remediation.yaml]

- id: per-build-harness-home
  given: >-
    A control project whose Claude Code login selector names a scope (shared or project), a
    Codex login scope, and a caller environment that sets `HOME`, `CLAUDE_CONFIG_DIR`,
    `CLAUDE_SECURESTORAGE_CONFIG_DIR` (to an empty string), `CLAUDE_CODE_OAUTH_TOKEN`,
    `ANTHROPIC_API_KEY`, `CODEX_HOME` and `OPENAI_API_KEY`.
  when: >-
    A Build is admitted and launches its Claude Code Developer, a resume and helpers, and its
    Reviewer on the route's harness; during the Build the project's login selector is switched
    with `mix kogen.claude.login --use-default` or `--project`.
  then: >-
    Every Claude Code launch of the Build has `CLAUDE_CONFIG_DIR` equal to
    `<harness home>/claude`, `CLAUDE_SECURESTORAGE_CONFIG_DIR` equal to the scope path resolved
    from the control root at admission, and the caller's real `HOME`; every variable that
    `Kogen.ClaudeCode.environment/2` removes at 9ff7af6e (the `ANTHROPIC_`, `CLAUDE_CODE_`,
    `CLAUDE_CONFIG_DIR` and `CLAUDECODE` prefixes, `AWS_BEARER_TOKEN_BEDROCK`,
    `VERTEX_REGION_CLAUDE`), the Codex adapter's blocked prefixes (`CODEX_`, `OPENAI_`, `AZURE_`,
    `CHATGPT_`, so an inherited `OPENAI_API_KEY` cannot fund a Claude role's shell) and the inherited
    `CLAUDE_SECURESTORAGE_CONFIG_DIR` is absent or replaced, asserted in the environment the launched child process actually sees. Every Codex
    launch has `CODEX_HOME` equal to its scope, its operation root (private `HOME`, `XDG_*`,
    sqlite) under `<harness home>/codex`, and every variable in Codex's existing blocked set
    (including `OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, `CLAUDE_CODE_OAUTH_TOKEN`) removed. Readiness ran with the Build's own launch environment before any
    model launch. The switched selector does not change any later launch of the running Build.
    The owner record and tracking record name each binding (harness, scope name and path,
    runtime version). A Claude scope directory's file list is identical before and after a fake
    Build, and a Codex scope differs at most by the two deterministic files Kogen already
    maintains there (`environments.toml`, `agents/kogen_boundary.toml`), pre-seeded in the fixture;
    no credential file in either scope is created, copied, linked, moved, renamed or rewritten by
    Kogen, no Kogen code path invokes
    `security` or opens a credential file, and a marker written into one Build's harness home is
    absent from a second Build's launch environment and home. On a route whose Expert runs on the
    other harness, the frozen Expert assignment the Build hands the Developer
    (`Kogen.Harness.expert_environment/2`, variable `KOGEN_EXPERT`, which at 9ff7af6e carries only
    route, harness, model, effort and helpers) also carries the control root, the Candidate path,
    the Build's binding for the Expert's harness and the harness home, and `mix kogen.expert`
    refuses to launch when its cwd is not that Candidate. `mix kogen.expert`, run by
    the Developer from the Candidate, launches the Expert with cwd equal to the Candidate, that
    bound scope (never one re-resolved from the Candidate path) and its operation root or config
    dir under `<harness home>`. Every other Kogen Claude Code launch (Shape, `mix kogen.expert` outside a
    Build, login and status) sets
    `CLAUDE_SECURESTORAGE_CONFIG_DIR` equal to its `CLAUDE_CONFIG_DIR`, overriding an inherited
    value; all of them go through `Kogen.ClaudeCode.environment/2`. In the real fixture, the Build's Developer
    transcript (with its session id from the tracking record) exists under
    `<harness home>/claude/projects/` and not under the scope's `projects/`, the Developer
    completed a turn and a resume there, the tracking record's Claude binding names the scope
    path, and the Shape session's transcripts are under that scope's `projects/`.
  wrong_result: >-
    A private `HOME` is set for Claude Code and every role reports not logged in; a fresh
    `CLAUDE_CONFIG_DIR` is used without the secure-storage reference; the credential file or
    Keychain item is copied into the harness home; the scope is keyed on the Candidate path or
    re-resolved per launch so a mid-Build selector change switches logins; or an inherited empty
    `CLAUDE_SECURESTORAGE_CONFIG_DIR` is left in place and the personal login is used.
  verified_by: [check, live-shape-to-build]
  evidence: >-
    Offline: claude_code_management_test.exs asserts the environment of the Shape terminal, login
    and status launches (each with an inherited empty `CLAUDE_SECURESTORAGE_CONFIG_DIR` planted),
    harness_home_test.exs asserts the Build's Claude deltas and that the fake `claude auth status`
    readiness call receives the Build's own environment before the first model launch, and
    codex_environment_test.exs asserts the Codex deltas and operation-root location; fake-harness Builds record every
    launch's `HOME`, `CLAUDE_CONFIG_DIR`, `CLAUDE_SECURESTORAGE_CONFIG_DIR` and `CODEX_HOME`, flip
    the selector mid-Build, snapshot the scope directory's file list before and after, put a
    recording fake `security` first on PATH to assert it is never invoked by Kogen code, and run
    two Builds in sequence with a planted marker. Paid: live_shape_to_build_test.exs asserts the
    transcript locations and the binding named in `then`, using
    `RootProfileAudit.sessions_root/3` (project, role, route, as cross-harness-adversarial-roles
    left it), whose Claude branch must cover both the scope's `projects/` and the project's
    harness homes (`<workspaces-root>/<project-id>/harness/*/claude/projects`).
    harness_role_test.exs asserts the Expert assignment's extra fields, spawns `mix kogen.expert` as
    a real subprocess from a Candidate cwd with that assignment, and asserts from the fake harness's
    own environment receipt the bound scope, the harness home and the refusal from a wrong cwd. The
    task runs the Candidate's compiled Kogen code (the code under review, not the controller's), and
    inside a Build it runs within the Build's boundary, so code that ignored the binding still could
    not write outside the grants.
  proof:
    offline: [test/kogen/harness_home_test.exs, test/kogen/claude_code_management_test.exs, test/kogen/codex_environment_test.exs, test/kogen/root_profile_audit_test.exs, test/kogen/harness_role_test.exs]
    paid_target: live-shape-to-build
    paid_reason: >-
      provider-required: live-shape-to-build; observation: the managed Claude Code runtime
