# ("Keep it in #5"); scenarios role-write-boundary, write-boundary-fails-closed and
# codex-roles-inside-boundary added.
# Re-preflighted 2026-09-26 against main 9ff7af6e, where #1 (22a2db95), #2 (363c20af) and #4
# fortify-paid-verification (9ff7af6e, controller-owned verification) have landed.
# shaping-preflight-audit (#3) is parked and NOT landed; nothing here assumes it.
