    affected_paths: [lib/kogen/claude_code.ex, lib/kogen/codex.ex, lib/kogen/codex/environment.ex, lib/kogen/codex/state.ex, lib/kogen/harness.ex, lib/kogen/harness/claude.ex, lib/kogen/harness/codex.ex, lib/kogen/build.ex, lib/kogen/build/workspace.ex, lib/kogen/build/tracking.ex, lib/mix/tasks/kogen.expert.ex, test/kogen/harness_role_test.exs, test/kogen/harness_home_test.exs, test/kogen/claude_code_management_test.exs, test/kogen/codex_environment_test.exs, test/kogen/root_profile_audit_test.exs, test/kogen/live_shape_to_build_test.exs, test/support/root_profile_audit.ex, test/support/fake_claude, test/support/fake_codex, README.md, workflows/claude-code-runtime-upgrade.md, priv/kogen/test-reliability.yaml, priv/kogen/test-reliability-remediation.yaml]

- id: candidate-routing
  given: >-
    An admitted Build whose control checkout and Candidate hold different sentinel files, a
    Candidate edit that adds a proof selector file and changes a guarded path, a control-only
    edit to an ignored file, and a controller process whose cwd is a third directory.
  when: >-
    The controller runs the fresh Developer, its controller verification, the report, the review
    packet and Jev, an exact-session resume, and each fresh Reviewer.
  then: >-
    Every role launch (Claude and Codex adapters) has cwd and Git toplevel equal to the
    Candidate, and Codex trusts the Candidate as its project root. Candidate id, changed paths,
    guarded-path capture, proof-selector existence, report entries, review packet contents,
    citation snapshots, staging and commit are computed from the Candidate root passed
    explicitly: the Candidate-only selector counts as present and the control-only edit never
    appears. Lock, tracking record, verification context, state, history and receipts, prompts,
    route and config, and login-scope identity stay on the control root passed explicitly.
    `Harness.open`, `Harness.open_roles/3` (the route's per-role open from
    cross-harness-adversarial-roles), both adapters' `open`, `VerificationPolicy.preflight/2`,
    `VerificationPolicy.environment`, `GuardedPaths.capture`, `Git.changed_paths`,
    `VerificationPlan.load/build/missing_selectors` and `Build.Evidence.resolve` receive their root
    explicitly from Build (no `File.cwd!()` or `"."` default is used on any Build path), and a Build
    started from the third directory behaves identically: `mix kogen.build` is the only place that
    reads the process cwd, once, to find the control checkout (it must be a main worktree, not a
    linked one), and passes that control root to `Kogen.Build.run`; a test calls `Build.run` with an
    explicit control root from the third cwd, and an absent or non-checkout root fails before
    admission. This Intent makes these changes to the controller-owned verification that
    fortify-paid-verification landed (none of them exists at 9ff7af6e). The environment `Build`
    hands `Kogen.Build.Verification.run_cycle/4` and the persisted verification context both name
    `candidate_root` and `control_root`. The Candidate root is used for `make -C` through
    `Kogen.Build.VerificationRunner.run_target/4`, `CatalogChange.check`, `TargetEvidence.capture`
    and every later `TargetEvidence.verify` (settlement, state validation and publication read the
    Candidate root from the context, never `"."`). The control root holds the attempt's verification
    directory, so every receipt's, proof receipt's, base-suite receipt's and ledger diff's `log_path`
    or `path` is relative to control, and `Verification.settle`, `Ledger.verify` and the
    publication re-checks read them from control. `Kogen.Git.candidate_id`, the Report's changed
    paths and `Report.build`'s selector-existence predicate use the Candidate root; the
    `snapshot_references` citations resolve against the Candidate, while the tracking-record
    citation resolves against control. `Verification.project_root/1`'s `File.cwd!()` fallback is
    removed.
    GuardedPaths' snapshot of `.git/config` and `.git/info/exclude` resolves through Git
    (`git rev-parse --git-path`), because a linked worktree's `.git` is a file, and a change to
    control's `.git/config` during the Build is still detected. `VerificationPolicy.environment`'s
    `KOGEN_PROJECT_ROOT` names the Candidate, whose hook the PreToolUse guard runs.
    `KOGEN_TASK_CONTEXT` `working_directory` names
    the Candidate, and a new `control_root` field names control as an absolute path. Every
    control-side locator handed to a role (the task context's `tracking_path`, the Reviewer's
    review-packet path in the task context and the notes section, and the verification-failure
    prompt's retained receipt and log) is an absolute control path that opens from the Candidate
    cwd. The control-relative locators recorded in the record and inside the review packet (receipt
    `log_path`, ledger diffs, sidecars, the packet binding `path`) resolve against `control_root`.
    Ordinary citations are Candidate-relative; the tracking-record citation and
    `build-summary.json` `full_record.path` resolve from control. Review packets stay at
    control's `.kogen/runtime/scenario-tracking/<build-id>/review-packets/<n>.json`, and the
    record's packet `path` and record-version `sidecar` locators stay relative to control
    (today `ReviewPacket` and `Tracking` compute them from `File.cwd!()`; they take the control
    root explicitly), because the unedited Reviewer-rework support
    (`Kogen.ReviewPacketAudit.audit!/4`) asserts that exact layout.
  wrong_result: >-
    Roles run in the Candidate but the report says "no changes", or a missing selector looks
    present, because Git and file checks still read control; the Codex Reviewer trusts control
    and ignores the Candidate's project files; a fallback `File.cwd!()` hides a missing root; the
    controller runs `make` in the Candidate but writes receipts whose `log_path` is relative to the
    Candidate, so settlement looks for logs in the wrong tree; or the Reviewer and a resumed
    Developer get control-relative packet, record and log paths they cannot open from the Candidate.
  verified_by: [check]
  evidence: >-
    Each fake harness (`fake_claude*`, `fake_codex*`) writes, from inside the launched process,
    its `pwd -P` and `git rev-parse --show-toplevel` to a per-launch receipt under the Build's
    harness home (inside the role write boundary), so the assertion is on
    the OS process state, not on launch arguments or environment. The fake-harness lifecycle
    asserts those receipts, the report's changed paths, selector checks and packet against the
    Candidate-only sentinel, with a control-only sentinel as the negative control, and runs one
    Build from a third cwd whose own sentinel must never appear. It also asserts the review
    packet path and a record-version sidecar locator are control-relative. The fake roles open, from
    their own cwd, the `tracking_path`, review packet and failure-prompt receipt and log they were
    given, plus one receipt `log_path` from the packet joined to `control_root`, and record success
    in the receipt (fake_codex already reads `tracking_path` this way), together with the task
    context's `working_directory`, which must equal the Candidate. The controller-verification
    fixture settles and publishes a Build whose target emits a target-evidence frame, run from a
    third cwd, so capture and every later verify must use the recorded Candidate root.
    A controller-verification fixture whose Candidate `make check` fails asserts the receipt's
    `log_path` resolves under control's attempt directory and that settlement accepts it. A guarded
    paths case edits control's `.git/config` mid-Build and expects the stop.
  proof:
    offline: [test/kogen/build_workspace_test.exs, test/kogen/lifecycle_test.exs, test/kogen/controller_handoff_test.exs, test/kogen/harness_contract_test.exs, test/kogen/guarded_paths_test.exs, test/kogen/controller_verification_test.exs]
    paid_target: none
    paid_reason: >-
      offline-sufficient: fake-harness lifecycle with control and Candidate sentinels and a
      third-directory cwd control; the real-provider cwd is covered by same-candidate-rework
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/**, lib/kogen/git.ex, lib/kogen/harness.ex, lib/kogen/harness/**, lib/kogen/claude_code.ex, lib/kogen/codex.ex, lib/kogen/codex/**, lib/kogen/verification_policy.ex, test/kogen/build_workspace_test.exs, test/kogen/lifecycle_test.exs, test/kogen/controller_handoff_test.exs, test/kogen/harness_contract_test.exs, test/kogen/guarded_paths_test.exs, test/kogen/controller_verification_test.exs, test/support/**, priv/kogen/test-reliability.yaml, priv/kogen/test-reliability-remediation.yaml]

- id: controller-judges-candidate
  given: >-
    A fixture project whose control `make check` passes, and a fixture Intent whose
    `may_change_guarded_paths` includes `.codex/hooks/**`, so that the Developer's turn leaves the
    Candidate's `make check` failing and its copies of `.codex/hooks/check.sh`, `stop_runner.py` and
    `verification_policy.py` edited to always pass or allow. A second fixture Intent does not
    guard `.codex/hooks/**`.
  when: The Developer's turn ends and the controller settles verification.
  then: >-
    The parent controller runs `make check` and each selected target with cwd equal to the
    Candidate, records a failed receipt bound to the Candidate id, and resumes the same Developer
    session through the normal retry path. The tampered hook copies change no receipt or verdict.
    With the second fixture Intent the same tampering stops the Build on the guarded-path check
    before any verification, as today. Build calls `VerificationPolicy.preflight(targets,
    candidate_root)` with the Candidate root explicitly. The controller still runs every target
    through `Kogen.Build.VerificationRunner` (its own supervised child, outside every role's
    process tree). This Intent adds two environment rules to that runner (neither exists at
    9ff7af6e). The child and every role launch drop inherited `MIX_BUILD_PATH`, `MIX_DEPS_PATH` and
    `MIX_EXS`, so the Candidate's `make check` and a role's compile use the Candidate's own
    `deps/` and `_build/` and never control's. Unless the caller set one, the child's environment has `KOGEN_LIVE_LOG_DIR`
    equal to control's `.kogen/runtime/live-evidence`, so evidence that live owners retain for a
    Candidate Build is still in control after publication removes the worktree (a
    `git worktree remove` deletes the Candidate's ignored files). After this Intent's own Candidate,
    `.codex/hooks.json`, `.codex/hooks/**` and `priv/kogen/claude_code/settings.json` are
    byte-identical to the admission commit, and the registered PreToolUse command still equals
    the `@hook_command` main's controller compares against.
  wrong_result: >-
    The controller runs targets in control or in `File.cwd!()` and a failing Candidate passes on
    control's clean tree; or the Candidate rewrites the hook commands or Claude settings to
    "run from control", which main's controller then refuses at the next launch, as in Build
    cFnHwg7P2oNe1wMMnK7jxeMH; or live targets retain their evidence inside the Candidate, where
    publication silently deletes it.
  verified_by: [check]
  evidence: >-
    A controller test with a fixture whose control passes and Candidate fails asserts the failed
    receipt, the Candidate id and the resumed session, and repeats it with tampered Candidate hook
    copies. A fixture target that writes a marker under `$KOGEN_LIVE_LOG_DIR` must leave it in
    control's `.kogen/runtime/live-evidence` after the Build publishes and its Candidate is gone,
    and a caller-set `KOGEN_LIVE_LOG_DIR` must win. With `MIX_BUILD_PATH`, `MIX_DEPS_PATH` and
    `MIX_EXS` planted in the controller's environment and pointing into control, the child's
    environment lacks them and the compiled artifacts appear only under the Candidate's `_build/`.
    A byte-comparison test asserts the three hook and settings paths are unchanged from
    the admission commit and that the PreToolUse registration matches.
  proof:
    offline: [test/kogen/candidate_verification_test.exs, test/kogen/verification_policy_test.exs, test/kogen/verification_ownership_lifecycle_test.exs]
    paid_target: none
    paid_reason: >-
      offline-sufficient: the controller runs real Make targets in a fixture with a passing
      control and a failing, hook-tampered Candidate; the verdict path has no provider semantics
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/**, lib/kogen/verification_policy.ex, test/kogen/candidate_verification_test.exs, test/kogen/verification_policy_test.exs, test/kogen/verification_ownership_lifecycle_test.exs, test/support/**, priv/kogen/test-reliability.yaml, priv/kogen/test-reliability-remediation.yaml]

- id: same-candidate-rework
  given: >-
    A Build on the default route whose first controller verification fails and whose first Review
    requests rework.
  when: >-
    The controller resumes the exact Developer session for the failed verification, resumes it
    again for the Review finding, and a fresh Reviewer reviews the reworked Candidate.
  then: >-
    In the fake lifecycle, the Developer, both resumes and both Reviewers run with cwd equal to the
    same single Candidate and use the same harness home; no second worktree or harness home is
    created; both resumes carry the first session id; each Review is a new Reviewer session; and
    the outer-attempt and verification-retry counters equal those two_outer_resumptions_test
    expects today. In the real fixture Build (which exercises a controller-failed verification
    and its resume, not a Review rework), the Claude Code Developer's transcript records the
    Candidate path as its cwd for both the first turn and the resumed turn under one session id,
    the real Reviewer session on the default route's Reviewer harness (Claude Code while
    `default_route` is `claude`; Codex if a later Intent flips it) records the same Candidate cwd in
    its native session metadata, the fixture's main is
    fast-forwarded to the Intent commit, and no Candidate worktree or branch remains.
  wrong_result: >-
    Each outer attempt creates a new worktree and loses the Developer's edits; resume runs in
    another cwd or config dir where Claude Code cannot find the session; or the Reviewer reads
    control instead of the Candidate.
  verified_by: [check, live-shape-to-build]
  evidence: >-
    The fake lifecycle's per-launch receipts (written by the fake harness from inside each launched
    process: `pwd -P`, `CLAUDE_CONFIG_DIR`, session id) assert one Candidate, one harness home and
    one Developer session id across both resumptions and a distinct Reviewer session per Review,
    and the worktree list shows a single Candidate throughout. The live fixture's `KOGEN_WORKSPACES_ROOT` path contains a space; the live test
    reads the Candidate path from the tracking record's `candidate` block and asserts the cwd
    recorded in the Developer transcript (both turns) and in the Reviewer's native session equals
    it, plus the single Developer session id, controller receipts bound to the Candidate id, the
    final fixture HEAD, and that the worktree and branch are gone.
  proof:
    offline: [test/kogen/two_outer_resumptions_test.exs, test/kogen/lifecycle_test.exs, rehearse-live-shape-to-build]
    paid_target: live-shape-to-build
    paid_reason: >-
      provider-required: live-shape-to-build; observation: a real Claude Code Developer resumes
      its exact session in a Candidate worktree cwd after a controller-failed verification, the
