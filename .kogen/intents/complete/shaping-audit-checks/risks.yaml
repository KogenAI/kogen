- id: self-hosting
  scenario_ids: [audit-mirrors-build-admission, build-publishes-commit-subject]
  description: >-
    This Build runs under develop's controller. It edits lib/kogen/build/verification_plan.ex (additive
    proof_errors/4 only; build/4, load/1 and validate_declared_targets/2 unchanged, so qb's require_no_extra_targets/2
    hunk is not taken), lib/kogen/verification_policy.ex (additive controller_paths/0; preflight/2
    unchanged), lib/kogen/build.ex (Boundary export and the publication subject), lib/kogen/intent.ex (optional
    commit_subject) and lib/kogen/harness.ex (Boundary export). The Candidate compiles in its own worktree with its
    own _build (isolated-candidate-workspace), so the running controller never calls these edits and no preload is
    needed. The running controller's own build.ex predates this change, so this Build's publication commit carries
    the package title "Add the deterministic Shaping audit"; Builds after it lands use commit_subject. The Makefile, the
    catalog, .codex/** and priv/kogen/claude_code/settings.json are unchanged.
