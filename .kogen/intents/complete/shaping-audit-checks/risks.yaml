- id: tracking-record-shape
  scenario_ids: [audit-anchors-titles-and-history]
  description: >-
    Real records (.kogen/runtime/scenario-tracking/<build id>/record.json, schema_version 2) carry intent.id, status
    and attempts[].failure / attempts[].failure_signatures, and no top-level build_id or signature; the Build id is
    the directory name (verified on the 22 records present at 3531023d, and still written the same way at e65392cf,
    lib/kogen/build.ex:2129 and :2334; the failure-report.json beside them is not read), for example 5l_rANAlYz-dz30uKtZrRUGp and
    qVFqG3dab4TIDX15XK8izx5a with guard failures "Candidate changed paths outside Approved guards: ..."). The fixture
    writes records in that shape; reading any other shape is the fixture-specific shortcut lesson 27 names.
- id: materialization-ownership
  scenario_ids: [audit-mirrors-build-admission, audit-command-and-report]
  description: >-
    Each audit reads a private clone of HEAD plus the package, never the working tree, and removes it after every
    run. Tests assert no kogen-audit-* entry remains in System.tmp_dir!() after success, refusal and failure.
  ownership:
    - paths: <system temp>/kogen-audit-* (the HEAD plus package materialization)
      when_exists: Always new; a private 0700 directory per audit run.
      owner_after_creation: The running mix kogen.audit process.
      owner_during_operation: The deterministic checks read it; nothing writes to it after creation.
      permitted_mutation: None after the clone and the package copy.
      validation: The tests list System.tmp_dir!() before and after each run and compare.
      git_state: A git clone --local --no-checkout of the checkout with HEAD checked out and the package added; never pushed, never linked back.
      upgrade_behavior: Removed after every run, including failures and exceptions.
- id: report-ownership
  scenario_ids: [audit-command-and-report]
  description: >-
    Reports live only under .kogen/runtime/shaping-audits/, never in the package, because a report inside the package
    would change the revision it describes. A future write-containment boundary (BLD-12) must allow this path for
    Shaping sessions.
  ownership:
    - paths: .kogen/runtime/shaping-audits/<slug>/<revision>/report.json and report.md
      when_exists: Replaced atomically by a later audit of the same revision; other revisions' reports are kept.
      owner_after_creation: The local checkout; written only by mix kogen.audit.
      owner_during_operation: mix kogen.audit writes; --status, people and agents read.
      permitted_mutation: Written only by the audit's report writer.
      validation: schema_version, revision, HEAD and route are recomputed by --status; an unknown schema counts as missing.
      git_state: Ignored runtime data (.kogen/runtime/ is gitignored), never committed or published.
      upgrade_behavior: Slice 2 writes schema_version 2, so slice-1 reports become missing and are re-audited.
- id: codex-route-defects
  scenario_ids: [audit-mirrors-build-admission, audit-ledger-live-and-paid-rules, audit-anchors-titles-and-history, build-publishes-commit-subject]
  description: >-
    From Build qbOzahf8 and probe P1 (evidence/probe-candidate-at-3531023d/RESULT.md), for this slice's files: cycle 1
    failed mix format --check-formatted on lib/kogen/build/verification_plan.ex (run mix format before every turn
    end); the qb build.ex hunk lacks the publication subject (take Zuj hunk 2); the qb ledger rule and fixture use the
    removed ledger format; qb's prior-failures reads keys real records lack; qb marks ledger-row-update-unstated
    mechanical; qb's verification_plan.ex adds require_no_extra_targets/2 and its repository-invalid matches that
    message text with layer status ok; qb calls Kogen.ShapingAudit.Questions, which slice 1 now writes as a
    Dispositions-only parser (key reason); qb's commit-subject rule has no line check and its paid-path-unproven
    no prepare or proving-run branch. Starting from the qb hunks without these corrections fails tests A6, B1-B3,
    B5, C2, C4, C5 and E2, or does not compile. Probe P3 (evidence/probe-candidate-at-e65392cf/RESULT.md) shows the
    qb files pass format, compile --warnings-as-errors and credo --strict at e65392cf; keep them passing.
- id: developer-tmpdir-override
  scenario_ids: [audit-command-and-report]
  description: >-
    Build qVFqG3dab4TIDX15XK8izx5a stopped because the Developer ran TMPDIR=/var/folders/... mix test, and Mix wrote
    mix_lock_user501/ and mix_pubsub_user501/ into the Candidate. Never override TMPDIR (Kogen sets it to the granted
    kogen-build-<id> directory); compare paths in tests by canonicalizing both sides (realpath). Before ending a turn,
    git status --short must show no untracked path outside the guarded paths.
- id: gate-concurrency
  scenario_ids: [audit-command-and-report]
  description: >-
    The task tests spawn Kogen.IsolatedCase children and git fixture repositories. A failure that passes alone but
    fails under the whole offline gate is not a flake to dismiss (lesson 25): reproduce it under make check's
    concurrency and make it deterministic (wait on conditions, never on fixed sleeps; lesson 26).
