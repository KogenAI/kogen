  proof:
    offline: [test/kogen/harness_contract_test.exs, test/kogen/harness_args_test.exs, test/kogen/harness_verdict_test.exs, test/kogen/codex_compatibility_preparation_test.exs, test/kogen/intent_test.exs, test/kogen/offline_stage_results_test.exs]
