  verified_by: [check]
  evidence: Intent reader test for the flat shape message plus a public fake Shape/Build route asserting zero fake-harness launches.
  proof:
    offline: [test/kogen/intent_test.exs, test/kogen/build_preconditions_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: public Build precondition consumer with zero-launch control"
    affected_paths: [lib/kogen/intent.ex, lib/kogen/build.ex, lib/mix/tasks/kogen.shape.ex, test/kogen/intent_test.exs, test/kogen/build_preconditions_test.exs]

