- id: no-silent-fallbacks
  given: 'A routes config and fake harness executables, with KOGEN_HARNESS set and unset'
  when: 'Kogen code is asked to launch or dispatch without a launch context, with a context or config lacking harness, with an unknown harness name, with a Codex context, with KOGEN_HARNESS set while the selected route is claude, or with a Codex compatibility/discovery config lacking the shaping model'
  then: 'Contextless launch/resume calls no longer exist (no context default) and nothing re-reads config after session start; Codex selections and contexts carry harness codex explicitly; dispatch accepts only claude and codex and fails loudly naming the value otherwise; KOGEN_HARNESS only replaces the selected route harness executable (a claude route stays on the Claude adapter); the execution policy renders from the explicit harness; discovery fails on a missing shaping model; the routes parser has no defaulted keys; every live test owner compiles against the changed signatures because the check test stage runs with --warnings-as-errors, so a stale call in an excluded live owner fails check'
  wrong_result: 'A missing or unknown harness, a harness-less context, or merely setting KOGEN_HARNESS quietly selects Codex; adapter(nil) survives and re-reads default_route; discovery.py still writes gpt-5.6-sol; a route missing a helper is filled with an empty or inherited profile; a live owner still calls a removed Kogen.Harness arity and check passes because excluded tests only warn'
