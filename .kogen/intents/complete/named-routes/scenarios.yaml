- id: routes-config-resolves
  given: A .kogen/config.yaml with default_route, two structurally valid routes (one claude, one codex) and top-level outer_resumptions and verification_retries
  when: Kogen resolves the configuration with no route requested and again with each route name
  then: With no route requested it resolves default_route; each name resolves that route's harness and every shaping/developer/reviewer/helper model and effort; the global retry values apply to every route; a missing or unknown default_route, a route missing a role/helper or its model/effort, or a nonblank-string violation is refused before any launch with a config error naming the offending key path
  wrong_result: Retries are looked up inside routes; a missing default_route silently picks the first route; a structurally broken unselected route is ignored until selected; roles from two routes are mixed
  verified_by: [check]
  evidence: Focused Intent config tests over valid and table-driven malformed route configs, asserting the resolved map and exact error key paths.
  proof:
    offline: [test/kogen/intent_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: Intent config reader consumer with malformed-route controls"
    affected_paths: [lib/kogen/intent.ex, test/kogen/intent_test.exs, test/support/compiled_fixture.exs]

- id: flat-config-refused
