      - lib/kogen/shaping_audit.ex
      - lib/mix/tasks/kogen.audit.ex
      - priv/kogen/shaping_audit/stop_hook.sh
      - README.md
      - test/kogen/shaping_audit_hook_test.exs
      - test/kogen/shaping_audit_flow_test.exs
      - test/kogen/shaping_audit_task_test.exs
