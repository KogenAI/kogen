- id: shaping-flow-prompts-and-codex-launch
  given: >-
    The three Shaping prompts `priv/kogen/prompts/shaping.md`, `shaping-continuation.md` and `shaping-fresh.md`, which
    must state the process of INTENT.md "How Shaping must go" (directions 1-37). `mix kogen.shape` launches the Codex
    Shaper through `test/support/fake_codex_shaper` (behind a test-written wrapper that records the `KOGEN_*`
    environment), via `Kogen.CompiledFixture.mix_task!/3` with `{"KOGEN_ROLE", nil}` and `{"KOGEN_HARNESS_HOME", nil}`.
    The Developer, Reviewer, Expert and auditor argv come from `Kogen.Harness.Codex.developer_args/2`,
    `reviewer_args/2`, `expert_args/2` and `auditor_args/2` (`codex.ex:56`, `:143`, `:254`, `:216`). The Claude Shaper
    launch through `test/support/fake_claude_shaper` is the unchanged comparison.
  when: >-
    The prompts are rendered for a fresh and a continued Shape. Each launch's argv, environment and helper
