# Slice 3 of 5 of shaping-quality (INTENT.md), offline, re-preflighted at dece3e84 on the landed slices 1 (6b4376e9)
# and 2 (3962af8b). Offline proofs run the REAL landed layers through the audit-only fakes: Kogen.ShapingAudit.Fixture
# (repo!/1, add_draft!/3, audit_env!/1), KOGEN_HARNESS=test/support/shaping_audit/fake_auditor (FAKE_AUDITOR_MESSAGE),
# KOGEN_JEV_TRANSPORT=fake_jev_audit (FAKE_JEV_ANSWERS, set after audit_env!/1), the fixture drafts complete
# (id 01965000-0000-7000-8000-00000000c001) and proof-defects (…d001), and the flow packages of
# test/support/shaping_audit/packages/flow (slug flow-demo, id 018f2a3b-0000-7000-8000-000000000003) on the flow
# checkout (flow_checkout!/0, copied from test/kogen/shaping_audit_flow_test.exs:56-64 into the hook test). No
# `layers:` injection: the landed audit/2 has none. Expected values below are probe P3's
# (evidence/probe-preflight-dece3e84/RESULT.md). Plus test/support/shaping_audit/fake_mix and the recorded Codex
# 0.156.1 rollouts test/support/shaping_audit/hook/{root,helper}-rollout.jsonl. That a real Codex TUI runs the
# -c Stop hook and continues the same turn on a block is evidence/probe-codex-stop-hook-tui/RESULT.md.
# Build-session environment: every test that runs the audit, the hook, stop_hook.sh, mix kogen.shape or a Python
# process clears KOGEN_ROLE and KOGEN_HARNESS_HOME or sets them explicitly (INTENT.md "Build-session environment").
# No paid target: every scenario is proved by check. The live proof is shaping-evaluation-live's, which lands next.
# Each scenario's `tests` key lists the tests to write, named exactly as given; the ledger binds rows by test name.
# No catalogued test is renamed or deleted. A test that only checks an exit status, a count or a substring, where
# exact values are listed, does not prove the scenario.
- id: stop-hook-decides-every-stop
  given: >-
    `Kogen.ShapingAudit.main(["--stop-hook"], root: root, env: env, stdin: payload, clock: clock)` in fixture
    checkouts (`Fixture.repo!/1` with `complete` or `proof-defects`, or the flow checkout with a flow package), under
    `use Kogen.IsolatedCase`. `env` is `Fixture.audit_env!(root)` (which deletes `KOGEN_ROLE`, `KOGEN_HARNESS_HOME`
    and `FAKE_JEV_ANSWERS`) merged with `KOGEN_ROLE=shaper`, `KOGEN_SHAPING_INTENT_ID`, `KOGEN_SHAPING_ROUTE=codex`,
    `KOGEN_SHAPING_LAUNCH_ID` (a UUIDv7 stamped T − 120 000 ms), `KOGEN_SHAPING_SKIP_KEY=k1` and
    `KOGEN_SHAPING_HOOK_OUTPUT`. `clock` returns `DateTime`s: T, then T + 1 500 ms, per audited stop. `payload` is ""
    unless stated. The cases:
    - no package;
    - draft-scope blocking findings;
    - the same revision stopped again;
    - nine successive revisions, each still blocking;
    - only an environment problem (route `other`, which has no auditor setting);
    - a ready package;
    - the package in `approved/`;
    - the lock present;
    - `KOGEN_ROLE=developer`;
    - an exception inside the audit, and a symlink in the package;
    - two auditor runs with open blocking findings (the bound);
    - a chain whose first block is stamped 40 minutes ago, on a non-complex and on a complex Draft;
    - a presented (allowed) stop followed by a new block;
    - the eight slice-2 flow packages;
    - a helper-thread payload (`transcript_path` = helper-rollout.jsonl) and a root payload (root-rollout.jsonl);
    - `--stop-hook` with a slug or another flag.

    The flow cases use `flow_checkout!/0`, a private copy in `shaping_audit_hook_test.exs` of
    `shaping_audit_flow_test.exs:56-64`.

    Separately, `priv/kogen/shaping_audit/stop_hook.sh` runs through `System.cmd("sh", [script], cd: root, env: …)`
    with `{"KOGEN_HARNESS_HOME", nil}`, `{"KOGEN_ENV_RESTORE_PENDING", nil}`, an explicit `KOGEN_ROLE`,
    `PATH=/usr/bin:/bin` (no Python 3.11, no Elixir) and `KOGEN_SHAPING_TOOLCHAIN_PATH` naming a directory holding
    the fake `mix` (a copy of fake_mix) and a `python3` link to the test VM's Python 3.11+:
    - with a non-shaper role;
    - with the fake `mix`;
    - twice on an unchanged package;
    - after a same-size byte edit, and after a new commit;
    - with a symlink in the package;
    - with `KOGEN_ENV_RESTORE_PENDING=1` and a fake `environment.py`.

    `mix kogen.audit <slug>`, `--auditor <slug>` and `--status <slug>` run under `KOGEN_ROLE=shaper` without
    `KOGEN_SHAPING_HOOK_OUTPUT`.
  when: >-
    Each case runs once, and the output file, `hook.jsonl`, `hook-state.json`, `report.json` and the fake auditor's
    log directory are read.
  then: >-
    The entry returns 0 and writes exactly one JSON decision to the output file (INTENT.md "Hook decisions" has the
    exact texts):
    - no package, lock, non-shaper role or helper thread: `{"continue":true}`, with no audit and nothing under
      `.kogen/runtime/shaping-audits/`;
    - blocking: `{"decision":"block","reason":…}`, at most 16 384 bytes, listing each open blocking finding id with
      its route and message, then `advisory: <n>`, and `report: <path>` last;
    - the same revision again: `{"continue":true}`, kind `stalled`;
    - nine revisions: blocks 1-8, and the ninth is allowed with "not ready after 8 blocks in this chain; allowing the
      stop to avoid a trap.", kind `block-limit`;
    - environment only: `{"continue":true,"systemMessage":"not ready: environment — route other has no auditor
      setting"}`, and no auditor launch;
    - ready: allowed with the presented summary (report path, elapsed, every `## Assumed` and `## Left undecided`
      entry, the "Not audited by the auditor" list), kind `ready`;
    - approved: audited the same way;
    - the root payload is audited;
    - exception or refusal: allowed, naming the error and `mix kogen.audit <slug>`, kind `error`; never cached
      (`hook-state.json` `skip_key` and `decision` null after it), so the next stop audits again;
    - bound reached: allowed with exactly "not ready: auditor bound reached; 3 blocking findings remain (<ids>)",
      kind `auditor-bound`. A later stop on another revision at the same HEAD is allowed the same way, and the fake
      auditor ran exactly twice;
    - flow packages: a clean asking revision is allowed as exactly `{"continue":true}`, kind `asking`. A technical
      entry, a missing Evidence and an Assumed entry without Undo each block. A second round is allowed. Not-ready
      blocks. Left-undecided and ready are allowed with the summary.

    The hook launches the auditor only through the landed `auditor: true` (slice 2's bound). There are no
    time-based decisions: the 40-minute chain decides by content exactly as a fresh chain does, and records
    `chain_ms == 2 400 000` and `complex` (false, then true). A presented stop records the chain it ends
    (`chain_ms == 2 400 000`) and clears it; the next block starts a new chain (`chain_ms == 0` with the injected
    clock). The state after each kind follows INTENT.md "The chain": `stalled` clears `chain_start` and keeps
    `chain_blocks`. `report.json` `elapsed` holds `launch_ms` (decoded from the
    UUIDv7 launch id, or null otherwise), `chain_ms`, `audit_ms`, `audit_total_ms`, `budget_ms` (900 000, or
    1 800 000 when complex) and `complex`. `hook.jsonl` holds one line per audited decision with the same `elapsed`
    plus `kind`, `revision` and `decision`.

    stop_hook.sh:
    - it allows a non-shaper role without starting mix;
    - it re-executes through environment.py;
    - it runs the fake mix found through `KOGEN_SHAPING_TOOLCHAIN_PATH`, from the repository root;
    - it serves the second, unchanged run from `hook-state.json` without starting mix (the fake mix log has one
      entry);
    - a same-size byte edit and a new commit each re-run the audit;
    - a symlink skips the cache (the audit then refuses it).

    `.codex/hooks/check.sh`, run as `KOGEN_ROLE=shaper`, prints `{"continue":true}`. Inside a Shaping session every
    manual form audits nothing, prints the two status lines, launches no fake auditor, and exits 1 without a hook
    report and 0 when the newest hook report is ready.
  wrong_result: >-
    Any of these:
    - every stop is blocked, or the same revision is blocked forever;
    - the hook keeps blocking after the auditor bound is used up (the run-4 failure);
    - the chain clock counts the Shaper's thinking time or never resets, or an allowed stop records `chain_ms` 0
      for the chain it ends (qb's computation after the reset);
    - a stalled stop resets the block count, so a chain that alternates blocks and stalls is never escaped;
    - any decision depends on elapsed time;
    - the hook runs on the harness shell's Python and fails ("Python 3.11 or newer is required");
    - environment findings or a crash block;
    - a helper thread's stop is audited;
    - `--stop-hook` under `KOGEN_ROLE=developer` or with the lock present exits 2 instead of allowing;
    - the skip key ignores HEAD or bytes, or caches a block or an error;
    - a truncated block reason loses its `report:` line;
    - a manual audit inside Shaping launches the auditor or writes a report;
    - a test inherits the Developer's `KOGEN_ROLE` or `KOGEN_HARNESS_HOME` and passes or fails because of it;
    - `launch_ms` read from `System.system_time/1` instead of the injected clock;
    - the block-limit or summary text differs from INTENT.md (qb's "allowing to avoid a trap. ", "m" units, blank
      lines, a "Disputed" block, omitted "none" lines), or `{:error, reason}` is shown as `inspect(reason)`;
    - a smoke test that only checks the exit status or one substring of a decision;
    - fixture shortcuts: matching the fixture slug instead of reading KOGEN_SHAPING_INTENT_ID, injecting fake layers
      instead of running the landed audit through the audit-only fakes, or a stop_hook.sh test that primes
      `hook-state.json` with a key the script never computed.
  verified_by: [check]
  evidence: >-
    test/kogen/shaping_audit_hook_test.exs (H1-H24, H27, H28), test/kogen/shaping_audit_flow_test.exs (H25) and
    test/kogen/shaping_audit_task_test.exs (H26 and the changed approved-only test).
  tests:
    - >-
      H1 "no package: {\"continue\":true}, no audit": `complete` added, KOGEN_SHAPING_INTENT_ID
      "01965000-0000-7000-8000-00000000ffff". Assert the decision == %{"continue" => true}, and that neither
      `.kogen/runtime/shaping-audits` nor FAKE_AUDITOR_LOG_DIR exists.
    - >-
      H2 "blocking findings block, naming the finding, its route, the advisory count and the report path":
      `proof-defects`. Assert the decision's keys are exactly ["decision", "reason"], "decision" == "block", and the
      open blocking ids in report.json are exactly, in order, "unguarded-affected-path lib/unguarded.ex",
      "proof-selector-missing test/gone_test.exs", "proof-selector-missing test/stray_test.exs",
      "unsupported-selector test/a_test.exs:3", "unsupported-selector test/**", "unsupported-selector
      /abs/x_test.exs", "unsupported-selector ../x_test.exs", "paid-reason-malformed not a valid reason" and
      "unknown-target live-extra". Assert reason == "blocking findings:\n" <> one "- <id> (route: none): <message>"
      line per finding (from report.json) <> "\nadvisory: <n>\nreport: <root>/.kogen/runtime/shaping-audits/
      proof-defects/<revision>/report.json". hook.jsonl has one line: kind "blocked", decision "block",
      chain_blocks 1, blocking == the nine ids. hook-state.json: last_was_block true, decision nil, skip_key nil,
      chain_blocks 1. FAKE_AUDITOR_LOG_DIR does not exist (the auditor layer is "skipped").
    - >-
      H3 "a block reason with many findings stays within 16 KiB": `Kogen.ShapingAudit.StopHook.block_reason/3`
      (public, @doc false) on 60 open blocking findings "f-01".."f-60" (route nil, message 400 × "x"), advisory 2,
      path "/r/report.json": byte_size == 16 173, lines f-01..f-38, then "- … 22 more blocking findings in the
      report", "advisory: 2", and "report: /r/report.json" last. On the first three findings it returns the
      untruncated "blocking findings:\n- f-01 (route: none): x…\n- f-02 …\n- f-03 …\nadvisory: 2\nreport:
      /r/report.json" exactly.
    - >-
      H4 "the same revision stopped again is allowed and recorded as stalled": `proof-defects` twice, no edit. The
      second decision == %{"continue" => true}; hook.jsonl kinds == ["blocked", "stalled"] and chain_blocks
      [1, 1]; hook-state.json chain_start nil and chain_blocks 1. A third stop after an INTENT.md edit blocks with
      chain_blocks 2 (the stall kept the count).
    - >-
      H5 "nine successive revisions block one to eight and allow the ninth": `proof-defects`, writing INTENT.md with
      "revision <i>\n" before stops 2-9. Kinds == 8 × "blocked" (chain_blocks 1..8) then "block-limit"; the ninth
      decision is %{"continue" => true, "systemMessage" => "not ready after 8 blocks in this chain; allowing the
      stop to avoid a trap.\n" <> <that revision's block reason>}; hook-state.json chain_blocks 0, chain_start nil.
    - >-
      H6 "only an environment finding is allowed, naming the fix": `complete` with KOGEN_SHAPING_ROUTE=other. The
      decision == %{"continue" => true, "systemMessage" => "not ready: environment — route other has no auditor
      setting"}; kind "environment"; report layers.auditor.status "unavailable"; FAKE_AUDITOR_LOG_DIR does not
      exist.
    - >-
      H7 "a ready package is allowed with the presented summary (report path, elapsed, Assumed, Left undecided, not
      audited)": the flow `ready` package on flow_checkout!/0, FAKE_AUDITOR_MESSAGE=empty. The decision ==
      %{"continue" => true, "systemMessage" => "ready: <report.json path>\nelapsed: launch 2.0 min, chain 0.0 min,
      audit 0.0 min (total 0.0 min), budget 15.0 min\nAssumed:\n- The button keeps its current size. Reason: the
      Shaper asked only about colour. Undo: resize it in a follow-up Intent.\nLeft undecided:\n- Whether to support
      dark mode. Recommendation: defer, revisit after v1.\nNot audited by the auditor: none"}; kind "ready";
      hook-state.json decision == that map, skip_key "k1", last_revision == the report's revision. Minutes are
      `:erlang.float_to_binary(ms / 60_000, decimals: 1)` (121 500 ms → "2.0").
    - >-
      H8 "an approved package is audited the same way": `complete` with dir: "approved". Kind "ready", and
      report.json "package" == ".kogen/intents/approved/complete". H9 "the lock present is allowed with no audit"
      (`.kogen/build.lock` written; `complete`), and H10 "KOGEN_ROLE=developer is allowed with no audit": each
      decision == %{"continue" => true}, main returns 0 (not the audit's refusal 2), and
      `.kogen/runtime/shaping-audits` does not exist.
    - >-
      H11 "a Codex helper thread's Stop event is allowed with no audit" (payload
      {"session_id":"s","transcript_path":<absolute helper-rollout.jsonl>,"stop_hook_active":false}: decision
      %{"continue" => true}, no shaping-audits directory), and H12 "a Codex root's Stop event is audited normally"
      (root-rollout.jsonl, `complete`: kind "ready").
    - >-
      H13 "an exception inside the audit is allowed, naming the error and mix kogen.audit <slug>": `complete` with
      `read: fn _ -> raise "boom" end` gives %{"continue" => true, "systemMessage" => "shaping audit error: boom;
      run mix kogen.audit complete"} and a hook.jsonl kind "error"; with `File.ln_s!("intent.yaml", <package>/
      evil-link)` instead it gives "shaping audit error: refusing non-regular package entry: evil-link; run mix
      kogen.audit complete". `Kogen.ShapingAudit.error_text/1` returns "m" for {:ambiguous, "m"} and
      {:not_found, "m"}, "refusing non-regular package entry: p" for {:non_regular, "p"}, and "mix kogen.audit
      failed: :boom" for :boom; the landed task tests of those refusals pass unchanged. An error is never cached:
      a first stop on `complete` (KOGEN_SHAPING_SKIP_KEY "k1") is kind "ready" and leaves hook-state.json skip_key
      "k1" and a non-nil decision; a second stop with the same "k1" and `read: fn _ -> raise "boom" end` is kind
      "error" and leaves hook-state.json skip_key nil and decision nil (chain_start and chain_blocks as before it);
      hook.jsonl kinds == ["ready", "error"]. And stop_hook.sh, run as in H19 on an unchanged package with
      hook-state.json holding H19's logged skip key and "decision": null, starts the fake mix again (a second argv
      line) instead of printing a stored decision.
    - >-
      H14 "an auditor bound reached with open blocking findings is allowed with the exact message, kind
      auditor-bound, never blocked again on later stops": `complete`, FAKE_AUDITOR_MESSAGE=three-findings (put after
      audit_env!/1), INTENT.md appended between stops. Stop 1: kind "blocked" with the three auditor ids (route
      "shaper"). Stop 2: %{"continue" => true, "systemMessage" => "not ready: auditor bound reached; 3 blocking
      findings remain (<id1>, <id2>, <id3>)"}, kind "auditor-bound", layers.auditor.bound_reached true. Stop 3: the
      same message and kind. Exactly two files under auditor/*.json.
    - >-
      H15 "a chain whose first block is stamped 40 minutes ago decides by content only and records chain_ms and
      complex": `proof-defects`, a constant clock T, hook-state.json primed (chain_start T − 2 400 000, chain_blocks 1,
      last_revision 64 × "0", last_was_block true). The decision equals H2's; hook.jsonl elapsed chain_ms 2 400 000,
      complex false, budget_ms 900 000, chain_blocks 2. The same with eleven files evidence/e01.md..e11.md added:
      a block with the same nine ids, complex true, budget_ms 1 800 000.
    - >-
      H16 "a presented stop followed by a new block resets the chain clock": the flow `ready` package on
      flow_checkout!/0, a constant clock T, hook-state.json primed (chain_start T − 2 400 000, chain_blocks 3). Stop 1: kind "ready", hook.jsonl chain_ms
      2 400 000, then hook-state.json chain_start nil and chain_blocks 0. questions.md is then replaced by the flow
      `assumed-without-reason` questions.md. Stop 2: kind "blocked", blocking ["assumption-without-reason 1"],
      chain_ms 0, chain_blocks 1.
    - >-
      H17 "elapsed fields are recorded in report.json and hook.jsonl and never decide": on H7's stop, report.json
      elapsed == %{"launch_ms" => 121500, "chain_ms" => 0, "audit_ms" => 1500, "audit_total_ms" => 1500,
      "budget_ms" => 900000, "complex" => false} and hook.jsonl's elapsed is the same map. With launch id
      "not-a-uuid", and with the UUIDv4 "0190a6b2-8c3e-4f00-8000-000000000000", launch_ms is nil. `proof-defects`
      stopped once, its shaping-audits directory removed, then stopped again with a clock 36 000 000 ms later
      returns the identical decision.
    - >-
      H18 "stop_hook.sh allows non-shaper roles without starting mix": KOGEN_ROLE=developer gives stdout
      "{\"continue\":true}\n", exit 0, and no fake mix log.
    - >-
      H19 "stop_hook.sh puts KOGEN_SHAPING_TOOLCHAIN_PATH first on PATH and runs the fake mix": KOGEN_ROLE=shaper,
      `complete`, KOGEN_FAKE_MIX_DECISION {"continue":true,"systemMessage":"fake"}. Stdout is that decision; the log
      has exactly one "argv:kogen.audit --stop-hook" line, its "PATH:" value starts with "<toolchain dir>:", and its
      KOGEN_SHAPING_SKIP_KEY is "<git rev-parse HEAD>:<64 hex digits>".
    - >-
      H20 "stop_hook.sh serves an unchanged package from hook-state.json without starting mix again": after H19,
      hook-state.json is written with the logged skip key and decision {"continue":true,"systemMessage":"cached"}.
      The second run prints "{\"continue\": true, \"systemMessage\": \"cached\"}\n" (json.dumps) and the log still
      has one argv line.
    - >-
      H21 "a same-size byte edit and a new commit each re-run the audit": replacing "feature" with "featurE" in
      intent.yaml's title gives a second argv line with a different key; `git commit --allow-empty` (author and
      committer set in env) gives a third, whose key starts with the new HEAD.
    - >-
      H22 "a symlink in the package skips the cache and is refused": with a link `evil-link` added and
      hook-state.json primed with the key of H20, the fake mix runs again with an empty KOGEN_SHAPING_SKIP_KEY (the
      refusal text is H13's).
    - >-
      H23 "stop_hook.sh re-execs through environment.py when KOGEN_ENV_RESTORE_PENDING=1": the script copied to
      <tmp>/priv/kogen/shaping_audit/stop_hook.sh, and <tmp>/.codex/hooks/environment.py appends "restored\n" to
      RESTORE_LOG and execs its argv without KOGEN_ENV_RESTORE_PENDING. With KOGEN_ROLE=developer, stdout is
      "{\"continue\":true}\n" and RESTORE_LOG == "restored\n".
    - >-
      H24 ".codex/hooks/check.sh under KOGEN_ROLE=shaper prints {\"continue\":true}": `System.cmd("sh",
      [".codex/hooks/check.sh"], env: [{"KOGEN_ROLE", "shaper"}, {"KOGEN_HARNESS_HOME", nil},
      {"KOGEN_ENV_RESTORE_PENDING", nil}])` == {"{\"continue\":true}\n", 0}.
    - >-
      H25 "the hook decides each flow package as front-loaded-questions requires" (shaping_audit_flow_test.exs, on
      its flow_checkout!): asking-no-answers and asking-second-round give exactly %{"continue" => true}, kind
      "asking"; asking-technical (FAKE_JEV_ANSWERS {"gate": ["technical", 1.0]}, put after audit_env!/1) blocks
      with ["technical-question-to-shaper 1", "technical-question-to-shaper 2"], route "controller";
      asking-no-evidence blocks with ["recommendation-without-evidence 1"]; assumed-without-reason blocks with
      ["assumption-without-reason 1"]; not-ready blocks with ["unguarded-affected-path lib/demo.ex"];
      left-undecided and ready are allowed, kind "ready".
    - >-
      H26 "inside a Shaping session a manual run audits nothing and prints the hook status"
      (shaping_audit_task_test.exs): `complete`, KOGEN_ROLE=shaper, no KOGEN_SHAPING_HOOK_OUTPUT. For ["complete"],
      ["--auditor", "complete"] and ["--status", "complete"]: output lines == ["Inside a Shaping session the Stop
      hook audits the Draft at every stop: end your turn to re-audit", "last hook report: missing"], exit 1, no
      shaping-audits directory, no FAKE_AUDITOR_LOG_DIR. After one `--stop-hook` stop (ready), ["complete"] prints
      the same first line and "last hook report: ready (revision <revision>)", exits 0, and there is still exactly
      one report.json and one fake auditor launch. The landed test "an approved-only package and the Shaper role run
      normally" becomes "an approved-only package runs normally" and keeps only its approved-only half (exit 0).
    - >-
      H27 "the README documents the Stop hook and the inside-Shaping status": on README.md with whitespace
      compacted first (`Regex.replace(~r/\s+/, readme, " ")`; HEAD splits "it does not run as a / Shaper Stop hook"
      across `:1018-1019`, so a raw refute would pass with the sentence kept), it contains "mix kogen.audit
      --stop-hook" and "Inside a Shaping session the Stop hook audits the Draft at every stop", and contains
      neither "it does not run as a Shaper Stop hook" nor "The auditor is launched only when". The landed README
      test passes unchanged.
    - >-
      H28 "--stop-hook takes no slug and no other flag": main(["--stop-hook", "complete"]) and main(["--stop-hook",
      "--auditor"]) return 2 and print the usage line "usage: mix kogen.audit [--route <name>] [--auditor] <slug> |
      mix kogen.audit --status [--route <name>] <slug> | mix kogen.audit --stop-hook"; no output file is written.
  proof:
    offline: [test/kogen/shaping_audit_hook_test.exs, test/kogen/shaping_audit_flow_test.exs, test/kogen/shaping_audit_task_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: the landed audit layers run for real through the audit-only fakes, the fake mix and recorded Codex rollouts; that a real Codex TUI runs the -c Stop hook and continues the same turn on a block is retained evidence (evidence/probe-codex-stop-hook-tui), and the live run is shaping-evaluation-live's"
    affected_paths:
