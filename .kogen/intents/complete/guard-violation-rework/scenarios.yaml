- id: shared-git-files-do-not-stop
  given: >-
    Fixture Builds whose test process, while the fake Developer waits (WorkspaceFixture.waiting_role!/await_waiting!),
    appends `[branch "develop"]\n\tvscode-merge-base = origin/main` to control's .git/config and a line to control's
    .git/info/exclude (lessons 19, 22): (a) the waiting role wraps fake_stray_writer_role writing only `stray.txt`, and
    the exclude line is `/no-such-path` (so a rework turn follows); (b) the exclude line is `/hidden.txt` and
    `FIXTURE_DEV_EDIT` creates the new, nonvolatile, unguarded Candidate file `hidden.txt`; (b2) the same with
    `hidden.txt` guarded (`create!(guards: ["dummy.txt", "hidden.txt"])`); (c) only .git/config is changed and the
    released role is a failing role (`exit 3`, reaching `settle_transport_failure/4`); and in guarded_paths_test, a
    Candidate `.gitmodules` edit.
  when: The Developer turn ends.
  then: >-
    (a) The Build is not stopped: after the rework turn the attempt's environment_events has exactly one
    `%{file, before, after}` per changed file (two entries, none repeated by the rework handoff), verification and
    Review run, and the Build is accepted. (b), (b2) The Build stops after the first turn with category `git-policy` and
    "Control's .git/info/exclude changed the ignored state of Candidate paths: hidden.txt", with both events recorded.
    (c) The Build stops with today's "harness failure during Developer turn" message (not the config message) and the
    attempt's environment_events holds the .git/config event. The `.gitmodules` edit still stops as `git-policy`.
  wrong_result: >-
    The outside write stops the Build, an event is reported twice, a file hidden by the new exclude rule (guarded or
    not) is not reported, the failed turn loses its event or crashes, or a Candidate-owned policy change no longer stops.
  verified_by: [check]
  evidence: Test-process writes during a waiting role.
  proof:
    offline: [test/kogen/guard_violation_rework_test.exs, test/kogen/guarded_paths_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: real git fixture"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/guarded_paths.ex, test/kogen/guard_violation_rework_test.exs, test/kogen/guarded_paths_test.exs, test/support/fake_stray_writer_role]

