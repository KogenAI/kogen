- id: reviewer-sees-guard-violations
  given: >-
    The stray-file-reworked fixture with a fake Reviewer that records its review packet, and a fixture Build with no
    guard rework; and in review_packet_test, a record whose latest attempt has two `guard_violations` entries of 5,000
    distinct 200-byte paths each, with notes and handoff larger than the first profile's caps, and a record whose one
    entry lists three paths.
  when: Review runs, or ReviewPacket.build/1 runs on the records.
  then: >-
    The first packet's top-level `guard_violations` holds one object: `cycle`, `path_count` 3, `paths` exactly the
    three listed paths in order, `sha256`, `byte_count` and `locator` `/attempts/0/guard_violations/0/paths`, no
    `truncated` and no `omitted` item for it; the second packet's is `[]`. For the large record the packet is at most
    `ReviewPacket.limit/0` (65,536) bytes; each object has `path_count` 5000, `"truncated": true`, `paths` a proper
    prefix of the record's list with no path cut, `sha256` and `byte_count` equal to those of the full list's canonical
    JSON (`ReviewPacket.encode/1`), and a `locator` that resolves in the record to the full list; `omitted` holds one
    `truncated` item per entry with field `/guard_violations/<k>/paths`. The three-path record inlines all paths.
    review_packet_test's exact key set includes `guard_violations`, and priv/kogen/prompts/reviewer.md says what the
    field means (paths the controller made the Developer delete or restore; a truncated list is complete at its
    locator; not a finding, not verification).
  wrong_result: >-
    Reworked paths are invisible to the Reviewer, the key is missing when empty, a large path list makes the packet
    exceed 65,536 bytes or fail to build, a path is cut or silently dropped without a digest-bound locator, or the
    Reviewer is not told what it means.
  verified_by: [check]
  evidence: Recorded packet; the large-record packet bytes.
  proof:
    offline: [test/kogen/guard_violation_rework_test.exs, test/kogen/review_packet_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: fake Reviewer"
    affected_paths: [lib/kogen/build/review_packet.ex, lib/kogen/build.ex, test/kogen/guard_violation_rework_test.exs, test/kogen/review_packet_test.exs, priv/kogen/prompts/reviewer.md]

- id: work-turn-notes-survive-rework
  given: >-
    fake_stray_writer_role wrapping fake_codex_simple_accept writes `stray.txt` on its first turn (whose notes are the
    wrapped role's canned answer) and ends the guard-rework turn with "Removed the listed stray paths.";
    `FAKE_JEV_LOG_DIR` is set. (a) Default fake Jev answers. (b) `FAKE_JEV_ANSWERS` is
    `{"objection:scenario:fixture-scenario": ["objection", 0.99]}`.
  when: Each Build runs.
  then: >-
    (a) Exactly one Jev request follows the rework, and its notes hold the work turn's canned answer under
    `[Developer notes, turn that ended in guard rework 1]` followed by "Removed the listed stray paths." under
    `[Developer notes, turn that passed the guard]`; the attempt's `developer_notes` text and the review packet's
    `developer_notes` hold that same combined text; the `guard_violations` entry's `developer_notes` is the work turn's
    alone; the Build is accepted. (b) The Build stops as `cannot-comply` after the rework turn and before any
    verification cycle, and the stop message quotes the work turn's canned answer.
  wrong_result: >-
    Jev, the attempt record or the packet sees only the cleanup turn's notes, Jev is asked twice for one verified
    turn, or (b) is accepted or stops with another category.
  verified_by: [check]
  evidence: Fake Jev request log and the recorded packet.
  proof:
    offline: [test/kogen/guard_violation_rework_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: fake harness role and fake Jev transport"
    affected_paths: [lib/kogen/build.ex, test/kogen/guard_violation_rework_test.exs, test/support/fake_stray_writer_role]

