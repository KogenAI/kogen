# Shaped against develop 3ab70dce; reshaped after review rounds 1–5 (evidence/reviews/). Offline only.
# Every new test uses Kogen.IsolatedCase, async: true (test/kogen/isolation_test.exs:169-175).
# test/support/fake_stray_writer_role wraps another fake role (fake_codex_simple_accept unless a case names another):
# on the fresh launch it runs the wrapped role, then writes the case's paths; it answers a guard-rework resume itself,
# running exactly what the prompt says for each listed path (`rm -rf` for untracked paths, the prompt's
# `git show HEAD:<path> > <path> && chmod <mode> <path>` for tracked ones) and ending the turn with the same session id
# and its own final message "Removed the listed stray paths." (so the work turn's notes, the wrapped role's canned
# answer, differ from the cleanup turn's); every other resume goes to the wrapped role. A case may make it, on the
# guard-rework resume, print the codex capacity marker (test/support/provider_tails/hjeqtbsg_codex_capacity_stream.json)
# and exit non-zero once, either after its cleanup or instead of it. It records session ids and prompts.
- id: stray-file-reworked
  given: >-
    A fixture control guarding only `dummy.txt` (test/support/workspace_fixture.ex) and fake_stray_writer_role that on
    its first turn writes `stray.txt`, `mix_lock_user501/lock_0` and
    `.kogen/intents/approved/<slug>/evidence/__pycache__/probe.pyc` (the fixture package has no evidence/). A second
    fixture's fake instead modifies the tracked, unguarded `README.md`; a (2b) fixture's fake only runs
    `chmod 755 README.md` (a mode-only change, HEAD mode 100644). A third's fake writes `stray.txt` and, on the
    guard-rework resume, first removes `stray.txt` as the prompt says and then prints the codex capacity marker and
    exits non-zero once (the guard is clean when that turn fails).
  when: Each Build runs.
  then: >-
    The Build does not stop: the same session is resumed (same id) with a prompt listing exactly `stray.txt`,
    `mix_lock_user501` (collapsed from mix_lock_user501/lock_0) and `.kogen/intents/approved/<slug>/evidence`, saying
    deleting the listed Approved entries restores the frozen package, saying to delete or restore exactly them,
    forbidding git clean/stash/reset/checkout/restore and TMPDIR overrides, and stating guard reworks left (1 of 2);
    after the resume the guard passes, verification and Review run, and the Build is accepted. The attempt record has
    one `guard_violations` entry with those paths and the work turn's `developer_notes`. In the second fixture the
    prompt lists `README.md` with the restore command `git show HEAD:README.md > README.md && chmod 644 README.md`, the
    fake runs it, `README.md` is byte-identical to the baseline and the Build is accepted; in (2b) the prompt gives the
    same command, after it the worktree file mode is 0o644 (`File.stat!/1`) and `git diff --raw HEAD -- README.md` is empty, with no stray path, and the Build is accepted.
    In the third, the failed rework turn passes the guard check, which `settle_transport_failure/4` runs before any
    retry; the controller's one provider retry then resumes the same session with the guard-rework prompt (not the
    launch prompt), that turn ends normally, the guard passes and the Build is accepted with one `provider_retries`
    entry and one `guard_violations` entry (a provider retry is not a guard rework).
  wrong_result: >-
    The Build stops, a new session starts, the prompt omits a path or the restore or chmod command, a mode-only change
    survives, a provider retry resends a different prompt or counts as a guard rework, or the rework is not recorded.
  verified_by: [check]
  evidence: Fake role records session ids and prompts.
  proof:
    offline: [test/kogen/guard_violation_rework_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: fake harness role and a real git fixture"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/guarded_paths.ex, test/kogen/guard_violation_rework_test.exs, test/support/fake_stray_writer_role]

- id: stray-file-budget-spent
  given: >-
    (a) The same fixture, unchanged (its `offline_retries: 4` default stays), with a fake Developer that never removes
    `stray.txt`. (b) fake_stray_writer_role wrapping test/support/fake_codex (default `FAKE_CHECK_FAIL=1`: the first
    `check` fails, class offline) that writes `stray.txt` on its first turn and removes it on the guard-rework resume;
    the fixture control is created with guards ["dummy.txt", "reviewer-rework-marker.txt"] (as
    build_workspace_test.exs:359 does) so fake_codex's Review-rework marker is not a second guard violation.
  when: Each Build runs.
  then: >-
    (a) The session is resumed exactly twice (`@guard_reworks 2` in Kogen.Build), then the Build stops with category
    `guard-violation` and the message "Candidate changed paths outside Approved guards: stray.txt"; `guard_violations`
    has three entries; the Candidate is kept; the attempt has no `verification` (no cycle ran, no `offline_failures`),
    and `outer_resumptions` is untouched. (b) One guard rework, then cycle 1 fails offline and the verification resume
    prompt says "Offline (`offline_retries`) retries left: 3 of 4"; cycle 2 passes and the Build is accepted with one
    `guard_violations` entry and `offline_failures` 1 in attempt 0.
  wrong_result: >-
    Unbounded resumes, the limit follows `offline_retries`, a guard rework spends `offline_failures`, the outer
    allowance or the verification budget, or the category is integrity.
  verified_by: [check]
  evidence: Fake role that ignores the prompt; fake_codex's one offline check failure.
  proof:
    offline: [test/kogen/guard_violation_rework_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: fake harness role"
    affected_paths: [lib/kogen/build.ex, test/kogen/guard_violation_rework_test.exs, test/support/fake_stray_writer_role]

- id: terminal-guard-failures-stay-terminal
  given: >-
    Fixtures where the fake Developer (a) appends to the Candidate's root `.gitignore`, (a2) edits `.gitmodules`, (b)
    edits `.codex/hooks/check.sh`, (c) edits `.codex/hooks.json`, (c2) adds `.codex/config.toml`, (d) adds
    `.claude/settings.json`, (d2) adds `.claude/hooks/on_stop.sh`, (d3) adds `.claude/agents/helper.md`, (d4) adds
    `.claude/commands/run.md`, (d5) adds `.claude/skills/probe/SKILL.md`, (e) modifies a file of the Approved copy,
    (e2) deletes a file of the Approved copy, none of them guarded; (d6) leaves `stray.txt` AND adds
    `.claude/skills/probe/SKILL.md` in the same turn; (f) leaves `stray.txt` and then exits non-zero (harness failure);
    (g) leaves `stray.txt` AND edits `.codex/hooks.json` in the same turn; (f2) leaves `stray.txt`, then on the
    guard-rework resume prints the codex capacity marker and exits non-zero without removing it (a failed turn with a
    retryable provider marker and a violation); (h) writes `.claude/scheduled_tasks.lock`
    only; and (i) writes `.pytest_cache/.gitignore` (`*`) and `.pytest_cache/v/cache/lastfailed` only.
  when: Each Build runs.
  then: >-
    (a)–(g) stop after the first turn with zero resumes: (a) `git-policy` with "Candidate changed paths outside Approved
    guards: .gitignore"; (a2) `git-policy` with "Git configuration or ignore policy changed during Developer turn";
    (b)–(d5), (d6) and (g) `protected-path` with "Candidate changed paths outside Approved guards: <path>" (terminal
    wins); (e), (e2) `integrity` ("Approved Intent changed during Build"); (f) today's guard message with category
    `integrity`. (f2) stops after the rework turn with "Candidate changed paths outside Approved guards: stray.txt",
    category `integrity`: the guard check runs before the provider retry, so the attempt has no `provider_retries`,
    one `guard_violations` entry and exactly one resume. (h) and (i) are reworked like any
    stray path, (i)'s prompt listing `.pytest_cache`. The existing guarded-hooks tests in
    candidate_verification_test.exs pass unedited.
  wrong_result: >-
    Any of (a)–(g) is reworked, (f2) is retried or reworked again, a protected Claude subtree is missed, a
    protected-path message loses today's prefix, or (h) or (i) stops the Build.
  verified_by: [check]
  evidence: One fake role per case.
  proof:
    offline: [test/kogen/guard_violation_rework_test.exs, test/kogen/candidate_verification_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: fake harness roles"
    affected_paths: [lib/kogen/build.ex, lib/kogen/build/guarded_paths.ex, test/kogen/guard_violation_rework_test.exs, test/support/fake_stray_writer_role]

