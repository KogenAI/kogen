- id: shaping-smoke-target
  given: >-
    This Intent adds the provider-backed catalog target `live-shaping-smoke`
    (`catalog_changes.add`). It has:
    - rank 150 and `dependencies: [check]`;
    - owner `test/kogen/live_shaping_smoke_test.exs`;
    - a Makefile target `live-shaping-smoke`, running
      `mix test --only live test/kogen/live_shaping_smoke_test.exs`;
    - a rehearsal block whose command runs
      `mix test --exclude live test/kogen/shaping_smoke_rehearsal_test.exs`;
    - a `prepare` step.

    The owner runs one tiny `smoke` case through the real `driver.py`. The case
    is outside `CASES`, and it has:
    - a one-file greeting fixture;
    - a fixture config whose Codex Shaping effort is `low`;
    - a transport-smoke request: a minimal Draft, the punctuation question in
      plain text, and no inspection of lib/, priv/ or test/;
    - one scripted answer, and a trigger that grades nothing.

    The 7-case `live-shaping-quality` stays in the catalog, unselected.

    The driver's transport (`shape_transport.exp`) passes the resolved Codex
    route (`mix kogen.shape --route <codex route>`). Today it spawns plain
    `mix kogen.shape`, which since 6cdb2912 starts the fixture's
    `default_route` (claude) and hangs at Claude Code's trust prompt, while the
    driver captures Codex. The Shaping probe's first smoke run hung exactly so.
    The fix applies to the smoke case and to the 7-case suite.
  when: "`make live-shaping-smoke` runs against the real provider."
  then: >-
    It checks mechanics only, with no quality grading:
    - the public Shape session starts;
    - turns end on real `task_complete` events;
    - the scripted answer is delivered;
    - fail-fast does not fire;
    - the evidence manifest is written and validates in the smoke mode of
      `integrity.py`;
    - the driver exits cleanly, with every owned process reaped and the fixture
      cleaned.

    The probe measured it at 156 s wall, 151 s for the case
