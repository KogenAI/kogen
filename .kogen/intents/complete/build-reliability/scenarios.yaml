# Scenarios for build-reliability. Letters A-E follow the brief's outcome
# sections. Every paid selection is justified in its proof.paid_reason; the
# Paid targets: live-shaping-smoke (added by this Intent) and live-reviewer-rework.
# live-shaping-quality stays in the catalog, unselected (Shaper, DIRECTION §1.19).

# --- A. Separate budgets per failure class ---------------------------------

- id: offline-failures-own-budget
  given: >-
    A Build under the new controller with `.kogen/config.yaml` carrying the
    required top-level keys `verification_retries: 2` and `offline_retries: 4`
    (4; questions.md Q1), selected targets `check`, `cold-offline` and at least
    one provider-backed target, and a Developer turn that has just ended.
  when: >-
    A cycle fails at an offline target (`provider_backed: false` in the
    admission catalog entry, for example `check` or `cold-offline`), or at a
    `prepare` step whose failure the Candidate caused (scenario
    `controller-runs-prepare-before-paid`).
  then: >-
    The failed cycle is labelled `offline`. It increments only the attempt's
    offline-failure count and leaves the paid-failure count
    (`verification_retries` accounting) unchanged. The same Developer session is
    resumed while offline failures stay within `offline_retries`. When they
    exceed 4, the Build stops with reason class `offline` and names
    `offline_retries`. A later paid failure in the same attempt still has all of
    its `verification_retries`. The cycle, the record and the stop reason carry
    the failure class, and existing readers of records and receipts keep working.
    `offline_retries` is a required integer: a config without it is refused
    before any launch, with a message naming `offline_retries` and where to add
    it, like `verification_retries` today. There is no default. README's
    configuration section documents the key, and notes that an existing
    project's config is refused until the key is added.
  wrong_result: >-
    Offline failures still increment `failures_since_pass`, so three formatting
    or compile failures exhaust the paid budget. Or offline failures are
    unbounded. Or `offline_retries` silently defaults when missing. Or a paid
    failure after two offline failures stops the Build as exhausted.
  verified_by: [check]
  evidence: >-
    A controller verification test drives a fake harness through: offline fail,
    offline fail, paid fail, pass. It asserts the counters after each cycle, the
    resumed session id, that the Build settles, and that offline exhaustion at
    the fifth offline failure stops with class `offline` while paid retries stay unspent. A config test
    shows that a missing `offline_retries` is refused.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
      - test/kogen/intent_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: fake-harness Build through Kogen.Build with real Make targets, asserting both counters, the resumed session and the stop class"
    affected_paths:
      - lib/kogen/intent.ex
      - lib/kogen/build.ex
      - lib/kogen/build/verification.ex
      - .kogen/config.yaml
      - test/kogen/controller_verification_test.exs
      - test/kogen/intent_test.exs
      - test/support/verification_cycle_fixture.ex
    base: fail

- id: offline-gate-before-paid-dispatch
  given: >-
    A plan with offline and provider-backed targets. The catalog may declare a
    provider-backed target without depending on an offline target. No target
    name is special to the controller.
  when: The controller runs a cycle.
  then: >-
    Every selected offline target runs, in catalog order, before any
    provider-backed target or `prepare` step is dispatched. No provider-backed
    target or `prepare` step starts unless every selected offline target has
    passed for the same Candidate id in this cycle. This holds even when the
    catalog's dependencies alone would have allowed an earlier paid dispatch.
    The controller never formats or otherwise rewrites the Candidate.
  wrong_result: >-
    A paid target runs before, or despite, a failed offline target. Or the gate
    is hard-coded to the name `check`. Or the controller runs `mix format` on
    the Candidate.
  verified_by: [check]
  evidence: >-
    A fake catalog where a provider-backed target has no dependency and a lower
    rank than an offline target. Counters prove the paid recipe never ran when
    the offline target failed, and that it ran after the offline target passed.
    A format-dirty Candidate is left byte-identical.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: fake catalog and Make counters show dispatch order and no paid dispatch after an offline failure"
    affected_paths:
      - lib/kogen/build/verification.ex
      - lib/kogen/build/verification_plan.ex
      - test/kogen/controller_verification_test.exs
      - test/support/verification_cycle_fixture.ex
    base: fail

- id: environment-and-provider-classes
  given: >-
    A Build whose failure is not the Candidate's: (1) a `prepare` step reports
    an environment failure (missing or logged-out harness scope, hook toolchain
    below its required version); or (2) the output tail of a paid target, a
    Developer turn or a Reviewer turn carries a recognised provider marker.
    Structured fields come first (evidence/probe-signals):
    - Claude: `api_error_status`/`apiErrorStatus` 429 or 5xx, or
      `error: "rate_limit"`, with `is_error: true`. Never `subtype`, which reads
      "success" on the real 429.
    - Codex: `codex_error_info` `server_overloaded` or `usage_limit_exceeded`.
      Otherwise an `error` or `turn.failed` event whose message says "at
      capacity", "overloaded" or rate limit.

    There is no whole-output regex, because a bare `5\d\d` matched timestamps in
    the probe. A timeout is never a provider marker.
  when: The controller settles that failure.
  then: >-
    (1) A `prepare` command reports an environment failure through the generic
    result contract (scenario `controller-runs-prepare-before-paid`). The Build
    stops at once with class `environment` and the prepare step's reason. It spends no offline or paid retry and dispatches no paid target.
    (2) The failure is labelled `provider` and spends nothing. Overload, capacity
    (`server_overloaded`) and 5xx failures are retried once: the same paid target on the same Candidate, the
    same Developer session resumed, or one fresh Review with the same packet.
    A 429 or `usage_limit_exceeded` (usage or session limit) is not retried,
    because waiting out a limit is a non-goal. A
    second provider failure at the same point stops the Build with class
    `provider`. Provider stop and exit evidence keeps the tail of the stream,
    not its first 4,000 characters, so the classifying line survives. The
    markers belong to the harness adapters (Claude Code and Codex), not to any
    project's test framework. So a project whose paid targets never print them
    simply gets ordinary paid failures. Every timeout, whether a Kogen harness
    turn timeout or a test timeout, stays a paid failure. It goes back to the
    Developer with its retained evidence, because a Candidate change (a hook, a
    prompt, a slow tool) can cause it.
  wrong_result: >-
    A logged-out scope spends a paid cycle, or reads as a Candidate failure. A
    usage limit is retried in a loop. Overload ends the Build without a retry,
    or is retried more than once. A harness turn timeout or an ExUnit timeout is
    labelled `provider` and escapes the budget. The stored stop evidence still lacks the reason at the
    end of the stream.
  verified_by: [check]
  evidence: >-
    Fake harness and target scripts emit the recorded tails, each as a
    committed excerpt:
    - BE-N9cRQ: Claude 429 "You've hit your session limit", with
      `subtype: success` as a trap;
    - hJeqtBSg: the Codex stream `error`/`turn.failed` "Selected model is at
      capacity", plus the rollout's `codex_error_info: server_overloaded`.

    No real 5xx sample exists locally, so the 5xx fixture is the BE-N9cRQ result
    event with only `api_error_status` changed to 529, labelled synthetic. The tests assert the class, the retry
    count, the unchanged counters and the retained tail. Negative controls
    are btwokrNx's exit-124 turn timeout and an ExUnit timeout. Both stay paid
    failures and resume the Developer. A fake prepare step emits an
    environment result and the test asserts no paid dispatch.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
      - test/kogen/provider_outcome_test.exs
      - test/kogen/harness_args_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: recorded provider tails replayed through fake harness and target scripts; classification is controller code over text"
    affected_paths:
      - lib/kogen/build.ex
      - lib/kogen/build/verification.ex
      - lib/kogen/provider_outcome.ex
      - lib/kogen/harness/claude.ex
      - lib/kogen/harness/codex.ex
      - test/kogen/controller_verification_test.exs
      - test/kogen/provider_outcome_test.exs
      - test/kogen/harness_args_test.exs
      - test/support/provider_tails
    base: fail

- id: test-warnings-fail-first
  given: >-
    This repository's own `check` (repository-specific; the controller is
    unchanged by it). The Candidate's only defect is a compile warning in a
    test file.
  when: "`make check` runs `scripts/check/offline.py`."
  then: >-
    An early stage compiles and loads every non-live test file with warnings as
    errors, before credo, the full test run and rehearsals. The probed command is
    `mix test --exclude live --warnings-as-errors --exclude test`: it loads all
    910 tests and runs none, taking about 1.0 s both clean (exit 0) and with a
    planted warning (exit 1). `--only <unused tag>` is not usable, because it
    exits 1 on a clean tree (evidence/probe-loaders). It fails `check`
    within seconds, naming the warning's file and line. The full suite does not
    run first. A clean Candidate's `check` still runs every existing stage, with
    the same strictness.
  wrong_result: >-
    The warning is still found only after the whole test run ("Test suite
    aborted after successful execution due to warnings"). Or the new stage
    replaces or weakens `--warnings-as-errors` on the test run.
  verified_by: [check]
  evidence: >-
    The offline stage test runs offline.py's stage plan against a fixture with
    one test-file warning. It asserts that the failing stage is the new compile
    stage, and that the test and rehearsal stages never started.
  proof:
    offline:
      - test/kogen/offline_stage_results_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: offline.py stage plan on a warning fixture with stage-start markers"
    affected_paths:
      - scripts/check/offline.py
      - scripts/check/README.md
      - test/kogen/offline_stage_results_test.exs
    base: fail

# --- B. One prepare step per live owner, with two callers ------------------

- id: prepare-rehearsed-in-check
  given: >-
    This repository's own policy: the provider-backed targets where the mined
    setup defects occurred, and whose setup already lives outside the owner test
    file, declare the optional `prepare` field. These are `live-shaping-quality`
    and `live-shaping-smoke` (driver.py), and `live-reviewer-rework`
    (test/support/live_reviewer_rework_fixture.ex). The
    `prepare` field is declared in `priv/kogen/verification_targets.yaml`. The field is an
    argv with no shell, like `rehearsal.command`, and needs no Makefile target.
    The controller does not require `prepare`. Only this repository's
    rehearsals.exs does.
  when: "`make check` runs `scripts/check/rehearsals.exs` with providers denied."
  then: >-
    Each `prepare` runs its owner's own setup, the same functions the live owner
    calls before its first provider call, never a copy:
    - fixture copy excluding `Kogen.Build.GuardedPaths`' volatile set, including
      `.kogen/build.lock`;
    - warm seed;
    - compiling the fixture in its isolated copy;
    - catalog and Makefile match;
    - login-scope resolution;
    - hook-toolchain resolution.

    It then cleans up. In `check`, the login-scope and toolchain steps run
    against a controlled passing scope and a controlled failing scope. So `check`
    needs no real login, and the failing control must be reported as
    `environment` through the generic result contract. In this repository,
    rehearsals.exs rehearses every declared `prepare`. `live-general`,
    `live-shape-to-build` and `live-native` declare none, so their owners stay byte-identical.
    Adding their `prepare` is a non-goal.

    `check` also carries a regression for each of three overnight defects:
    - (a) no fixture copier, including
      `test/support/shaping_evaluation/driver.py`'s `setup_fixture`, copies
      `.kogen/build.lock` or any other volatile path;
    - (b) receipt and record `finished_at` come from one clock;
    - (c) when a Shaping-evaluation case's turn completes and its saved Draft
      has not reached the case's expected end state, with no scripted message
      left, the case fails at once, naming the case and the missing answer,
      instead of running to the suite deadline. The probe found that the driver
      already sees turn completion and Draft stability offline. A turn that never
      completes still ends at the unchanged `MAX_SECONDS`.
    The canonical path defect (d) and live-native's `prepare` are not in this
    Intent. Both change `lib/kogen/codex/*`, scope selection in
    `lib/kogen/claude_code.ex`, or login-scope selection, which `live-native`
    owns. `isolated-candidate-workspace` landed without them, so they go to a
    later Intent, not yet shaped. The probe evidence stays in evidence/probe-prepare for that
    package.
  wrong_result: >-
    `prepare` re-implements setup, so it passes while the owner's own copy still
    includes build.lock. Or `check` requires a real login. Or a declared `prepare`
    is never rehearsed. Or a regression asserts against a fixture the real code never uses.
  verified_by: [check]
  evidence: >-
    rehearsals.exs asserts, for each target, a trace of the owner's own setup
    entry points (as `trace_assertions` does today). A fixture with a planted
    `.kogen/build.lock` shows that every copier excludes it. A driver rehearsal
    with a missing scripted answer fails within the rehearsal budget. A
    timestamp
    regression binds receipt and record clocks.
  proof:
    offline:
      - test/kogen/prepare_test.exs
      - test/kogen/shaping_evaluation_test.exs
      - test/kogen/live_scheduling_test.exs
      - test/kogen/controller_verification_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: provider-denied rehearsal of every owner's own setup with passing and failing scope controls"
    affected_paths:
      - priv/kogen/verification_targets.yaml
      - scripts/check/rehearsals.exs
      - lib/kogen/build/verification_plan.ex
      - test/support/shaping_evaluation/driver.py
      - test/support/live_reviewer_rework_fixture.ex
      - test/support/review_packet_audit.ex
      - test/kogen/shaping_evaluation_test.exs
      - test/kogen/live_scheduling_test.exs
      - test/kogen/controller_verification_test.exs
      - test/kogen/prepare_test.exs
    base: fail

- id: controller-runs-prepare-before-paid
  given: >-
    A cycle whose selected offline targets have passed, with one or more
    provider-backed targets selected.
  when: The controller is about to dispatch the first provider-backed target.
  then: >-
    It first runs the `prepare` command of every selected provider-backed target
    that declares one. The catalog loader (`VerificationPlan.valid_entry?`)
    validates an optional `prepare` as a nonempty argv list of nonempty strings,
    and refuses any other shape (Expert audit). Each `prepare` is taken from
    the admission catalog entry (a target the Intent adds takes its Candidate
    entry, as today). Targets without `prepare`
    need no step. It runs the commands through `Kogen.Build.VerificationRunner`,
    the same contract as targets since 7ed41f66: cwd is the Candidate worktree,
    with a scrubbed environment (Mix redirections and controller context
    removed), provider dispatch denied, its own process group and a
    controller-owned log. It records a receipt for each.

    The result contract is generic and documented in README:
    - exit 0 passes;
    - a nonzero exit is a Candidate failure, labelled `offline`, which spends
      `offline_retries`;
    - a nonzero exit whose output carries one
      `KOGEN_PREPARE_RESULT\t{"class":"environment","reason":…}` frame stops the
      Build as `environment`.

    In the two failure cases, no provider-backed target is dispatched in that
    cycle. When every `prepare` passes, paid targets run in catalog order as
    today.
  wrong_result: >-
    Prepare runs lazily inside each target, so a fixture failure again surfaces
    after 20 minutes of earlier targets. Or a prepare failure spends a paid retry.
    Or prepare runs with provider access.
  verified_by: [check]
  evidence: >-
    A fake catalog with three paid targets. One has no `prepare`, and the third
    target's prepare fails. Make counters show that no paid recipe ran, the cycle
    class is `offline`, and the prepare receipt is retained. The environment
    variant emits the frame and stops with no counters. A catalog with no
    `prepare` at all runs its paid targets directly.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: fake prepare commands and Make counters through the controller"
    affected_paths:
      - lib/kogen/build/verification.ex
      - lib/kogen/build/verification_runner.ex
      - lib/kogen/build/verification_plan.ex
      - lib/kogen/build/catalog_change.ex
      - test/kogen/controller_verification_test.exs
      - test/support/verification_cycle_fixture.ex
    base: fail

# --- C. Handoff with the root cause -----------------------------------------

- id: handoff-lists-all-evidence
  given: >-
    A failed cycle that has several receipts: one failed and some passed. It may
    have a target-evidence manifest, and, for `live-shaping-quality`, a
    `suite-failure.json` and per-case logs.
  when: The controller resumes the Developer (`verification_failure_prompt/3`).
  then: >-
    The prompt lists every failed receipt of the cycle, including a failed
    `prepare` receipt, with its class. For each it gives the retained log path
    and sha256, the target-evidence manifest path and sha256, and each manifest
    entry (for example `suite-failure.json` and each failed case's log) with its
    digest. It also gives a bounded excerpt of the primary failure lines. These
    come from the receipt's `KOGEN_FAILURE_SIGNATURE` frame when present.
    Otherwise the excerpt is the first failure block, found by generic markers
    (error, fail, assert), plus the output's tail, within the bound. A tail
    alone is not enough: in a2sPFUvF cycle 2 the assertion sits 232 of 262
    non-blank lines from the end (evidence/probe-signals). Manifest entries are listed with a bounded
    excerpt of their own content. The controller treats every manifest entry
    alike and knows no file name such as `suite-failure.json`. It states the
    remaining offline and paid retries.

    The prompt stays within a fixed total bound, never names the controller's
    context, state or history paths, and there is no separate dossier file.
  wrong_result: >-
    Only the first failed receipt is shown. Or the excerpt is the offline.py
    preamble or a 6,000-character tail without the failing assertion. Or
    controller-private paths leak. Or a new dossier artifact appears with no
    consumer. Or the controller special-cases this repository's file names or
    ExUnit output.
  verified_by: [check]
  evidence: >-
    A handoff test builds a failed cycle from committed excerpts of real mined
    receipts, including R9Oe4Fcp's suite-failure and case log. It asserts every
    locator and digest, the primary failure lines, the bound, and the absence of
    private paths.
  proof:
    offline:
      - test/kogen/controller_handoff_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: prompt rendered from real retained receipt and manifest excerpts"
    affected_paths:
      - lib/kogen/build.ex
      - lib/kogen/build/target_evidence.ex
      - priv/kogen/prompts/developer.md
      - test/kogen/controller_handoff_test.exs
      - test/support/mined_failures
    base: fail

- id: shaping-suite-finishes-cases
  given: >-
    The Shaping-quality driver runs its cases in parallel under the existing
    `SUITE_SECONDS` deadline. One case fails early.
  when: The driver handles the failure.
  then: >-
    It lets the remaining cases run to completion within the same deadline,
    without cancelling them. It records every case's status in
    `suite-failure.json` and prints one failure line per failed case to stdout.
    It still writes and prints the evidence manifest frame, covering the failure
    record and case logs. `integrity.py`'s `validate_manifest` today requires
    every case's full evidence (review receipt, Draft), so a failure manifest
    gets its own validated mode. It lists only artifacts that exist, plus
    `suite-failure.json`. The existing rehearsal
    `test_run_suite_dispatches_all_cases_before_collection_and_reaps_after_child_failure`
    relies on cancel-on-first-failure and hung against the probe's patched
    driver, so it is rewritten to the no-cancel contract
    (evidence/probe-prepare/driver-no-cancel.diff). Cases still running at the unchanged deadline are
    cancelled and recorded as such. No timeout or case budget is raised. The live
    owner file `test/kogen/live_shaping_evaluation_test.exs` stays
    byte-identical, so its assertion message carries the driver's output and the
    manifest frame reaches the receipt. The real-session mechanics of the edited
    driver are proven by `live-shaping-smoke` (scenario
    `shaping-smoke-target`), not by the 7-case suite.
  wrong_result: >-
    The driver still cancels on the first failure. Or it raises the deadline. Or
    it prints the manifest twice on the passing path. Or the change is proven only by
    rerunning the 7-case paid suite.
  verified_by: [check]
  evidence: >-
    A driver rehearsal with two failing fake cases and one slow passing case. No
    case is cancelled, both failure lines are printed, one manifest frame is
    emitted and validates, and a case past the deadline is recorded as cancelled.
  proof:
    offline:
      - test/kogen/shaping_evaluation_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: driver rehearsal with fake cases exercises the real orchestration; real-session mechanics are live-shaping-smoke's (scenario shaping-smoke-target)"
    affected_paths:
      - test/support/shaping_evaluation/driver.py
      - test/support/shaping_evaluation/integrity.py
      - test/support/shaping_evaluation/driver_rehearsal_test.py
      - test/kogen/shaping_evaluation_test.exs
    base: fail

