- id: test-catalog-binds-declarations
  given: >-
    At 7ed41f66, every row in `priv/kogen/test-reliability.yaml` (346 rows)
    carries `source_sha256`, the SHA-256 of its test file. The validator
    (`test/support/test_reliability_catalog.ex`, `source_bound?` :144-152)
    fails `check` with "<id>: source binding is stale" after any edit to a
    catalogued file, even a new assertion or a comment. The only fix is
    `scripts/check/refresh_test_reliability_sources.py`, which rewrites every
    hash unconditionally. No check ties a row's `declaration` to a real test:
    `discover/1` and `exunit_declarations/1` exist but have no callers. So 5
    rows already name tests that were renamed or deleted
    (`codex_compatibility_test.exs` t001-t004 in 363c20af,
    `lifecycle_test.exs` t001), and 2 were cut off at an apostrophe upstream of
    the generator, in the ignored runtime coverage matrix it copies from
    (`harness_args_test.exs` t004, `scenario_tracking_test.exs` t007).
    `priv/kogen/test-reliability-remediation.yaml` mirrors each row's id,
    disposition, scenario, implementation, wrong-control locator and
    resolution, and `validate_remediation/2` requires the two to agree. `check` passes anyway. This trap stopped zYsany_w and K9Fu72yG and
    broke a Bg1qobsC handoff (mining P10).
  when: A Candidate edits a catalogued test file, renames or deletes a catalogued test, or leaves the catalog untouched.
  then: >-
    The validator binds each row to its test by name, not by bytes:
    - an ExUnit row (`*.exs`) resolves when its file has `test "<declaration>"`;
    - a Python row resolves when its file has `def <declaration>`;
    - a row that doesn't resolve fails `check`, naming the row id, the file
      and the missing declaration.

    `source_sha256` is removed from every row and from what
    `scripts/check/generate_test_reliability.py` writes.
    `refresh_test_reliability_sources.py` is deleted, and
    `scripts/check/README.md` stops mentioning it. The seven stale rows are
    repaired by hand: each names the current test that carries its declared
    behavior, or is removed when that behavior no longer has a test. A removal
    updates `test-reliability-remediation.yaml` so `validate_remediation/2`
    still agrees, and the handoff lists each repair. The generator's upstream
    matrix is ignored runtime state, so the truncation is not fixed there; the
    name binding catches any repeat.

    Every other semantic check stays unchanged: the required fields, the
    allowed dispositions, the evidence paths existing and not aliasing, the
    consumer witness, the unique outcome text, and the changed-implementation
    rule. `declaration_count` is checked against the rows, not pinned to 346
    (`test_reliability_catalog_test.exs:15`), so a repaired removal passes.
    Editing a catalogued test's body, or adding a test, passes with no
    catalog change. `offline.py` still records the catalog's digest in the
    receipt, and that digest is of the revised catalog. No file in `lib/`,
    `scripts/` or `test/` still reads `source_sha256` from this catalog (the
    unrelated native-helper receipt field of the same name stays).
  wrong_result: >-
    The hash stays, and `check` regenerates it, so the rule checks nothing. Or
    the hash goes with no name binding, so renamed and deleted tests go
    unnoticed as they do today. Or the seven stale rows are deleted without
    checking whether their behavior still has a test. Or other semantic checks
    are dropped along with the hash.
  verified_by: [check]
  evidence: >-
    The catalog test runs the validator on the repository (all rows resolve,
    no `source_sha256` left) and on fixture catalogs: a comment added to a
    catalogued file passes; a renamed test fails naming the row; a deleted
    file fails; a Python row resolves by `def`; a declaration with an
    apostrophe resolves; a missing consumer witness still fails. On base, the
    comment-edit fixture fails with "source binding is stale".
  proof:
    offline:
      - test/kogen/test_reliability_catalog_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: validator over the repository catalog and fixture catalogs, with rename, delete and witness negative controls"
    affected_paths:
