    (`lib/kogen/build.ex:778`) runs `Verification.run_cycle` first. Only after a
    passing cycle do `settle_notes` (Jev reads the notes, then `cannot_comply`,
    `build.ex:895-933`) and `settle_passing`
    (`VerificationPlan.missing_selectors`, then `unfinished_work`,
    `build.ex:936-948`) run. The evidence is Build IEf3rtZ8xYuvEPSj_gtdanD8
    (shaping-preflight-audit, supplied by the Shaper). Its first Developer turn
    wrote a contract objection ("fix3 unreachable, return to Shaping") and 7 of
    19 declared proof tests were missing. The controller still ran `check` three
    times and paid `live-shaping-quality` once, then stopped with "verification
    retries exhausted", which hid the real reason.
  when: The controller settles the Developer turn.
  then: >-
    Before any verification cycle, the controller does two things. First, Jev
    reads the Developer's notes once for this turn (the same
    `Kogen.Jev.read_notes/2` and the same threshold). An objection at or above
    the threshold, not superseded under the existing
    `ReviewPacket.superseded_objection` rule using the attempt's settled cycles
    so far, stops the Build as `cannot_comply`, with the Developer's reason. It
    runs no target and dispatches nothing paid. Second, if any declared proof
    selector is missing in the Candidate
    (`VerificationPlan.missing_selectors/3`), the controller returns the
    Developer to work as `unfinished_work`, naming the selectors, exactly as
    today but without running or counting a verification cycle.

    Only then does the verification cycle run. After a passing cycle, the turn's
    Jev reading is reused, not re-requested, and the rest of settlement (Report,
    Review) is unchanged. `cannot_comply` and `unfinished_work` keep their
    record shapes and stop-reason prefixes. This is a reordering of existing
    checks plus its tests, with no new mechanism.
  wrong_result: >-
    Verification still runs first, so an objection or a missing proof test spends
    `check` and paid cycles and ends as "verification retries exhausted". Or Jev
    is called twice per turn. Or `unfinished_work` spends an offline or paid
    retry. Or a superseded objection now stops the Build.
