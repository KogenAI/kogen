    no process group, no recorded pid, pgid or start time, and no teardown on
    abnormal exit. Only `VerificationRunner` supervises its target in its own
    group.
  when: >-
    A Build ends in any way: finish, stop, a turn or target timeout, Ctrl-C,
    closing the terminal (SIGHUP), SIGTERM, a BEAM crash, or `kill -9` of the
    controller.
  then: >-
    Every process a Build launches runs in its own process group: Developer,
    Reviewer, Expert, their helpers (as descendants), Jev, every make target,
    `prepare`, focused and base runs, and live tests. Each is started through
    one supervisor, `priv/kogen/process_supervisor.py`, generalised from
    `VerificationRunner`'s:
    - the supervisor stays outside the group and starts the child with a new
      session;
    - it records the child's pid, pgid and start time (`ps -o lstart=`) in the
      controller's lock state;
    - it removes the child's temporary prompt files when the child ends;
    - it is a parent-death watchdog: when the controller's pipe closes or its
      ppid becomes 1, it `killpg`s TERM, then KILL after a short grace, and
      exits.

    The controller kills every recorded group the same way on turn end, stop
    and timeout. It traps SIGHUP and SIGTERM (`:os.set_signal`) to tear down,
    release the lock and exit. Ctrl-C stops immediately, with no BEAM BREAK
    menu, for Builds started from the control checkout after this lands. This
    Build's own controller predates the change. The repository's `mise.toml` sets `ELIXIR_ERL_OPTIONS = "+Bd"`,
    because `system_flag(break_ignored)` is not settable at runtime and a
    relaunch can't take the terminal's foreground group. The watchdogs reap on
    Ctrl-C and on `kill -9`. The Candidate worktree is kept as today, because
    isolation owns it. All of this works inside the Seatbelt write boundary,
    which already wraps every role launch.
  wrong_result: >-
    Only the direct child is killed, so a forked grandchild that ignores SIGTERM
    survives. Or the supervisor puts itself in the group and kills itself first,
    which the probe hit. Or teardown runs only in `after` blocks, which
    `kill -9` and Ctrl-C skip. Or orphans are identified through `ps` environment
    variables, which macOS doesn't show. Or a timeout is raised.
  verified_by: [check]
  evidence: >-
    Offline, provider-independent. A fake provider ignores stdin EOF and forks a
    grandchild that ignores SIGTERM, launched through every launch site's real
    path. The controller is killed with each of Ctrl-C (under a pty, with
    `+Bd`), SIGHUP, SIGTERM and `kill -9`, plus a normal stop and a timeout.
    After a bounded wait (5 s), no process of any recorded group is alive, the
    lock is released or reclaimable, and the temporary prompt files are gone.
    Mechanisms are from evidence/probe-custody.
  proof:
    offline:
      - test/kogen/process_custody_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: process groups are provider-independent; fake provider and grandchild killed by every exit path"
    affected_paths:
