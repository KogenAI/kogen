# --- D. Useful signatures, and a stop on unchanged Candidates ---------------

- id: signatures-identify-failures
  given: >-
    Committed verbatim excerpts of mined failed receipts. `check` failures with
    different causes include ZJDgU9wo, _8Qpvuip and a2sPFUvF, which share today's
    digest `e3c761c920…`. There are also hAOGGjSC's cycle 1 (PTY EBADF) and
    cycle 2 (120 s timeout), and btwokrNx's three identical `live-native`
    failures with different seeds.
  when: "`FailureSignature.derive/4` computes signatures."
  then: >-
    The controller derives the signature generically, knowing no target name,
    runner or test framework. A target may print one
    `KOGEN_FAILURE_SIGNATURE\t{"stage":…,"test_id":…,"assertion":…}` frame (the
    contract is documented in README next to the evidence manifest frame). When
    it does, the digest is target plus those fields, and those fields also give
    the handoff's primary failure lines. A target without the frame falls back to
    the normalized failure tail:
    - it takes the last failure lines, not the first 320 characters;
    - it strips ANSI codes, seeds, durations, timestamps, temporary paths and
      hex digests;
    - it strips the harness adapters' own warning items, such as Codex's
      bypass-hook-trust notice.

    In this repository, offline.py emits the frame for its failing stage, with
    the first failing ExUnit test id and assertion. Against the mined excerpts,
    different causes get different digests, and identical failures with
    different seeds get equal digests. The prototype run on the real receipts
    (evidence/probe-signals) found:
    - ZJDgU9wo, _8Qpvuip and a2sPFUvF split by their failing test, although all
      share today's `e3c761c920…`;
    - _8Qpvuip's cycles 2 and 3 (the same LifecycleTest:21) share a frame
      signature, so cycle 3 is `repeated`;
    - hAOGGjSC's cycle 1 (PTY EBADF) differs from cycle 2 (120 s timeout);
    - btwokrNx's cycle 3 equals cycle 1 through the fallback, so it is
      `repeated`, while cycle 2 stays distinct because it failed in a different
      phase (`:launch_developer` rather than `:launch_reviewer`).

    The fallback normalization also replaces fixture directories named with an
    epoch or port, and opaque per-run tokens (for example
    `KOGEN_ISOLATED_COMPLETION`), with placeholders. The frame parser looks past
    `Kogen.IsolatedCase`'s wrapper banner to the real reason line.
  wrong_result: >-
    The digest is still over the preamble. Or it includes the seed. Or the
    warning text becomes `error_head`. Or the controller parses offline.py or
    ExUnit output itself, so another project's targets get useless signatures.
  verified_by: [check]
  evidence: >-
    A signature test over the committed excerpts, each carrying its Build id,
    cycle and original receipt sha256 as provenance. It runs both with the frame
    (the check excerpts replayed through offline.py's new frame emitter) and
    without it (the live-native excerpts, plus a plain `make test` output from a
    non-Elixir fixture).
  proof:
    offline:
      - test/kogen/failure_signature_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: signatures computed on real mined receipt excerpts"
    affected_paths:
      - lib/kogen/build/failure_signature.ex
      - scripts/check/offline.py
      - README.md
      - test/kogen/failure_signature_test.exs
      - test/support/mined_failures
    base: fail

