    like any other tracked path:
    - allowed when the Intent declares it in `may_change_guarded_paths`;
    - refused as an ordinary guard violation ("Candidate changed paths outside
      Approved guards: .gitignore") when it doesn't.

    A new ignore rule that hides a changed or new file still flags that file
    through the frozen ignored manifest, unless the file is declared too.
    `.git/config`, `.git/info/exclude` and `.gitmodules` stay frozen exactly as
    today. This Build runs under main's controller, so it doesn't edit
    `.gitignore` itself. Adding the trash patterns is left to the next Intent.
