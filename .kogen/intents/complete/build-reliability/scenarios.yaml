- id: stale-lock-and-orphan-sweep
  given: >-
    A previous controller died without teardown, for example from `kill -9`
    before its watchdogs acted, or a crash. It left `.kogen/build.lock` and
    possibly live process groups. At 7ed41f66, the lock records only a pid, and
    the next Build refuses until someone deletes it by hand.
  when: A new `mix kogen.build` starts.
  then: >-
    The lock records the controller's pid and start time, plus each launched
    group's pid, pgid and start time. That is the pattern
    `lib/kogen/codex/state.ex:130-164` already uses. At start, if the owner is
    alive (pid present with a matching start time), the Build refuses as today.
    If the owner is dead or its pid was reused, the Build kills every recorded
    group whose leader's start time still matches, TERM then KILL. It then
    reclaims the lock automatically and prints one line naming what it reaped.
    At Build end it sweeps its own recorded groups again. Nobody kills processes
    or deletes a lock by hand.
  wrong_result: >-
    A reused pid gets killed, or a live Build's lock gets reclaimed. Or the lock
    is deleted without reaping its groups. Or it still needs a manual `rm`.
  verified_by: [check]
  evidence: >-
    A fake dead controller's lock with a live orphan group (a fake grandchild
    that ignores SIGTERM): the next Build reaps it and starts. A live owner is
    refused. A lock whose pid was reused (start time mismatch) is reclaimed
    without killing the unrelated process.
  proof:
    offline:
      - test/kogen/process_custody_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: recorded pid/pgid/lstart and fake processes"
    affected_paths:
      - lib/kogen/process_custody.ex
      - lib/kogen/build.ex
      - test/kogen/process_custody_test.exs
    base: fail

