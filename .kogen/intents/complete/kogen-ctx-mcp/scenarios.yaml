# Shaped against fa48e817; re-preflighted against develop 8538b6a6 (slices 1 and 2 landed). Offline only. Fixture: the
# landed Kogen.Test.CtxFixture (test/support/ctx_fixture.ex, loaded with Code.require_file): create!/0 ({root, home},
# the shop fixture, a fresh empty KOGEN_CTX_HOME outside root), binary/0, and run(binary, root, home, args,
# extra_env \\ []) (run/5 -> {stdout, stderr, status}, PATH=/usr/bin:/bin). MCP runs through the test file's
# mcp_file/3 (a request file on stdin via `/bin/sh -c 'exec "$0" mcp --root "$1" < "$2"'`) or mcp_port/2 (an Erlang
# Port that keeps stdin open); see INTENT.md "Tests and fixtures". USAGE below is exactly:
#   usage: kogen-ctx index [--root DIR] | kogen-ctx search <query>... [--limit N] [--root DIR] | kogen-ctx symbols <query> [--limit N] [--root DIR] | kogen-ctx refs <target> [--limit N] [--root DIR] | kogen-ctx map [--tokens N] [--focus PATH]... [--root DIR] | kogen-ctx mcp [--root DIR]
# (the landed line plus ` | kogen-ctx mcp [--root DIR]`). No test reads the checkout's .kogen/. Each scenario's `tests`
# key lists the ExUnit test cases to write, named exactly "<id> <title>" (the ledger binds rows by test name). A test
# that only checks the exit status, a substring or the number of replies, where exact values are listed, does not
# prove the scenario.
- id: mcp-answers-protocol-requests
  given: >-
    The shop fixture, and a request file of 14 newline-delimited lines:
    1. `initialize` (id 1, protocolVersion `2025-06-18`);
    2. the notification `notifications/initialized`;
    3. `tools/list` (id 2);
    4. `tools/call` of `search` {query "the"} (id 3);
    5. `symbols` {query "Shop.Cart.total"} (id 4);
    6. `refs` {target "Shop.Tax.add"} (id 5);
    7. `map` {tokens 25} (id 6);
    8. `map` {focus ["test/shop_test.exs"]} (id 7);
    9. a tool named `nope` (id 8);
    10. method `nope/method` (id 9);
    11. the line `{not json`;
    12. `ping` (id 10);
    13. `search` with arguments {} (id 11);
    14. a second `initialize` (id 12) asking for protocolVersion `2099-01-01`.
  when: >-
    `kogen-ctx mcp --root <fixture>` runs with that file on stdin (then EOF), with PATH=/usr/bin:/bin. Separately, a
    file of `[1,2]`, then `ping` (id 1), is sent. Separately, the server runs as a Port with stdin kept open, and
    `initialize` and then `tools/list` are written one line at a time. Separately, `mcp` is started with malformed
    command lines, and outside a Git checkout, with stdin left open.
  then: >-
    The file run exits 0, and stdout is exactly 13 lines, each a JSON object with `"jsonrpc":"2.0"`. Their ids are,
    in request order, 1, 2, 3, 4, 5, 6, 7, 8, 9, null (the `{not json` line), 10, 11, 12; nothing answers the
    notification. id 1: result protocolVersion `2025-06-18`, `capabilities.tools` is `{"listChanged":false}`,
    `serverInfo` is `{"name":"kogen-ctx","version":"0.1.0"}`. id 12: protocolVersion `2025-11-25`. id 2: the tool
    names are exactly, in order, search, symbols, refs and map. Each has `inputSchema.type` `object`; `required` is
    ["query"] for search and symbols, ["target"] for refs, and absent or empty for map. ids 3–7: `isError` false.
    id 8: error code -32602. id 9: -32601. The `{not json` line: -32700. id 10: result `{}`. id 11: result exactly
    {content: [{type: "text", text: USAGE + "\n"}], isError: true}. The `[1,2]` file gives exactly 2 lines: an error
    -32600 with id null, then ping's `{}` with id 1. Over the Port, the reply to `initialize` (id 1) arrives within
    10 s while stdin is still open, before `tools/list` is written, and then the `tools/list` reply (id 2) arrives the
    same way. Each malformed `mcp` command line exits 2 with empty stdout and stderr USAGE + "\n", and leaves the home
    empty; outside a checkout, `mcp` exits 1 with empty stdout and stderr
    `kogen-ctx: not a Git checkout: <canonical dir>` + "\n". Neither waits for stdin. Every other command's usage
    error now prints the same extended USAGE (E4, H4).
  wrong_result: >-
    Any of these:
    - a reply to the notification;
    - logging or any non-JSON line on stdout;
    - a crash or silence on bad input;
    - replies only after stdin closes (the Candidate's read-everything loop), so a real MCP client hangs;
    - replies out of order;
    - a hard-coded protocolVersion;
    - tools missing from tools/list or in another order;
    - an MCP SDK or async runtime pulled in, or any change to Cargo.toml or Cargo.lock;
    - `mcp` refreshing the index at startup, or reading stdin before its usage and root checks;
    - a usage line that drops or reorders the landed alternatives, or E4/H4 left asserting the old line;
    - a smoke test that checks only the first two replies (the Candidate's ctx_mcp_test), or only the number of
      replies, or only that id 11's text starts with `usage:`.
  verified_by: [check]
  evidence: A captured JSON-RPC transcript from a real stdio run, and an interactive Port exchange.
  tests:
    - >-
      M1 "a scripted session gets one reply per request, in order": {root, home} = CtxFixture.create!(); write the 14
      lines of `given`, as JSON built with Jason.encode!: requests carry "jsonrpc":"2.0"; line 11 is the literal
      `{not json`; line 13's params are {"name":"search","arguments":{}}. Then {lines, 0} = mcp_file(root, home,
      requests); replies = Enum.map(lines, &Jason.decode!/1); assert length(lines) == 13; assert every reply["jsonrpc"]
      == "2.0"; assert Enum.map(replies, & &1["id"]) == [1, 2, 3, 4, 5, 6, 7, 8, 9, nil, 10, 11, 12]; then assert each
      value listed in `then`: the id 1 result map ==
      %{"protocolVersion" => "2025-06-18", "capabilities" => %{"tools" => %{"listChanged" => false}},
      "serverInfo" => %{"name" => "kogen-ctx", "version" => "0.1.0"}}; id 12's protocolVersion == "2025-11-25"; id 2's
      tool names == ["search", "symbols", "refs", "map"], and for each tool its inputSchema's "type" == "object" and
      its Map.get(schema, "required", []) == ["query"], ["query"], ["target"], []; ids 3-7 "isError" == false;
      id 8's error code == -32602; id 9 -32601; the id-nil reply's error code == -32700; id 10 result == %{};
      id 11 result == %{"content" => [%{"type" => "text", "text" => USAGE <> "\n"}], "isError" => true}.
    - >-
      M2 "a JSON value that is not a request object is -32600": mcp_file(root, home, ["[1,2]",
      ~s({"jsonrpc":"2.0","id":1,"method":"ping"})]) → status 0 and exactly 2 decoded replies:
      %{"jsonrpc" => "2.0", "id" => nil, "error" => %{"code" => -32600}} (match on the code) and
      %{"jsonrpc" => "2.0", "id" => 1, "result" => %{}}.
    - >-
      M3 "replies are written while stdin stays open": port = mcp_port(root, home); Port.command(port, initialize
      id 1 line <> "\n"); assert_receive {^port, {:data, {:eol, l1}}}, 10_000; Jason.decode!(l1)["id"] == 1; only
      then Port.command(port, tools/list id 2 line <> "\n"); assert_receive {^port, {:data, {:eol, l2}}}, 10_000;
      Jason.decode!(l2)["id"] == 2; Port.close(port).
    - >-
      M4 "mcp command-line errors exit before reading stdin": {root, home} = CtxFixture.create!(); binary =
      CtxFixture.binary(); for args <- [["mcp", "extra"], ["mcp", "--limit", "2"], ["mcp", "--tokens", "5"],
      ["mcp", "--focus", "lib/"], ["mcp", "--root"], ["mcp", "--bogus"]]: assert CtxFixture.run(binary, root, home,
      args) == {"", USAGE <> "\n", 2}; then assert File.ls!(home) == []. outside = a fresh temp dir (not a checkout);
      assert CtxFixture.run(binary, outside, home, ["mcp"]) == {"", "kogen-ctx: not a Git checkout: " <>
      Kogen.ProjectScope.canonical(outside) <> "\n", 1}; assert File.ls!(home) == [].
    - >-
      Existing, updated (test/kogen/ctx_elixir_test.exs, test/kogen/ctx_map_test.exs): "E4 malformed symbols, refs
      and map command lines are usage errors before any index work" and "H4 bad map arguments are usage errors" keep
      their names and command lines, and expect stderr == USAGE <> "\n" (the extended line) with exit 2 and empty
      stdout.
  proof:
    offline: [test/kogen/ctx_mcp_test.exs, test/kogen/ctx_elixir_test.exs, test/kogen/ctx_map_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: a local stdio JSON-RPC exchange with the binary; no provider is involved"
    affected_paths: [native/kogen-ctx/src/**, test/kogen/ctx_mcp_test.exs, test/kogen/ctx_elixir_test.exs, test/kogen/ctx_map_test.exs]

- id: mcp-tools-match-the-cli
  given: >-
    The shop fixture, and the CLI outputs slices 1 and 2 pinned for it in the landed tests.
  when: >-
    MCP `tools/call` runs each of these, and the CLI runs its equivalent on the same root and KOGEN_CTX_HOME:
    - `search` {query "the"};
    - `symbols` {query "Shop.Cart.total"};
    - `refs` {target "Shop.Tax.add"};
    - `map` {tokens 25};
    - `map` {focus ["test/shop_test.exs"]};
    - `search` {query "Mix lock"};
    - `search` {query "stray", limit 2};
    - `symbols` {query "Shop", limit 1};
    - `refs` {target "Shop.Cart", limit 2};
    - `map` {tokens 64, focus ["lib/shop/"]};
    - `symbols` {query "Shop Cart"} (one argument with a space);
    - argument errors: `search` {}, `refs` {} and `map` {focus ["nope.ex"]}.
    Separately, `search` {query "the"} runs with a KOGEN_CTX_HOME of mode 0500.
  then: >-
    Every successful call's result is exactly {content: [{type: "text", text}], isError: false}, with `text`
    byte-identical to the CLI's stdout for the same arguments. Those CLI outputs are the exact outputs pinned by
    the landed tests C1, E2, E3, H2, H3, C4, C3, E2 and E3, so none is empty; `symbols` {query "Shop Cart"} and the
    CLI's `symbols "Shop Cart"` both give "" (exit 0, isError false). `map` {tokens 64, focus ["lib/shop/"]} and the
    CLI's `map --tokens 64 --focus lib/shop/` both print the lib/shop/tax.ex block, the lib/shop/cart.ex block and
    `... 5 more files`. Each argument error gives isError true, with text equal to the CLI's stderr for the same
    arguments, which is exactly USAGE + "\n". With the 0500 home, the call gives isError true, with text equal to the
    CLI's stderr (`kogen-ctx: cannot write index at <home>/<project-id>/index.sqlite: <os error>; set KOGEN_CTX_HOME
    to a writable directory` + "\n"), and the server, which started without touching the index, still answers
    `ping`.
  wrong_result: >-
    Any of these:
    - tool text that differs from the CLI (a second query implementation, a trimmed trailing newline, arguments
      mapped to other flags);
    - `limit`, `tokens` or `focus` ignored;
    - a `query` or `target` split on whitespace into several arguments (the Candidate's run_capture), so
      `symbols "Shop Cart"` becomes a usage error;
    - an argument or runtime error reported as a JSON-RPC error, or as isError false;
    - a server or test that hard-codes the shop fixture's names or outputs (a table keyed by query or tool) instead of
      running the CLI path, or tests whose expected CLI outputs differ from the landed pins;
    - a parity test that compares two empty strings without the pinned outputs, or only checks that `text` is
      non-empty.
  verified_by: [check]
  evidence: MCP tool texts compared byte for byte with CLI runs on the same fixture and home.
  tests:
    - >-
      T1 "tool text is byte-identical to the pinned CLI output": {root, home} = CtxFixture.create!(); binary =
      CtxFixture.binary(); for each pair in [{search {query "the"}, ["search", "the"]}, {symbols {query
      "Shop.Cart.total"}, ["symbols", "Shop.Cart.total"]}, {refs {target "Shop.Tax.add"}, ["refs", "Shop.Tax.add"]},
      {map {tokens 25}, ["map", "--tokens", "25"]}, {map {focus ["test/shop_test.exs"]}, ["map", "--focus",
      "test/shop_test.exs"]}], get {cli, "", 0} = CtxFixture.run(binary, root, home, argv), and assert cli == the
      exact expected lines joined with "\n" plus a trailing "\n". These are the landed C1 (3 lines), E2's
      Shop.Cart.total (2 lines), E3's Shop.Tax.add (2 lines), H2's --tokens 25 (the tax block + "... 6 more files")
      and H3's test/shop_test.exs focus (7 blocks, 32 lines). Then, in one mcp_file run with ids 1-5, assert each
      result == %{"content" => [%{"type" => "text", "text" => cli}], "isError" => false}.
    - >-
      T2 "arguments map to the CLI's flags": the same way, pairs {search {query "Mix lock"}, ["search", "Mix lock"]},
      {search {query "stray", limit 2}, ["search", "stray", "--limit", "2"]}, {symbols {query "Shop", limit 1},
      ["symbols", "Shop", "--limit", "1"]}, {refs {target "Shop.Cart", limit 2}, ["refs", "Shop.Cart", "--limit",
      "2"]}, {map {tokens 64, focus ["lib/shop/"]}, ["map", "--tokens", "64", "--focus", "lib/shop/"]} and {symbols
      {query "Shop Cart"}, ["symbols", "Shop Cart"]}; each tool text == the CLI stdout, with isError false. The CLI
      stdouts are exactly: the landed C4 (2 lines); C3's --limit 2 (2 hits + "... 3 more"); E2's --limit 1
      ("lib/shop.ex:1 defmodule Shop", "... 25 more"); E3's --limit 2 ("lib/shop.ex:2 alias Shop.Cart",
      "lib/shop.ex:10 call Shop.Cart.total/1", "... 3 more"); H2's --tokens 64 lines (the lib/shop/tax.ex block, the
      lib/shop/cart.ex block, then "... 5 more files"); and "" (exit 0) for "Shop Cart".
    - >-
      T3 "argument and runtime errors are tool errors with the CLI's message": for {search {}, ["search"]},
      {refs {}, ["refs"]} and {map {focus ["nope.ex"]}, ["map", "--focus", "nope.ex"]}: {"", err, 2} =
      CtxFixture.run(binary, root, home, argv); assert err == USAGE <> "\n"; the tool result ==
      %{"content" => [%{"type" => "text", "text" => err}], "isError" => true}. Then ro = fresh temp dir,
      File.chmod!(ro, 0o500), on_exit(fn -> File.chmod(ro, 0o700) end); {"", err, 1} = CtxFixture.run(binary, root,
      ro, ["search", "the"]); assert String.starts_with?(err, "kogen-ctx: cannot write index at " <>
      CtxFixture.index_path(ro, root) <> ":") and String.ends_with?(err, "; set KOGEN_CTX_HOME to a writable
      directory\n"); mcp_file(root, ro, [search {query "the"} as id 1, ping as id 2]) → exit 0, and id 1's result ==
      %{"content" => [%{"type" => "text", "text" => err}], "isError" => true}; id 2's result == %{}.
  proof:
    offline: [test/kogen/ctx_mcp_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: MCP stdio and CLI runs of the same local binary on one fixture"
    affected_paths: [native/kogen-ctx/src/**, test/kogen/ctx_mcp_test.exs]
