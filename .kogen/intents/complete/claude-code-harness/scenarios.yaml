  given: A user reads the README.
  when: They set up and run Kogen.
  then: The README documents choosing a harness, Claude Code install/login/status (subscription or Console API billing), the proven Claude models, that only the configured harness's paid targets run, and that switching harness is a config change plus the harness's paid verification; Codex documentation remains for the Codex adapter.
  wrong_result: Docs claim Claude Code replaced Codex, omit the separate Kogen login, or describe Claude subscription use through other harnesses.
  verified_by: [check]
  evidence: README review plus the existing documentation integrity checks.
  proof:
    offline: [test/kogen/core_integrity_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: documentation integrity consumer and Review"
