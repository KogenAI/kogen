# Run Kogen on Claude Code (harness name: claude) through a pluggable harness; Codex stays as a second adapter.
# Every Kogen claude invocation uses --dangerously-skip-permissions; no permission prompts and no sandbox.

- id: pluggable-harness
  given: .kogen/config.yaml names harness codex or claude, with per-role model and effort.
  when: Shaping, Build Developer turns, exact resumes, Reviews and helper routing run.
  then: Build, the Shape task and provider-outcome handling call one harness interface; the configured adapter supplies install/readiness, launch context, fresh and resumed structured Developer turns, Reviewer verdicts and the interactive Shaper. Codex behavior is unchanged behind the interface; claude (Claude Code) is a second adapter. Any other harness name is rejected with the supported list. Kogen.Check and the Stop runner stay harness-independent.
  wrong_result: Build or Shape keep Codex-specific calls, Claude Code is bolted in with conditionals throughout Build, or Codex behavior changes.
  verified_by: [check]
  evidence: Harness contract tests run the same Build lifecycle suites against the fake Codex and the fake Claude Code; config tests cover both names and a rejected name.
  proof:
    offline: [test/kogen/harness_contract_test.exs, test/kogen/intent_test.exs, test/kogen/lifecycle_test.exs]
    paid_target: none
    paid_reason: "offline-sufficient: both adapters driven through the same Build consumer with fake executables"
    affected_paths: [lib/kogen/harness.ex, lib/kogen/harness, lib/kogen/build.ex, lib/kogen/provider_outcome.ex, lib/kogen/intent.ex, lib/mix/tasks/kogen.shape.ex, test/kogen/harness_contract_test.exs, test/kogen/intent_test.exs, test/kogen/lifecycle_test.exs, test/support]

- id: codex-offline-preserved
