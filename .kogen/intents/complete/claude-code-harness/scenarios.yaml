  when: make check runs while the repository configuration selects claude.
  then: Every existing Codex offline test and the live-native rehearsal still pass without provider access, proving Codex remains a working plug-in adapter; Codex paid targets are simply not selected while it is inactive.
  wrong_result: Codex tests are deleted, skipped or weakened to make room for Claude Code, or the live-native catalog entry is changed.
  verified_by: [check]
  evidence: The unchanged Codex offline suites and catalog rehearsals in make check.
  proof:
