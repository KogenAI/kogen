      - test/kogen/superseded_objection_test.exs

- id: same-candidate-failed-only-retry
  given: >-
    Selected targets `check`, paid target A, and paid target B, in catalog order.
    In cycle 1, `check` and A passed and B failed.
  when: >-
    The Developer's resumed turn ends (a) with a byte-identical Candidate,
    (b) with any changed byte, or (c) in a new outer attempt.
  then: >-
    (a) Cycle 2 runs `check` fresh and reuses A's receipt, marked with
    `reused_from` pointing to cycle 1 and with an identical Candidate id and
    catalog digest. It runs only B. The final receipts list every target, and
    the handoff report and the review packet show A as reused.
    (b) Every target runs.
    (c) The new context runs every target and reuses nothing.
    More generally, every selected target with `provider_backed: false` runs fresh
    every cycle, whatever its name. Only `provider_backed: true` receipts are
    ever reused.
    A failed or never-run target is never reused. A reused receipt whose Candidate
    id, catalog digest, context or cycle binding doesn't match is rejected as an
    integrity failure.
  wrong_result: >-
    A reruns on an unchanged Candidate; `check` is skipped; A is reused after a
    change or across outer attempts; a failed receipt is reused; or the report
    hides the reuse.
  verified_by: [check]
  evidence: >-
    A focused test with counting fake Make targets records exactly which targets
    ran in each case, plus forged and stale reuse controls.
  proof:
    offline:
      - test/kogen/verification_reuse_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: counting fake targets through the controller runner, with stale and forged reuse controls; reuse is decided purely by the controller"
    affected_paths:
      - lib/kogen/build/verification.ex
      - lib/kogen/build/verification_runner.ex
      - lib/kogen/build/report.ex
      - lib/kogen/build/review_packet.ex
      - test/kogen/verification_reuse_test.exs

- id: bound-per-target-receipts
  given: A controller verification cycle in which targets pass, fail, or leave processes behind.
  when: Each target finishes.
  then: >-
    Each receipt records the target, status, exit code, Candidate id, attempt
    token, context sha256, catalog sha256, cycle sequence, start and finish time,
    elapsed milliseconds, the output log path and sha256, and cleanup status. The
    controller runs each target in its own process group and, after exit,
    terminates any remaining group members. A target that leaves members that
    can't be reaped gets `cleanup: failed` and a failed receipt. Status comes from
    the exit code and cleanup only. A target-evidence manifest is snapshotted on
    pass *and* fail. Settlement rejects receipts with a mismatched binding, a
    rolled-back history or an altered log digest.
  wrong_result: >-
    A receipt lacks its Candidate or catalog binding; owner-printed text changes
    the status; a leftover process is ignored; or failed-target evidence is
    dropped.
  verified_by: [check]
  evidence: >-
    Focused tests with fake targets that pass, fail, spawn a lingering child,
    and emit a manifest. They assert every binding field of each receipt, that
    a target printing "PASS" with a nonzero exit gets a failed receipt, and that
    settlement rejects a receipt whose Candidate id or catalog digest was
    edited.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
      - test/kogen/target_evidence_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: controller runner with real child processes and a manifest-emitting fake target; no provider semantics are involved"
    affected_paths:
      - lib/kogen/build/verification_runner.ex
      - lib/kogen/build/verification.ex
      - lib/kogen/build/target_evidence.ex
      - test/kogen/controller_verification_test.exs
      - test/kogen/target_evidence_test.exs

