- id: controller-owns-verification
  given: >-
    A Build started under the new controller, on any configured route
    (including the hybrid routes from cross-harness-adversarial-roles), whose
    Developer turn has just ended. The Stop registration still exists, but no
    v1 context is supplied.
  when: The controller settles verification for that turn.
  then: >-
    The parent controller, running the trusted code the Build started with,
    computes the Candidate id itself (a private-index git write-tree, refusing
    assume-unchanged and skip-worktree entries). It runs `make check`, then the
    selected targets in catalog order, as child processes outside the Developer
    process tree. It re-checks the Candidate id after each target; a mutation
    fails the cycle. It writes the only context, state and history files, and no
    Developer-launched process gets their paths or `KOGEN_VERIFICATION_CONTEXT`.
    It is also the only writer of the local Verification Record and its history
    (`Kogen.Check.record_path/0`, `Kogen.Check.history_path/0`). After each cycle
    it writes them in today's line format (candidate, status, target, exit_code,
    session_id, attempt_token, finished_at), and it archives and resets them only
    at each outer attempt, as today. The record's `target` field keeps the
    constant `check` as a format value for existing readers; it selects nothing.
    So the unedited live-reviewer-rework owner and its support files
    (`test/kogen/live_reviewer_rework_test.exs`,
    `test/support/live_reviewer_rework_fixture.ex`,
    `test/support/live_rework_audit.ex`) keep working, and this Intent leaves
    them byte-identical, because it doesn't run that target.
    This holds even when the controller itself inherited one: for example, a
    nested `mix kogen.build` started by a target under main's Stop runner
    inherits the outer v1 context. The new controller explicitly removes `KOGEN_VERIFICATION_CONTEXT`
    and `KOGEN_TRACKING_CONTEXT` from every Developer, Reviewer and target child
    environment. That way a nested fixture's Stop hook can't write to the outer
    Build's state.
    The Stop hook does nothing. Handoff, Jev and Review read only this
    controller settlement. A complete Build through the new controller shows a
    failed-then-passed controller verification across a resume of the same
    Developer session, followed by Review and commit.
  wrong_result: >-
    The controller loads or executes verification code from the Candidate;
    reads success from a Candidate- or Developer-writable file; the Stop hook
    runs checks or blocks; the Developer gets a verification context, including
    one inherited from an outer Build's Stop runner;
    live_shape_to_build still asserts Stop-hook history; or no process writes the
    local Verification Record and history any more (or they are archived on every
    inner cycle), so the unedited live-reviewer-rework audit fails in the next
    Build that runs it.
  verified_by: [check, live-shape-to-build]
  evidence: >-
    A new controller verification test uses a fake harness to drive a turn end,
    controller-run check and targets, and forged Candidate state files that are
    ignored. A Candidate-planted module and script with the controller's
    verification names leave a sentinel only if loaded or run; the test asserts
    no sentinel, and that a counting Stop script run with no context runs no
    target and never blocks. It also plants an inherited outer `KOGEN_VERIFICATION_CONTEXT` and
    asserts that no launched child sees it and the outer state is untouched. It
    asserts that a failed-then-passed cycle pair leaves local Verification Record
    and history lines with the fields `Kogen.LiveReworkAudit` reads, and that the
    history is archived only when an outer attempt starts. The
    updated verification_ownership_lifecycle test runs a complete fake-harness
    Build through `Kogen.Build`, with real Make targets and a git fixture: a
    failed verification, a resume of the same session, a passed verification,
    Review and commit. `live_shape_to_build_test.exs` is updated to assert
    controller-owned failed-then-passed history for the same real Developer
    session. The value the Developer needs (`shape2build-k4q9z`) must now reach
    it through the controller's resume message, not through Stop output. The
    live test rsyncs the Candidate into its fixture and runs `mix kogen.build`
    there, which compiles and runs the Candidate's new controller (not main's,
    which only runs the outer Build). So the paid run observes the new route
    with a real Claude Code session.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
      - test/kogen/verification_ownership_lifecycle_test.exs
    paid_target: live-shape-to-build
    paid_reason: "provider-required: live-shape-to-build; observation: a real Claude Code Developer (the nested fixture Build runs on the repository's `default_route: claude`, so its Developer and Reviewer are Claude Code; the default-route flip is ROADMAP 10a, not this Intent) ends a turn with the Stop hook inactive, receives the controller's failed verification through a resume of the same session, fixes it, and a later controller verification passes before real Review and commit; offline-limit: a fake harness cannot show that a real model session acts on a controller resume message or that the real CLI accepts the inactive Stop hook"
    affected_paths:
      - lib/kogen/build.ex
      - lib/kogen/build/verification.ex
      - lib/kogen/build/verification_runner.ex
      - lib/kogen/check.ex
      - test/kogen/controller_verification_test.exs
      - test/kogen/verification_ownership_lifecycle_test.exs
      - test/kogen/live_shape_to_build_test.exs
      - test/support/fake_claude

- id: failed-verification-resumes-same-developer
  given: >-
    `verification_retries: 2` and a controller verification cycle that has failed.
  when: The controller handles the failed cycle.
  then: >-
    The controller resumes the exact Developer session with
    `resume_build_developer`. The resume names the failed target and its receipt
    and log paths. It counts against `verification_retries` and never the outer
    allowance. The third consecutive failure since the last pass marks
    verification exhausted and stops the Build, before Jev and Review and ahead
    of other routing. A Review or unfinished-work outer resumption starts a new
    verification context, and its handoff needs a fresh controller pass.
    The superseded-objection rule from bounded-reviewer-evidence keeps working
    on controller cycles: a confident Developer objection in an attempt whose
    settled controller verification passed after an earlier controller cycle
    of the same attempt failed reaches the review packet as a labelled advisory.
    Every other confident objection still stops with `cannot_comply` as before.
  wrong_result: >-
    A verification failure consumes an outer resumption, launches a fresh
    Developer, reaches Review, or keeps retrying past the limit; an outer
    resumption reaches Review on the prior attempt's pass; or the
    superseded-objection rule still reads Stop-written cycles, so under the new
    controller every stale objection stops the Build again.
  verified_by: [check]
  evidence: >-
    Fake-harness lifecycle tests count exact resumes, allowance counters,
    exhaustion precedence and the fresh context per outer attempt. The
    superseded-objection tests from bounded-reviewer-evidence run their three
    cases on controller-written cycles.
  proof:
    offline:
      - test/kogen/controller_verification_test.exs
      - test/kogen/two_outer_resumptions_test.exs
      - test/kogen/superseded_objection_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: fake-harness resume counting and exhaustion precedence through Kogen.Build; resume_build_developer itself is unchanged"
    affected_paths:
      - lib/kogen/build.ex
      - lib/kogen/build/verification.ex
      - lib/kogen/build/review_packet.ex
      - priv/kogen/prompts/developer.md
      - test/kogen/controller_verification_test.exs
