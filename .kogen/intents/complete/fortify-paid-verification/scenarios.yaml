- id: controller-runs-proof-selectors
  given: >-
    An admission catalog that declares `verification_surface` (`tests` and
    `runner` globs), `focused_runner` (an argv template with `{paths}`) and
    `base_cache` (paths to copy). A contract whose scenarios carry the new
    `proof.base` field: `fail` for new or changed behaviour, `pass` for
    preservation.
  when: The controller verifies each Developer turn.
  then: >-
    After the targets pass, the controller itself runs each scenario's file
    selectors on the Candidate, using the admission `focused_runner`. A failure
    is a verification failure through the normal retry path. This replaces the
    existence-only check (`verification_plan.ex:94-103`).
    For `base: fail`, it also runs them against the base. At admission it builds
    a controller-owned workspace outside the repository: `git archive` of the
    admission commit plus copies of `base_cache`. It records the workspace's
    digest and re-checks it before each use; on a mismatch it rebuilds the
    workspace. The catalog loader rejects a `base_cache` entry inside the
    controller's volatile state (`.kogen/runtime`, `.kogen/build.lock`,
    `.kogen/codex`, `.codex/sessions`), so the base workspace never inherits
    the running Build's lock or runtime. Every focused run there uses the
    workspace's own `MIX_BUILD_PATH` and resolves `priv/` and prompts inside
    the workspace, never from the parent checkout or the controller's
    application directory. Each cycle it overlays only the Candidate's bytes for that
    scenario's selector files and changed test-class files, never runner-class
    or implementation files. It runs the admission `focused_runner` there with a
    time limit. The run must exit nonzero. Exit zero fails verification as
    "proof cannot detect the change". A timeout or infrastructure error is an
    error, never a red result. The red receipt records the base commit, overlay
    digest, exit code, log path and digest, and a `red_kind` label (`assertion`
    or `load`). It is reused while the overlay digest is unchanged.
    For `base: pass`, a selector that differs from base becomes a ledger item.
    The controller also runs base's bytes of that selector on the Candidate,
    and they must pass there.
    A contract without `proof.base` still validates. Its base checks are
    skipped, and the report labels it `unproven-on-base`. A catalog without the
    integrity fields labels every scenario `integrity-not-configured`. Non-file
    selectors (rehearsal ids, root `.txt` fixtures, `scripts/check` files)
    stay existence-checked, and are labelled as such.
  wrong_result: >-
    An empty selector, `assert true`, or a scenario test hidden behind `:live`
    or a skip counts as proof; the red run uses the Candidate's runner or
    Candidate implementation files; a timeout counts as red; a tampered base
    workspace is reused; an edited preservation test passes without running
    base's bytes; or legacy contracts are rejected instead of labelled.
  verified_by: [check]
  evidence: >-
    Controller tests use a fixture repository with a small ExUnit project and
    an admission catalog with the integrity fields. They cover: a real `fail`
    selector that is red on base and green on the Candidate; an empty selector
    and an `assert true` selector (both rejected); a `:live`-tagged selector
    (rejected); a runner file edited in the Candidate (the red run still uses
    base's runner); a tampered workspace digest; a `pass` selector weakened in
    the Candidate (base bytes fail on the Candidate); a legacy contract
    (labelled); a timeout (error, not red); removal of the temporary
    workspace; a `base_cache` entry naming `.kogen/build.lock` (rejected); and
    a base run whose `priv/` file differs from the parent checkout's, which
    must read the workspace's copy.
  proof:
    offline:
      - test/kogen/proof_selector_verification_test.exs
      - test/kogen/intent_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: the controller runs real focused tests in a fixture project against a real git-archive base; no provider semantics"
    affected_paths:
      - lib/kogen/build.ex
      - lib/kogen/build/contract.ex
      - lib/kogen/build/verification_plan.ex
      - lib/kogen/build/verification.ex
      - lib/kogen/build/verification_runner.ex
      - lib/kogen/build/base_workspace.ex
      - lib/kogen/build/report.ex
      - lib/kogen/git.ex
      - priv/kogen/prompts/shaping.md
      - README.md
      - test/kogen/proof_selector_verification_test.exs
