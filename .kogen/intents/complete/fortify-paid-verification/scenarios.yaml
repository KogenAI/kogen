- id: verification-surface-ledger
  given: >-
    A Candidate that changes, adds, deletes or renames files matching the
    admission catalog's `verification_surface` globs, including paths outside
    every scenario's `affected_paths`.
  when: The controller prepares the handoff report and Review.
  then: >-
    The controller computes a ledger from git (Candidate against base). For
    every changed surface path it records the status, the full diff and whether
    it is runner-class. It marks every target receipt that ran with changed
    runner-class files, and includes the catalog digest change. Added
    test-class files are left out; added runner-class files are included. The
    ledger goes into the handoff report and the review packet from
    bounded-reviewer-evidence, never to Jev. Each item's full diff is a
    controller-retained file under the attempt's verification directory. The
    packet carries one complete index entry per item (path, status,
    runner-class flag, diff stat, base and Candidate blob ids), plus a locator
    and sha256 for its full diff. It stays within the packet's 65,536-byte
    bound, and it never inlines a diff that would exceed it. The
    controller also runs base's test suite against the Candidate's
    implementation. Base's test files and runner go into the base workspace,
    with only the Candidate's implementation (non-surface) files overlaid. The
    result goes to Review as a packet summary with a log locator, a report and
    not a gate. The Reviewer must return exactly one disposition per ledger
    item, `justified: <scenario-id or finding-id>` or `weakening`, in a new
    `ledger` verdict field, kept separate from the existing finding
    `dispositions`. The field is required exactly when the packet carries a
    nonempty ledger. Without a ledger (for example when main's controller
    reviews this Build with the Candidate's `reviewer.md`), the verdict keeps
    today's exact keys. Both harnesses constrain the Reviewer's output with
    `Kogen.Harness.Verdict.schema/0` (Claude `--json-schema`, Codex
    `--output-schema`, both `additionalProperties: false`) and check exact keys
    in `Verdict.validate/1`. So the schema handed to a fresh Reviewer on either
    harness is chosen per launch: with a nonempty ledger it adds a required
    `ledger` array (one item per ledger path, `path` and `disposition`);
    without one it is byte-identical to today's schema. `Verdict.validate/1`
    and `Contract.verdict/4` accept `ledger` exactly when it was requested. A
    missing or extra disposition makes the Review malformed, through the
    existing malformed-verdict path. A
    `weakening` disposition opens a blocking finding that goes back to the same
    Developer as Review rework. If the Developer objects to the contract, the
    existing cannot-comply path returns the Intent to Shaping.
  wrong_result: >-
    A weakened test outside `affected_paths` never reaches Review; the ledger
    or diff goes to Jev; the Reviewer can skip items; a `weakening` verdict
    doesn't block; the base-suite report acts as a gate or is missing; full
    diffs are inlined until the packet exceeds its bound; ledger dispositions
    are folded into the finding `dispositions`; or `ledger` is demanded when no
    ledger was supplied, so main's controller rejects this Build's own verdict.
  verified_by: [check]
  evidence: >-
    Report and Review tests use a fixture Candidate that edits a test outside
    `affected_paths`, weakens a runner file and adds a test file. They assert
    the ledger contents, that the Jev request excludes them, the malformed
    verdict on a missing disposition, the blocking finding on `weakening`, the
    base-suite report, a packet within its bound for a ledger with large diffs
    (with locators and digests), and a verdict without `ledger` accepted when
    no ledger was supplied. The fake Claude and fake Codex Reviewers record the
    schema argument they were launched with: it contains `ledger` only with a
    ledger, and equals today's `Verdict.schema/0` bytes without one.
  proof:
    offline:
      - test/kogen/verification_surface_ledger_test.exs
      - test/kogen/check_settlement_test.exs
      - test/kogen/review_packet_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: ledger computation, verdict schema enforcement and routing are controller logic exercised with a fake Reviewer; no provider semantics"
    affected_paths:
      - lib/kogen/build.ex
      - lib/kogen/build/report.ex
      - lib/kogen/build/ledger.ex
      - lib/kogen/build/review.ex
      - lib/kogen/build/review_packet.ex
      - lib/kogen/build/contract.ex
      - lib/kogen/build/base_workspace.ex
      - lib/kogen/harness/verdict.ex
      - lib/kogen/harness/claude.ex
      - lib/kogen/harness/codex.ex
      - test/support/fake_claude
      - test/support/fake_codex
      - lib/kogen/jev.ex
      - priv/kogen/prompts/reviewer.md
      - README.md
      - test/kogen/verification_surface_ledger_test.exs
      - test/kogen/check_settlement_test.exs
      - test/kogen/review_packet_test.exs

- id: offline-first-target-selection
  given: >-
    A Shaper shaping an Intent in Kogen or another repository, with provider-backed
    targets in the catalog.
  when: The Shaping Controller chooses each scenario's `verified_by`.
  then: >-
    Kogen's shared Shaping prompt (`priv/kogen/prompts/shaping.md`) describes
    `verified_by` as the complete explicit list, with no implicit `check`. It
    says to select a provider-backed target only when the scenario claims a
    provider-only observable that offline proof can't establish. The fact that
    an existing live test exercises the changed path isn't a reason on its own.
    Deterministic orchestration is proved offline, including through a
    complete fake-harness run. The prompt replaces the current wording "Select
    targets by affected existing workflows ... even when their live test files
    are unchanged" and keeps the `provider-required` or `offline-sufficient`
    reason format. Kogen's own README gains a maintained "Choosing verification
    targets" section, read by Shaping as repository context. Kogen's
    orchestration (controller, plan, receipts, tracking, reports, Jev plumbing,
    guards and catalog rules) is offline-only. Prompt wording is offline-only
    unless the scenario claims a model-behaviour outcome. A paid target is
    reserved for native harness launch, resume or flags; native hook
    registration consumed by a real CLI; managed runtime upgrades; and parsing
    new provider output shapes. An Intent that edits a live test's owner file
    selects that test's target in the same Intent, because an edited live test
    that never runs is unverified. Otherwise an Intent selects at most one paid
    target, unless the Shaper explicitly accepts more, with the reason recorded
    in `questions.md`.
  wrong_result: >-
    The prompt still steers toward live targets for unchanged live tests; still
    shows `[check]` as mandatory; drops the paid-reason format; or the Kogen
    policy lives only in the transcript and not in maintained README text.
  verified_by: [check]
  evidence: >-
    Existing prompt-contract tests (scenario_contract, shape_task) assert the new
    selection wording, the removed "even when their live test files are
    unchanged" wording, and the README section headings and rules.
  proof:
    offline:
      - test/kogen/scenario_contract_test.exs
      - test/kogen/shape_task_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: maintained prompt and README content is asserted by prompt-contract tests; whether a future model follows it is not a claim of this scenario"
    affected_paths:
      - priv/kogen/prompts/shaping.md
      - README.md
      - test/kogen/scenario_contract_test.exs
      - test/kogen/shape_task_test.exs

- id: self-hosting-two-step-guidance
  given: >-
    A future Shaping session in this repository for an Intent that removes or
    replaces something Kogen's own Build process depends on while that Build is
    running.
  when: The Shaping Controller reads `README.md`, as every Kogen Shaping session does.
  then: >-
    Kogen's `README.md`, not the shared Shaping prompt, has a maintained
    section explaining that Kogen builds itself. A Build runs main's controller,
    the code loaded when `mix kogen.build` started, against a Candidate that is
    changing the same machinery. Removals therefore follow expand and contract,
    like a zero-downtime database migration. One Intent adds the new path,
    switches the new controller to it, and keeps the old path working for the
    running controller. The next Intent, built under the new controller,
    removes the old path. The section lists, with source locations as of this
    commit, what the running controller reads or runs from the Candidate during
    a Build:
    the catalog and its change rules;
    the Make target definitions;
    the admission catalog's integrity fields;
    the files and registrations `VerificationPolicy.preflight` requires;
    the Stop scripts and registrations (bootstrap only);
    the guarded-path check;
    and the approved package.
    It gives this Intent and its follow-up verification Intent as the worked
    example: the Stop scripts are kept for the v1 context and removed next, and
    the `live-native` split is done next through declared catalog changes. It tells
    Shaping to check each Intent that touches these inputs, and to split it
    when one Build can't both change the input and still settle, review and
    commit.
  wrong_result: >-
    The guidance goes into `priv/kogen/prompts/shaping.md`, so it affects other
    projects; it names no concrete inputs; it describes main's pre-Intent
    freeze instead of the controller this Intent ships; or it lives only in this
    Intent package.
  verified_by: [check]
  evidence: >-
    A README content test asserts the section heading, each listed input with
    its source location, and the worked example, and asserts that the shared
    Shaping prompt doesn't contain the Kogen-specific section.
  proof:
    offline:
      - test/kogen/readme_guidance_test.exs
    paid_target: none
    paid_reason: "offline-sufficient: maintained README content asserted by a focused test; no provider semantics"
    affected_paths:
      - README.md
      - test/kogen/readme_guidance_test.exs

- id: shape-to-build-retains-record-sidecars
  given: >-
    The live Shape-to-Build fixture (`test/kogen/live_shape_to_build_test.exs`),
    whose nested Build may cite its own tracking record. Since
    bounded-reviewer-evidence, such a citation is stored as metadata plus an
    immutable sidecar at
    `.kogen/runtime/scenario-tracking/<build-id>/record-versions/<sha256>.json`
    (`Kogen.Build.Tracking.retain_record_version/2`), and
    cross-harness-adversarial-roles made `Kogen.Build.Evidence.resolve/2`
    verify every bound sidecar, found beside the resolved record
    (`record-versions/<sha256>.json`) or at its checkout-relative locator. That
    Intent fixed only the Reviewer-rework fixture
    (`Kogen.ReviewPacketAudit.preserve_record_versions!/2`, called from
    `test/support/live_reviewer_rework_fixture.ex`). At 363c20af the Shape
    fixture's private `preserve_tracking/3` still copies only `record.json`.
  when: >-
    The live test retains the nested Build's evidence, deletes the fixture, and
    calls `Kogen.LiveReworkAudit.audit_retained!/1` on the retained copy.
  then: >-
    A new support module `test/support/live_tracking_retention.ex`
    (`Kogen.LiveTrackingRetention.preserve!/3`) replaces the test's private
    `preserve_tracking/3`, and both of the test's retention call sites call it.
    For each nested Build it copies the whole
    `.kogen/runtime/scenario-tracking/<build-id>/` directory into
    `<log_dir>/scenario-tracking/<build-id>/`: `record.json`, its
    `record-versions/` sidecars, `review-packets/`, and the controller
    verification directory this Intent writes there (receipts, logs, ledger
    diffs). It rewrites each `build-summary*.json` `full_record.path` to the
    retained record, as today. After the fixture is deleted,
    `Evidence.resolve/2` of the retained summary succeeds. A missing or altered
    retained sidecar still fails resolution with "sidecar unavailable" or
    "sidecar mismatch". `Evidence.resolve/2` itself is unchanged.
  wrong_result: >-
    Only `record.json` is copied, so a nested Build that cited its record fails
    the retained-evidence audit after cleanup (the failure of Build
    o-DlRi_iHnqIwmxfcCz-obe0 in the Reviewer-rework fixture); the live test
    keeps its own copy loop beside the new module; or resolution is weakened
    to skip missing sidecars.
  verified_by: [check, live-shape-to-build]
  evidence: >-
    A focused offline case in build_evidence_test builds a synthetic fixture
    whose record cites itself (a real sidecar written by
    `Tracking.retain_record_version/2`) plus a `build-summary.json`, runs
    `Kogen.LiveTrackingRetention.preserve!/3`, deletes the fixture, and asserts
    `LiveReworkAudit.audit_retained!/1` returns `:ok`. Two controls follow: a
    retained sidecar deleted (raises, "sidecar unavailable"), and one altered
    (raises, "sidecar mismatch"). The same case asserts that
    `test/kogen/live_shape_to_build_test.exs` no longer defines
    `preserve_tracking` and calls `Kogen.LiveTrackingRetention.preserve!`. The
    paid run retains the real nested Build's tree and resolves it after
    cleanup.
  proof:
    offline: [test/kogen/build_evidence_test.exs]
    paid_target: live-shape-to-build
    paid_reason: "provider-required: live-shape-to-build; observation: the retained tree of a real nested Shape-to-Build run, including any record-version sidecars its real roles produced, resolves after the fixture is deleted; offline-limit: whether a real run cites its record is model behaviour, so the synthetic offline case carries the sidecar controls"
    affected_paths: [test/support/live_tracking_retention.ex, test/kogen/live_shape_to_build_test.exs, test/kogen/build_evidence_test.exs, priv/kogen/test-reliability.yaml]
